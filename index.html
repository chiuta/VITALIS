const mem={};
const store={
  g(k,d){try{const v=localStorage.getItem('vitalis.'+k);if(v==null)return has(mem,k)?mem[k]:d;return JSON.parse(v)}catch(e){return has(mem,k)?mem[k]:d}},
  s(k,v){mem[k]=v;try{localStorage.setItem('vitalis.'+k,JSON.stringify(v))}catch(e){}}
};
const LABRE=/^\d+(\.\d+)?(e[+-]?\d+)?$/i;
const SAN={
 lang:v=>typeof v==='string'&&has(LANGS,v)?v:null,
 theme:v=>v==='light'||v==='dark'?v:null,
 probs:v=>Array.isArray(v)?[...new Set(v.filter(x=>typeof x==='string'&&has(PROBS,x)))]:[],
 agenda:v=>Array.isArray(v)?[...new Set(v.filter(x=>AGENDA.some(a=>a[0]===x)))]:[],
 prep:v=>Array.isArray(v)?[...new Set(v.filter(x=>PREPIDS.includes(x)))]:[],
 labsex:v=>v==='f'?'f':'m',
 fast:v=>{const o={start:null,goal:16};if(isObj(v)){if(FGOALS.includes(v.goal))o.goal=v.goal;const n=Date.now();if(typeof v.start==='number'&&isFinite(v.start)&&v.start<=n+60000&&v.start>n-30*864e5)o.start=v.start}return o},
 qa:v=>{const o={};if(isObj(v))QIDS.forEach(k=>{if(Number.isInteger(v[k])&&v[k]>=0&&v[k]<=3)o[k]=v[k]});return o},
 qhist:v=>Array.isArray(v)?v.filter(h=>isObj(h)&&typeof h.d==='number'&&isFinite(h.d)&&typeof h.o==='number'&&h.o>=0&&h.o<=1).slice(-30).map(h=>({d:h.d,o:h.o})):[],
 labs:v=>{const o={};if(isObj(v))LABS.forEach(L=>{const x=v[L.id];if(typeof x==='string'&&x.length<=24&&LABRE.test(x))o[L.id]=x});return o},
 ritual:v=>{const o={days:{},custom:[]};if(!isObj(v))return o;
  if(isObj(v.days))Object.keys(v.days).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort().slice(-800).forEach(k=>{const a=v.days[k];if(Array.isArray(a))o.days[k]=[...new Set(a.filter(x=>typeof x==='string'&&/^[A-Za-z0-9_-]{1,24}$/.test(x)))].slice(0,40)});
  if(Array.isArray(v.custom)){const seen=new Set();v.custom.forEach(c=>{if(o.custom.length<MAXCUSTOM&&isObj(c)&&typeof c.id==='string'&&/^c[a-z0-9]{1,16}$/.test(c.id)&&!seen.has(c.id)&&typeof c.l==='string'&&c.l.trim()){seen.add(c.id);o.custom.push({id:c.id,l:c.l.trim().slice(0,60)})}})}
  return o}
};

let cur='home';
function renderNav(){const n=$('#nav');n.setAttribute('aria-label',t('nav.aria'));n.innerHTML=TABS.map(([id,ic])=>`<button type="button" data-tab="${id}"${id===cur?' aria-current="page"':''}>${ic} ${esc(t('nav.'+id))}</button>`).join('')}
function go(id,user){
  if(!TABS.some(x=>x[0]===id))id='home';
  if(cur==='tools'&&id!=='tools'&&brOn)brStop();
  cur=id;
  $$('.view').forEach(v=>v.hidden=v.id!=='v-'+id);
  $$('#nav button').forEach(b=>b.dataset.tab===id?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  const sel=$('#nav [aria-current]');if(sel&&sel.scrollIntoView){try{sel.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}}
  try{history.replaceState(null,'','#/'+id)}catch(e){}
  if(user){window.scrollTo({top:0});const h=$('#v-'+id+' h2');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}}
  if(id==='tools')recalcAll();
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go,true);return}
  const tb=e.target.closest('#nav button');if(tb){go(tb.dataset.tab,true)}
});

function tickCd(){
  const now=Date.now(),el=$('#cd'),nt=$('#cdnote');
  if(now>EVENT_END){el.innerHTML='';nt.textContent=t('cd.done');return}
  if(now>=EVENT_START){el.innerHTML='';nt.textContent=t('cd.live');return}
  let s=Math.floor((EVENT_START-now)/1000);const d=Math.floor(s/86400);s-=d*86400;const h=Math.floor(s/3600);s-=h*3600;const m=Math.floor(s/60);s-=m*60;
  el.innerHTML=[[d,'d'],[h,'h'],[m,'m'],[s,'s']].map(([v,k])=>`<div><b>${pad(v)}</b><small>${esc(t('cd.'+k))}</small></div>`).join('');
  nt.textContent=t('cd.until');
}

const rowH=(name,val,st,note)=>`<div class="row"><div><b>${esc(name)}</b>${note?`<small>${esc(note)}</small>`:''}</div><div style="text-align:right"><span class="val">${esc(val)}</span> ${st?`<span class="pill ${st}">${esc(t('st.'+st))}</span>`:''}</div></div>`;

function checker(){let bad=false;return{c(sel,r){const v=num(sel);if(isNaN(v)){if($(sel).value.trim()!=='')bad=true;return null}if(!inR(v,r)){bad=true;return null}return v},get bad(){return bad}}}

  if(w!==null&&h!==null){const v=w/h;o+=rowH(t('o.whtr'),nf(v,2),v<0.5?'ok':v<0.6?'watch':'flag','< 0.50 · 0.50–0.59 · ≥ 0.60')}

  vals.forEach((_,i)=>{s+=`<line class="axis" x1="${c}" y1="${c}" x2="${P(i,R)[0].toFixed(1)}" y2="${P(i,R)[1].toFixed(1)}"/>`;const q=P(i,R+22);s+=`<text x="${q[0].toFixed(1)}" y="${q[1].toFixed(1)}" aria-hidden="true">${PILLARS[i].ic}</text>`});

function renderMyths(){
  const open=new Set($$('#myths details[open]').map(d=>d.dataset.m));
  $('#myths').innerHTML=MYTHS.map(id=>`<details data-m="${id}" ${open.has(id)?'open':''}><summary><span>${esc(t('my.m'))}:</span> ${esc(t('my.'+id+'.m'))}</summary><p><b>${esc(t('my.r'))}:</b> ${esc(t('my.'+id+'.r'))}</p></details>`).join('');
}

/* ---------- theme / lang / data ---------- */
const sysLight=()=>{try{return matchMedia('(prefers-color-scheme: light)').matches}catch(e){return false}};
const effTheme=()=>document.documentElement.dataset.theme||(sysLight()?'light':'dark');
function setTheme(th,persist){document.documentElement.dataset.theme=th;if(persist)store.s('theme',th);const m=$('meta[name=theme-color]');if(m)m.content=th==='light'?'#f4f8f7':'#0a1013'}
{const th=load('theme',null);if(th)setTheme(th,false)}
$('#theme').addEventListener('click',()=>setTheme(effTheme()==='light'?'dark':'light',true));
$('#lang').innerHTML=Object.entries(LANGS).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('');
$('#lang').addEventListener('change',e=>{if(!has(LANGS,e.target.value))return;lang=e.target.value;store.s('lang',lang);renderAll()});

$('#exp').addEventListener('click',()=>{
  const o={};EXPORT_KEYS.forEach(k=>{const v=SAN[k](store.g(k,undefined));if(v!=null)o[k]=v});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'VITALIS',v:1,version:VERSION,exported:new Date().toISOString(),data:o},null,1)],{type:'application/json'}));
  a.download='vitalis-data-'+dkey(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});
$('#imp').addEventListener('click',()=>$('#impf').click());
$('#impf').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  if(f.size>1048576){alert(t('ft.imp.big'));return}
  const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);if(!isObj(j)||j.app!=='VITALIS'||!isObj(j.data))throw 0;
    EXPORT_KEYS.forEach(k=>{if(has(j.data,k)){const v=SAN[k](j.data[k]);if(v!=null)store.s(k,v)}});alert(t('ft.imp.ok'));location.reload()}catch(err){alert(t('ft.imp.err'))}};
  r.onerror=()=>alert(t('ft.imp.err'));r.readAsText(f);
});
$('#rst').addEventListener('click',()=>{if(!confirm(t('ft.resetq')))return;try{Object.keys(localStorage).filter(k=>k.startsWith('vitalis.')).forEach(k=>localStorage.removeItem(k))}catch(e){}location.reload()});

/* ---------- boot ---------- */
function renderAll(){
  [applyI18n,renderNav,renderHome,renderEvent,renderPillars,fillAct,recalcAll,renderQuiz,renderRes,renderLabs,renderRitual,renderGloss,renderMyths,tickCd].forEach(fn=>{try{fn()}catch(err){console.error(fn.name,err)}});
}
renderAll();
go((location.hash||'').replace(/^#\/?/,'')||'home');
window.addEventListener('hashchange',()=>{const h=(location.hash||'').replace(/^#\/?/,'');if(h&&h!==cur)go(h)});
setInterval(()=>{tickCd();if(fa.start)faTick();dayCheck()},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){dayCheck();tickCd();faTick()}});
if(/^https?:$/.test(location.protocol)){
  try{const l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l);
  const a=document.createElement('link');a.rel='apple-touch-icon';a.href='icon-192.png';document.head.appendChild(a)}catch(e){}
  if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
})();
</script>
</body>
</html>
