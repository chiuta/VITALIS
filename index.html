ique du métabolisme · insulinorésistance","sp.bik.b":"Chercheur sur l'obésité, l'insulinorésistance et le dysfonctionnement mitochondrial ; doctorat en bioénergétique et postdoctorat à la Duke-NUS Medical School, Singapour. Auteur de Why We Get Sick et How Not To Get Sick.","sp.bos.role":"Médecin · médecine kétogène","sp.bos.b":"Médecin avec plus de 30 ans d'expérience en maladies chroniques, santé cérébrale et sevrage des addictions. Autrice de Any Way You Can, avec plus d'un million de livres vendus et une communauté YouTube de 1,2 million d'abonnés.","ev.ag.h":"Programme","ev.ag.p":"Coche les sessions auxquelles tu comptes assister pour composer ta journée.","ev.ag.mine":"{0} sur {1} éléments dans ma journée","ag.reg":"Accueil · café et networking","ag.open":"Ouverture de l'événement","ag.s1":"Session 1 — Insulinorésistance et santé métabolique (Dr Ben Bikman)","ag.s1.d":"Ce qu'est l'insulinorésistance, son lien avec l'obésité, le dysfonctionnement mitochondrial et les maladies chroniques, et ce que la recherche sur le régime pauvre en glucides apporte au métabolisme.","ag.brk":"Pause café","ag.back":"Reprise","ag.s2":"Session 2 — Médecine kétogène pour la santé cérébrale et les maladies chroniques (Dre Annette Bosworth)","ag.s2.d":"Comment les régimes kétogènes sont utilisés en médecine pour les maladies chroniques, ce que l'alimentation fait au cerveau, et les leçons de plus de 30 ans de pratique.","ag.qa":"Questions-réponses avec la Dre Annette Bosworth","ag.close":"Clôture et networking","ag.vip":"Réception VIP (détenteurs du billet First Class ; lieu envoyé par SMS)","ev.tk.h":"Billets","tk.vat":"+ TVA","tk.ga.n":"Accès général — Early Bird","tk.ga.d":"Les deux masterclasses, espace expo et démonstrations de produits, networking, certificat de participation.","tk.fc.n":"First Class","tk.seats":"Seulement 10 places","tk.fc.d":"Ajoute la réception VIP, des places au premier rang, un enregistrement prioritaire et un dîner privé avec les intervenants. Vérifie les inclusions exactes sur le site officiel.","ev.ex.h":"Espace expo","ev.ex.p":"Tests pratiques, démonstrations en direct et ateliers, plus des zones qui décodent ta santé en quelques minutes.","ex.wear.t":"Objets connectés et suivi","ex.wear.d":"Capteurs intelligents, objets connectés biométriques et suivi de santé en temps réel.","ex.nutri.t":"Nutrition et compléments","ex.nutri.d":"Compléments et nutraceutiques de nouvelle génération adaptés à l'ADN, au microbiome et au mode de vie.","ex.recov.t":"Solutions de récupération","ex.recov.d":"Cryothérapie, lumière rouge, saunas infrarouges et caissons d'oxygène hyperbare.","ex.diag.t":"Diagnostic et cliniques de longévité","ex.diag.d":"Tests ADN et métaboliques, bilans de performance cognitive, programmes personnalisés.","ev.prep.h":"Kit de préparation","prep.q1":"Questions pour le Dr Ben Bikman","pb1":"Quels signes précoces d'insulinorésistance dois-je demander à mon médecin de mesurer ?","pb2":"Dans quelle mesure le sommeil et le stress modifient-ils la sensibilité à l'insuline par rapport à l'alimentation ?","pb3":"Si je ne suis pas de régime pauvre en glucides, quelles premières étapes ont le plus d'impact ?","prep.q2":"Questions pour la Dre Annette Bosworth","pz1":"Quels contrôles de sécurité faut-il avant de commencer un régime kétogène, surtout sous traitement ?","pz2":"Que disent les preuves actuelles sur les cétones et la santé cérébrale, et que reste-t-il d'inconnu ?","pz3":"Quels marqueurs montrent si cela fonctionne pour moi ?","prep.q3":"Questions pour les exposants","px1":"Quels essais chez l'humain étayent ce produit ou dispositif, et étaient-ils indépendants ?","px2":"Quels sont les effets secondaires et qui ne doit pas l'utiliser ?","px3":"Comment mes données de santé sont-elles stockées, partagées ou vendues ?","px4":"Quel est le coût total, abonnements compris, et quelle est la politique de remboursement ?","px5":"L'allégation repose-t-elle sur un résultat de santé ou sur un critère de substitution ?","prep.q4":"Liste à emporter","pk1":"Billet sur ton téléphone","pk2":"Carnet ou appli de notes","pk3":"Résultats d'analyses récents","pk4":"Liste de tes médicaments et compléments","pk5":"Téléphone chargé ou batterie externe","pk6":"Chaussures confortables et une gourde","pil.h":"Les neuf piliers","pil.p":"Classés selon la solidité des preuves. Ouvre un pilier pour le pourquoi, trois premières actions et les pièges courants.","pil.act":"Premières actions","pil.pit":"Attention","pil.ev":"Preuves","evd.strong":"Preuves solides","evd.moderate":"Preuves modérées","evd.emerging":"Preuves émergentes","evd.varies":"Variable selon le produit","p.sleep.t":"Sommeil et rythme circadien","p.sleep.tag":"Le socle sur lequel repose chaque autre pilier","p.sleep.why":"Le sommeil consolide la mémoire, régule les hormones de l'appétit, la sensibilité à l'insuline et l'humeur. Un sommeil chroniquement court ou irrégulier est lié à un risque accru d'obésité, de diabète, de maladie cardiovasculaire et de dépression.","p.sleep.a1":"Garde une heure de réveil fixe, week-ends compris, et expose-toi à la lumière du jour dans l'heure qui suit.","p.sleep.a2":"Arrête la caféine au moins 8 heures avant le coucher et garde la chambre sombre, calme et fraîche (environ 16–19 °C).","p.sleep.a3":"Baisse les lumières et range les écrans la dernière heure ; vise 7–9 heures au lit pour la plupart des adultes.","p.sleep.pit":"L'alcool raccourcit et fragmente le sommeil, et les bracelets et applis de suivi du sommeil grand public ne donnent que des estimations : fie-toi à ton ressenti et à la tendance, pas à une seule nuit.","p.metab.t":"Santé métabolique et insuline","p.metab.tag":"Une alimentation qui garde glycémie et insuline stables","p.metab.why":"L'insulinorésistance, souvent liée à l'excès de graisse viscérale, à la sédentarité, au mauvais sommeil et aux aliments ultra-transformés, précède le diabète de type 2, la stéatose hépatique et une grande part des maladies cardiovasculaires. Beaucoup s'améliorent en réduisant glucides raffinés et boissons sucrées ; l'alimentation pauvre en glucides ou kétogène est une option efficace, pas la seule.","p.metab.a1":"Construis tes repas autour de protéines, de végétaux riches en fibres et d'aliments peu transformés ; supprime d'abord les boissons sucrées.","p.metab.a2":"Marche 10–15 minutes après tes plus gros repas ; cela atténue la hausse de glycémie.","p.metab.a3":"Suis ton rapport tour de taille/taille et, avec ton médecin, glycémie à jeun, HbA1c, triglycérides et insuline à jeun.","p.metab.pit":"Si tu prends un traitement contre le diabète ou l'hypertension, ne modifie jamais les doses et ne commence ni régime kétogène ni jeûne sans suivi médical.","p.move.t":"Mouvement et condition physique","p.move.tag":"Muscle et forme cardiorespiratoire prédisent fortement la durée de vie","p.move.why":"La capacité aérobie (VO2max) et la force musculaire figurent parmi les prédicteurs modifiables de mortalité les plus puissants, et le muscle est aussi un site majeur d'utilisation du glucose.","p.move.a1":"Cumule 150–300 minutes par semaine d'activité modérée, dont une large part assez facile pour pouvoir parler (zone 2).","p.move.a2":"Fais de la musculation ou du renforcement au moins deux fois par semaine, en travaillant tous les grands groupes musculaires.","p.move.a3":"Ajoute une courte séance d'intervalles intenses par semaine si tu es en bonne santé, et marche autant de pas par jour que tu peux confortablement.","p.move.pit":"Augmente progressivement ; les hausses brutales de charge causent la plupart des blessures. Consulte d'abord un médecin si tu as une maladie cardiaque ou des symptômes.","p.stress.t":"Stress et résilience émotionnelle","p.stress.tag":"Entraîne le système nerveux à récupérer","p.stress.why":"Le stress chronique perturbe le sommeil, l'appétit, la tension artérielle et l'immunité. Des compétences comme la respiration lente, le temps en nature et les méthodes cognitivo-comportementales ont des effets mesurables sur l'anxiété et le bien-être.","p.stress.a1":"Pratique la respiration lente, environ 5–6 respirations par minute, pendant 5 minutes, une ou deux fois par jour.","p.stress.a2":"Planifie une vraie récupération : marche quotidienne en extérieur, loisir ou temps sans écrans.","p.stress.a3":"Identifie tes principaux facteurs de stress et change-en un ; recours à une thérapie ou à des programmes TCC si l'anxiété persiste.","p.stress.pit":"Une appli de respiration ne répare ni une vie surchargée ni une anxiété ou dépression cliniques : cherche une aide professionnelle si les symptômes durent ou gênent le quotidien.","p.brain.t":"Optimisation du cerveau","p.brain.tag":"Protège mémoire, concentration et créativité pour des décennies","p.brain.why":"De vastes revues attribuent environ 45 % des cas de démence à des facteurs de risque modifiables : hypertension, perte auditive, inactivité, tabac, diabète, isolement et plus. Exercice, sommeil, apprentissage et contacts sociaux aident tous.","p.brain.a1":"Contrôle ta tension artérielle, corrige les troubles de l'audition et de la vue, et évite le tabac.","p.brain.a2":"Fais des choses difficiles et nouvelles : une langue, un instrument, une compétence avec retour d'information.","p.brain.a3":"Protège le travail profond : des blocs de 60–90 minutes sans multitâche, notifications coupées.","p.brain.pit":"La recherche sur les cétones et la santé cérébrale est prometteuse mais encore émergente ; les compléments nootropes font rarement mieux que le sommeil, l'exercice et l'apprentissage.","p.hormesis.t":"Hormèse : chaleur, froid, lumière et jeûne","p.hormesis.tag":"Un stress léger et maîtrisé qui peut renforcer la résilience","p.hormesis.why":"Le sauna est associé à une moindre mortalité cardiovasculaire dans des études observationnelles ; l'exposition au froid augmente la vigilance à court terme ; l'alimentation à horaires restreints peut aider certaines personnes. La plupart des données de bénéfice à long terme sont observationnelles ou issues de petits essais.","p.hormesis.a1":"Essaie des séances régulières de sauna de 10–20 minutes, en progressant doucement et en restant hydraté.","p.hormesis.a2":"Si tu aimes les douches ou bains froids, commence brièvement et évite-les juste après la musculation si la prise de muscle est ton objectif.","p.hormesis.a3":"Une pause alimentaire nocturne de 12–14 heures est un point de départ simple et peu risqué.","p.hormesis.pit":"Chaleur, froid et jeûne ne conviennent pas à tous : maladie cardiaque, grossesse, troubles alimentaires, traitement du diabète et consommation d'alcool exigent un avis médical.","p.connect.t":"Lien social et sens","p.connect.tag":"Le facteur de longévité le plus sous-estimé","p.connect.why":"La solitude et l'isolement social sont associés à un risque de mortalité comparable à d'autres grands facteurs de mode de vie, tandis que des relations solides et un sens de la vie sont associés à une meilleure santé et à une vie plus longue.","p.connect.a1":"Planifie des contacts réguliers avec les personnes qui comptent pour toi et protège-les comme un rendez-vous médical.","p.connect.a2":"Rejoins un groupe autour d'une passion : sport, bénévolat, artisanat, communauté.","p.connect.a3":"Écris ce qui donne du sens à tes journées et aligne une action hebdomadaire dessus.","p.connect.pit":"Les réseaux sociaux ne remplacent pas le contact en personne ; la qualité des relations compte plus que la quantité.","p.measure.t":"Mesure et diagnostic","p.measure.tag":"Connais tes chiffres, agis sur les tendances","p.measure.why":"Tension artérielle, glycémie, lipides, inflammation et statut nutritionnel révèlent des problèmes des années avant les symptômes. Les objets connectés ajoutent les tendances de fréquence cardiaque au repos, de HRV et de sommeil. Les tests ADN et d'âge biologique vendus directement au public ont aujourd'hui une valeur clinique limitée.","p.measure.a1":"Contrôle régulièrement ta tension et demande glycémie à jeun, HbA1c, lipides avec ApoB, hs-CRP et vitamine D.","p.measure.a2":"Utilise les objets connectés pour des tendances sur des semaines, pas pour des verdicts d'un jour.","p.measure.a3":"Refais le test 8–12 semaines après un changement pour voir s'il a fonctionné.","p.measure.pit":"Plus de tests n'est pas toujours mieux : des résultats anormaux sans action claire peuvent causer de l'anxiété et des examens inutiles. Interprète les résultats avec un médecin ou un professionnel de santé.","p.supp.t":"Complémentation raisonnée","p.supp.tag":"Combler les manques, ne pas chercher de miracles","p.supp.why":"Quelques compléments ont de bonnes preuves chez l'humain lorsqu'ils sont utilisés à bon escient ; beaucoup de composés de longévité commercialisés n'en ont pas. L'alimentation, le sommeil et l'exercice passent d'abord.","p.supp.a1":"Teste avant de te complémenter : vitamine D, ferritine et B12 sont des carences fréquentes.","p.supp.a2":"La créatine monohydrate (3–5 g par jour) a de solides preuves pour le muscle et la force ; les oméga-3 peuvent aider si tu manges peu de poisson gras.","p.supp.a3":"Choisis des produits testés par un tiers et introduis un seul changement à la fois.","p.supp.pit":"Mégadoses, empilement de nombreux produits et mélanges non réglementés comportent des risques et des interactions médicamenteuses. Les preuves pour les stimulateurs de NAD+ et le resvératrol chez l'humain restent insuffisantes.","tools.h":"Calculateurs et minuteurs","tools.p":"Tout fonctionne localement dans ton navigateur ; rien n'est envoyé ailleurs.","disc.short":"Outils pédagogiques, ni avis médical ni diagnostic.","t.met.h":"Insulinorésistance et marqueurs métaboliques","t.met.p":"Remplis ce que tu as : glycémie et insuline donnent le HOMA-IR ; triglycérides et glycémie donnent l'indice TyG ; tour de taille et taille donnent le rapport tour de taille/taille.","t.met.note":"Les seuils varient selon le laboratoire, la méthode de dosage et la population ; vois les résultats comme une base de discussion avec ton médecin.","f.glu":"Glycémie à jeun","f.ins":"Insuline à jeun","f.tg":"Triglycérides","f.waist":"Tour de taille","f.height":"Taille","o.homa":"HOMA-IR","o.tyg":"Indice TyG","o.whtr":"Rapport tour de taille/taille","o.need":"Remplis les champs pour voir les résultats.","st.ok":"Dans la cible","st.watch":"À surveiller","st.flag":"À discuter avec un médecin","t.en.h":"Besoins en énergie et protéines","t.en.p":"Estimation de Mifflin-St Jeor de l'énergie au repos et quotidienne, avec objectifs de protéines.","f.sex":"Sexe","sex.m":"Homme","sex.f":"Femme","f.age":"Âge","f.weight":"Poids","f.act":"Niveau d'activité","act.1":"Sédentaire (travail de bureau, peu d'exercice)","act.2":"Léger (1–3 séances par semaine)","act.3":"Modéré (3–5 séances par semaine)","act.4":"Élevé (6–7 séances par semaine)","act.5":"Très élevé (travail physique et entraînement)","o.bmr":"Énergie au repos (BMR)","o.tdee":"Énergie quotidienne (TDEE)","o.prot1":"Protéines, adultes en général","o.prot2":"Protéines, avec musculation","t.hr.h":"Zones de fréquence cardiaque","t.hr.p":"Fréquence cardiaque maximale estimée (Tanaka : 208 − 0,7 × âge) et cinq zones d'entraînement. Les valeurs individuelles varient.","hz.1":"Zone 1 — récupération","hz.2":"Zone 2 — facile, on peut parler","hz.3":"Zone 3 — tempo","hz.4":"Zone 4 — seuil","hz.5":"Zone 5 — maximale","o.hrmax":"FC max estimée","t.sl.h":"Planificateur de cycles de sommeil","t.sl.p":"Le sommeil se déroule en cycles d'environ 90 minutes. Les heures incluent environ 15 minutes pour s'endormir.","f.wake":"Je dois me réveiller à","f.bed":"Si je me couche à","o.bedat":"Couche-toi à","o.wakeat":"Réveille-toi à","o.cycles":"{0} cycles · {1} h de sommeil","o.caf":"Dernière caféine vers {0}","t.fa.h":"Minuteur de jeûne","t.fa.p":"Suis ta pause alimentaire nocturne ou plus longue. Les descriptions des étapes sont approximatives et varient d'une personne à l'autre.","fa.start":"Démarrer le jeûne","fa.stop":"Terminer le jeûne","fa.goal":"Objectif","fa.elapsed":"Écoulé","fs.0":"État nourri : la glycémie et l'insuline sont élevées après ton repas.","fs.1":"Post-absorptif : l'insuline baisse et le corps puise davantage dans ses réserves.","fs.2":"La combustion des graisses augmente et la production de cétones commence à croître chez beaucoup.","fs.3":"État de jeûne plus profond ; les réponses varient beaucoup d'une personne à l'autre.","fs.4":"Jeûne prolongé : uniquement sous supervision médicale.","fa.warn":"À éviter en cas de grossesse, avant 18 ans, d'antécédents de trouble alimentaire, d'insuffisance pondérale ou de traitement antidiabétique, sauf accord de ton médecin.","t.br.h":"Guide respiratoire","t.br.p":"Suis le cercle. Les expirations lentes activent le système parasympathique et peuvent réduire le stress perçu en quelques minutes.","br.coh":"Cohérente 5,5 / 5,5","br.box":"Carrée 4-4-4-4","br.478":"4-7-8","br.46":"Calme 4 / 6","br.start":"Démarrer","br.stop":"Arrêter","br.in":"Inspire","br.hold":"Retiens","br.out":"Expire","br.cycles":"{0} cycles","sc.h":"Score 360","sc.p":"Dix-huit affirmations, deux par pilier. Réponds honnêtement pour le dernier mois. Les résultats restent sur cet appareil.","sc.s.0":"Presque jamais","sc.s.1":"Parfois","sc.s.2":"Souvent","sc.s.3":"Presque toujours","q.sleep.1":"Je me réveille à peu près à la même heure chaque jour et je prends la lumière du jour tôt.","q.sleep.2":"Je dors 7–9 heures et me réveille plutôt reposé(e).","q.metab.1":"Mes repas reposent surtout sur des protéines, des légumes et des aliments peu transformés.","q.metab.2":"Je bois rarement des boissons sucrées et grignote rarement sucreries et snacks entre les repas.","q.move.1":"Je fais 150 minutes ou plus d'exercice modéré par semaine.","q.move.2":"Je fais de la musculation au moins deux fois par semaine.","q.stress.1":"J'ai une pratique quotidienne qui m'apaise, comme la respiration, la marche ou la méditation.","q.stress.2":"Je récupère bien après les journées stressantes et me sens rarement dépassé(e).","q.brain.1":"J'apprends régulièrement quelque chose de nouveau ou je fournis un travail mental exigeant.","q.brain.2":"Je peux me concentrer 60 minutes sans vérifier sans cesse mon téléphone.","q.hormesis.1":"J'utilise la chaleur, le froid, des fenêtres de jeûne ou des pratiques similaires, en sécurité et régulièrement.","q.hormesis.2":"Je laisse au moins 12 heures entre mon dernier repas et le premier du lendemain.","q.connect.1":"Je passe chaque semaine du temps de qualité avec des personnes qui comptent pour moi.","q.connect.2":"Je sens que mes journées ont un but et une direction.","q.measure.1":"Je connais mes valeurs récentes de tension, glycémie et cholestérol.","q.measure.2":"Je consulte mon médecin et fais mes analyses quand c'est le moment, pas seulement quand je suis malade.","q.supp.1":"Je ne prends des compléments que pour une raison, idéalement après un test.","q.supp.2":"Je sais ce que je prends, à quelle dose, et si cela interagit avec mes médicaments.","sc.prog":"{0}/{1} réponses","sc.go":"Voir mon Score 360","sc.res.h":"Ton résultat","sc.overall":"Global","sc.hi":"Base solide. Garde ce qui marche et affine ton pilier le plus faible.","sc.mid":"Base solide avec une vraie marge de progression. Choisis le pilier le plus bas et change une chose cette semaine.","sc.lo":"Commence par les bases : sommeil, mouvement et qualité de l'alimentation. De petits pas répétés l'emportent.","sc.weak":"Commence par","sc.open":"Ouvrir le pilier","sc.retake":"Refaire le bilan","sc.hist":"Résultats précédents","sc.note":"Un auto-bilan de mode de vie, pas une mesure de l'âge biologique ni du risque de maladie.","lb.h":"Panel de biomarqueurs","lb.p":"Saisis les valeurs de ton bilan d'analyses. VITALIS les compare aux seuils de référence adultes couramment utilisés. Unités : mg/dL sauf indication contraire.","lb.sex":"Sexe (certains seuils diffèrent)","lb.sum":"{0} dans la norme · {1} à surveiller · {2} à discuter","lb.rng":"Référence","lb.copy":"Copier le résumé","lb.copied":"Copié","lb.note":"Les plages de référence diffèrent selon les laboratoires et les recommandations. Une valeur hors plage n'est pas un diagnostic, et une valeur dans la plage n'est pas une garantie. Discute des résultats avec un médecin ou un professionnel de santé.","l.glu":"Glycémie à jeun","l.a1c":"HbA1c","l.tg":"Triglycérides","l.hdl":"Cholestérol HDL","l.ldl":"Cholestérol LDL","l.apob":"ApoB","l.sys":"Tension artérielle systolique","l.dia":"Tension artérielle diastolique","l.crp":"hs-CRP","l.vitd":"Vitamine D (25-OH)","l.ferr":"Ferritine","l.tsh":"TSH","l.alt":"ALAT","l.rhr":"Fréquence cardiaque au repos","ri.h":"Rituel quotidien","ri.p":"Douze petites habitudes. Touche une case pour marquer un jour. Vise la régularité, pas la perfection.","ri.today":"Aujourd'hui : {0}/{1}","ri.streak":"Série : {0} jours avec au moins la moitié des habitudes réalisées","ri.week":"Moyenne sur 7 jours : {0} %","ri.add":"Ajouter","ri.ph":"Ajoute ta propre habitude…","ri.del":"Supprimer","h.wake":"Heure de réveil fixe","h.light":"Lumière extérieure dans l'heure suivant le réveil","h.steps":"7 000+ pas","h.train":"Séance de musculation ou cardio (jours d'entraînement)","h.protein":"Protéines à chaque repas principal","h.fiber":"Légumes ou fibres à deux repas","h.nosugar":"Aucune boisson sucrée","h.caf":"Pas de caféine dans les 8 heures avant le coucher","h.screens":"Écrans éteints 60 minutes avant le coucher","h.breath":"5 minutes de respiration lente","h.social":"Du temps de qualité avec quelqu'un","h.learn":"20 minutes d'apprentissage ou de lecture","gl.h":"Glossaire","gl.p":"Définitions en langage simple des termes que tu entendras lors d'un événement de biohacking.","gl.search":"Rechercher un terme…","gl.none":"Aucun terme correspondant.","g.ir.t":"Insulinorésistance","g.ir.d":"Les cellules répondent mal à l'insuline, si bien que le corps en a besoin de plus pour sortir le glucose du sang. Une étape précoce vers le diabète de type 2.","g.homa.t":"HOMA-IR","g.homa.d":"Estimation de l'insulinorésistance à partir de la glycémie et de l'insuline à jeun : glycémie (mg/dL) × insuline (µIU/mL) ÷ 405.","g.a1c.t":"HbA1c","g.a1c.d":"La part d'hémoglobine liée au sucre ; reflète la glycémie moyenne sur environ trois mois.","g.ketones.t":"Cétones","g.ketones.d":"Molécules produites à partir des graisses par le foie quand l'apport en glucides est très faible ou lors d'un jeûne prolongé ; carburant alternatif pour le cerveau et les muscles.","g.autophagy.t":"Autophagie","g.autophagy.d":"Le processus de recyclage de la cellule qui élimine les composants abîmés. Le jeûne et l'exercice l'influencent ; les preuves de bénéfices chez l'humain sont encore en construction.","g.mtor.t":"mTOR","g.mtor.d":"Une voie de signalisation de croissance activée par les nutriments, surtout les acides aminés ; essentielle à la construction des tissus et étudiée dans le vieillissement.","g.ampk.t":"AMPK","g.ampk.d":"Un capteur d'énergie activé par l'exercice et la faible disponibilité énergétique, favorisant l'utilisation des graisses et la santé mitochondriale.","g.nad.t":"NAD+","g.nad.d":"Un coenzyme central du métabolisme énergétique qui diminue avec l'âge. Les compléments qui l'augmentent n'ont pas encore montré de bénéfice clinique net chez l'humain.","g.mito.t":"Mitochondries","g.mito.d":"Les centrales énergétiques de la cellule. Leur nombre et leur qualité répondent à l'exercice et sont liés à la santé métabolique.","g.hormesis.t":"Hormèse","g.hormesis.d":"Une réponse adaptative bénéfique à une faible dose d'un facteur de stress, comme l'exercice, la chaleur ou le froid ; nocif à forte dose.","g.vo2.t":"VO2max","g.vo2.d":"Le débit maximal d'oxygène que ton corps peut utiliser pendant l'effort ; un puissant marqueur de forme cardiorespiratoire et de longévité.","g.hrv.t":"VFC (HRV)","g.hrv.d":"Variabilité de la fréquence cardiaque (VFC) : variation du temps entre les battements. Indicateur approximatif de récupération et de stress ; compare-la à ta propre référence.","g.healthspan.t":"Années en bonne santé","g.healthspan.d":"Le nombre d'années vécues en bonne santé, par opposition à la durée de vie, le total des années vécues.","g.senescence.t":"Sénescence cellulaire","g.senescence.d":"Cellules qui cessent de se diviser mais restent actives et libèrent des signaux inflammatoires ; elles s'accumulent avec l'âge.","g.circadian.t":"Rythme circadien","g.circadian.d":"L'horloge interne d'environ 24 heures qui régit sommeil, hormones et métabolisme, réglée surtout par la lumière.","g.glyvar.t":"Variabilité glycémique","g.glyvar.d":"L'ampleur des hausses et baisses de la glycémie au cours de la journée. De grandes variations peuvent compter au-delà de la moyenne.","g.apob.t":"ApoB","g.apob.d":"La protéine présente sur chaque particule de lipoprotéine athérogène ; sa concentration reflète le nombre de particules pouvant pénétrer la paroi des artères.","g.crp.t":"hs-CRP","g.crp.d":"Un marqueur sanguin d'inflammation de bas grade, lié au risque cardiovasculaire. Augmente lors d'une infection.","g.epiclock.t":"Horloge épigénétique","g.epiclock.d":"Une estimation statistique de l'âge biologique à partir des profils de méthylation de l'ADN. Intéressante en recherche, d'usage clinique limité aujourd'hui.","g.zone2.t":"Zone 2","g.zone2.d":"Effort aérobie facile où l'on peut encore tenir une conversation ; construit la base mitochondriale et aérobie.","g.sarco.t":"Sarcopénie","g.sarco.d":"Perte de masse et de force musculaires liée à l'âge, que le renforcement musculaire et les protéines aident à prévenir.","g.microbiome.t":"Microbiome","g.microbiome.d":"Les milliers de milliards de microbes de ton intestin qui influencent digestion, immunité et métabolisme ; une alimentation variée et riche en fibres le soutient.","g.vfat.t":"Graisse viscérale","g.vfat.d":"Graisse stockée autour des organes internes ; plus active métaboliquement et plus fortement liée à l'insulinorésistance que la graisse sous la peau.","g.cgm.t":"CGM","g.cgm.d":"Capteur de glycémie en continu : un capteur cutané qui enregistre la glycémie tout au long de la journée. Utile dans le diabète ; son intérêt chez les personnes en bonne santé est encore débattu.","my.h":"Mythes et preuves","my.p":"Le biohacking mêle science solide et marketing. Touche pour comparer.","my.m":"Mythe","my.r":"Ce que disent les preuves","my.detox.m":"Les jus et tisanes détox nettoient ton corps.","my.detox.r":"Le foie, les reins, les poumons et l'intestin s'en chargent déjà. Aucun produit détox n'a montré qu'il élimine les toxines mieux que la physiologie normale.","my.supps.m":"Plus on prend de compléments, mieux c'est.","my.supps.r":"Au-delà de la correction d'une carence, les bénéfices sont faibles ou non prouvés, et les fortes doses peuvent nuire ou interagir avec des médicaments.","my.bioage.m":"Un test d'âge biologique donne ton âge réel exact.","my.bioage.r":"Les différentes horloges donnent des réponses différentes, et aucune n'est encore validée pour guider des décisions de traitement individuelles.","my.cold.m":"Les bains froids font brûler les graisses et prolongent la vie.","my.cold.r":"Le froid augmente la vigilance et peut améliorer l'humeur à court terme ; les preuves d'une perte de graisse ou d'une vie plus longue chez l'humain manquent.","my.fasting.m":"Le jeûne convient à tout le monde.","my.fasting.r":"Les résultats varient, et le jeûne peut être inadapté ou dangereux pour certains groupes. Le meilleur schéma alimentaire est celui que tu peux tenir en sécurité.","my.onediet.m":"Un seul régime est optimal pour tous.","my.onediet.r":"Les réponses individuelles diffèrent en glycémie, appétit et tolérance. L'adhésion et la qualité des aliments comptent plus que l'étiquette.","my.sleepcatch.m":"On peut rattraper entièrement son sommeil le week-end.","my.sleepcatch.r":"Dormir plus aide en partie, mais des horaires irréguliers et un sommeil court répété ont quand même un coût métabolique.","my.steps.m":"Seuls les 10 000 pas comptent.","my.steps.r":"Les bénéfices commencent bien en dessous et plafonnent vers 7 000–10 000 pas par jour ; toute augmentation aide.","ft.disc":"VITALIS sert à l'éducation générale. Il ne diagnostique ni ne traite, et ne remplace pas l'avis médical professionnel. Consulte un professionnel de santé qualifié avant de modifier alimentation, exercice, compléments ou médicaments.","ft.license":"Licence MIT · © 2026 Alexandru-Ionuț Chiuță (Alexio)","ft.tf":"Trade-free · hors ligne · sans traçage : tes données restent dans ce navigateur.","ft.src":"Inspiré de la conférence Biohacking360 (biohacking360.com). Non officiel, sans affiliation.","ft.bmc":"Offre-moi un café","ft.export":"Exporter mes données","ft.import":"Importer des données","ft.reset":"Effacer toutes les données","ft.resetq":"Effacer toutes les données enregistrées dans ce navigateur ?","ft.imp.ok":"Données importées.","ft.imp.err":"Le fichier n'a pas pu être lu.","theme":"Changer de thème","o.range":"Certaines valeurs semblent hors de la plage plausible. Vérifie-les.","ri.max":"Maximum 20 habitudes personnalisées.","nav.aria":"Sections","lang.aria":"Langue","ft.imp.big":"Le fichier est trop volumineux ou invalide."},"it":{"title":"VITALIS — salute, longevità e biohacking al massimo livello","skip":"Vai al contenuto","brand.sub":"salute · longevità · biohacking","nav.home":"Home","nav.event":"Conferenza","nav.pillars":"Pilastri","nav.tools":"Strumenti","nav.score":"Score 360","nav.labs":"Biomarcatori","nav.ritual":"Rituale quotidiano","nav.gloss":"Glossario","home.eyebrow":"La migliore esperienza di salute, longevità e biohacking","home.h1":"Migliora la tua salute, una cellula alla volta.","home.lead":"VITALIS è un compagno privato e offline per l'ottimizzazione umana: nove pilastri ordinati in base alle evidenze, calcolatori, un punteggio di stile di vita, un pannello di biomarcatori e un tracker del rituale quotidiano. Ispirato alla conferenza Biohacking360 di Bucarest.","home.cta1":"Esplora i pilastri","home.cta2":"La confer il metabolismo.","ag.brk":"Pausa caffè","ag.back":"Bentornati","ag.s2":"Sessione 2 — Medicina chetogenica per la salute del cervello e le malattie croniche (dott.ssa Annette Bosworth)","ag.s2.d":"Come le diete chetogeniche vengono usate in medicina per le condizioni croniche, cosa fa il cibo al cervello e le lezioni di oltre 30 anni di pratica.","ag.qa":"Domande e risposte con la dott.ssa Annette Bosworth","ag.close":"Chiusura e networking","ag.vip":"Ricevimento VIP (possessori del biglietto First Class; luogo comunicato via SMS)","ev.tk.h":"Biglietti","tk.vat":"+ IVA","tk.ga.n":"Accesso generale — Early Bird","tk.ga.d":"Entrambe le masterclass, area expo e demo di prodotti, networking, attestato di partecipazione.","tk.fc.n":"First Class","tk.seats":"Solo 10 posti","tk.fc.d":"Include il ricevimento VIP, posti in prima fila, check-in prioritario e una cena privata con i relatori. Controlla il sito ufficiale per le inclusioni esatte.","ev.ex.h":"Area expo","ev.ex.p":"Prove pratiche, demo dal vivo e workshop, più zone che decodificano la tua salute in pochi minuti.","ex.wear.t":"Wearable e monitoraggio","ex.wear.d":"Sensori smart, wearable biometrici e monitoraggio della salute in tempo reale.","ex.nutri.t":"Nutrizione e integratori","ex.nutri.d":"Integratori e nutraceutici di nuova generazione su misura per DNA, microbioma e stile di vita.","ex.recov.t":"Soluzioni di recupero","ex.recov.d":"Crioterapia, luce rossa, saune a infrarossi e camere iperbariche.","ex.diag.t":"Diagnostica e cliniche della longevità","ex.diag.d":"Test del DNA e metabolici, scansioni delle prestazioni cognitive, programmi personalizzati.","ev.prep.h":"Kit di preparazione","prep.q1":"Domande per il Dr. Ben Bikman","pb1":"Quali segni precoci di insulino-resistenza dovrei chiedere al medico di misurare?","pb2":"Quanto cambiano sonno e stress la sensibilità insulinica rispetto alla dieta?","pb3":"Se non seguo una dieta low-carb, quali primi passi hanno il maggiore impatto?","prep.q2":"Domande per la dott.ssa Annette Bosworth","pz1":"Quali controlli di sicurezza servono prima di iniziare una dieta chetogenica, soprattutto con farmaci?","pz2":"Cosa dicono le evidenze attuali su chetoni e salute del cervello, e cosa resta ignoto?","pz3":"Quali marcatori mostrano se funziona per me?","prep.q3":"Domande per gli espositori","px1":"Quali studi sull'uomo supportano questo prodotto o dispositivo, ed erano indipendenti?","px2":"Quali sono gli effetti collaterali e chi non dovrebbe usarlo?","px3":"Come vengono conservati, condivisi o venduti i miei dati sanitari?","px4":"Qual è il costo totale, abbonamenti inclusi, e qual è la politica di rimborso?","px5":"L'affermazione si basa su un esito di salute reale o su una misura surrogata?","prep.q4":"Cosa portare","pk1":"Biglietto sul telefono","pk2":"Quaderno o app per appunti","pk3":"Risultati recenti degli esami","pk4":"Elenco di farmaci e integratori","pk5":"Telefono carico o power bank","pk6":"Scarpe comode e una borraccia","pil.h":"I nove pilastri","pil.p":"Ordinati in base a quanto le evidenze li supportano. Apri un pilastro per il perché, tre prime mosse e gli errori comuni.","pil.act":"Prime mosse","pil.pit":"Attenzione","pil.ev":"Evidenza","evd.strong":"Evidenza solida","evd.moderate":"Evidenza moderata","evd.emerging":"Evidenza emergente","evd.varies":"Varia per prodotto","p.sleep.t":"Sonno e ritmo circadiano","p.sleep.tag":"La base su cui poggia ogni altro pilastro","p.sleep.why":"Il sonno consolida la memoria e regola gli ormoni dell'appetito, la sensibilità insulinica e l'umore. Un sonno cronicamente breve o irregolare è associato a un rischio maggiore di obesità, diabete, malattie cardiovascolari e depressione.","p.sleep.a1":"Mantieni un orario di sveglia fisso, anche nel weekend, ed esponiti alla luce esterna entro un'ora dal risveglio.","p.sleep.a2":"Smetti con la caffeina almeno 8 ore prima di dormire e tieni la camera buia, silenziosa e fresca (circa 16–19 °C).","p.sleep.a3":"Abbassa le luci e metti via gli schermi nell'ultima ora; punta a 7–9 ore a letto per la maggior parte degli adulti.","p.sleep.pit":"L'alcol accorcia e frammenta il sonno, e i tracker del sonno di consumo sono stime approssimative: fidati di come ti senti e della tendenza, non di una sola notte.","p.metab.t":"Salute metabolica e insulina","p.metab.tag":"Un'alimentazione che mantiene stabili glicemia e insulina","p.metab.why":"L'insulino-resistenza, spesso legata a eccesso di grasso viscerale, inattività, sonno scarso e cibi ultraprocessati, sta a monte di diabete di tipo 2, steatosi epatica e di gran parte delle malattie cardiovascolari. Molte persone migliorano riducendo carboidrati raffinati e bevande zuccherate; l'alimentazione low-carb o chetogenica è un'opzione efficace, non l'unica.","p.metab.a1":"Costruisci i pasti attorno a proteine, vegetali ricchi di fibre e cibi poco processati; elimina prima le bevande zuccherate.","p.metab.a2":"Cammina 10–15 minuti dopo i pasti più abbondanti: attenua il picco glicemico.","p.metab.a3":"Monitora il rapporto vita/altezza e, con il medico, glicemia a digiuno, HbA1c, trigliceridi e insulina a digiuno.","p.metab.pit":"Se assumi farmaci per diabete o pressione, non cambiare mai le dosi né iniziare una dieta chetogenica o il digiuno senza supervisione medica.","p.move.t":"Movimento e fitness","p.move.tag":"Massa muscolare e fitness cardiorespiratorio sono forti predittori di longevità","p.move.why":"La forma aerobica (VO2max) e la forza muscolare sono tra i più forti predittori modificabili di mortalità, e il muscolo è anche un importante sito di smaltimento del glucosio.","p.move.a1":"Accumula 150–300 minuti a settimana di attività moderata, con una buona parte abbastanza leggera da poter parlare (zona 2).","p.move.a2":"Fai sollevamento pesi o allenamento di resistenza almeno due volte a settimana, coinvolgendo tutti i principali gruppi muscolari.","p.move.a3":"Aggiungi una breve sessione intensa a intervalli a settimana se sei in salute, e cammina quanti più passi al giorno riesci comodamente.","p.move.pit":"Aumenta gradualmente: bruschi aumenti di carico causano la maggior parte degli infortuni. Consulta prima un medico se hai malattie cardiache o sintomi.","p.stress.t":"Stress e resilienza emotiva","p.stress.tag":"Allena il sistema nervoso a recuperare","p.stress.why":"Lo stress cronico altera sonno, appetito, pressione e funzione immunitaria. Abilità come la respirazione lenta, il contatto con la natura e i metodi cognitivo-comportamentali hanno effetti misurabili su ansia e benessere.","p.stress.a1":"Pratica la respirazione lenta a circa 5–6 respiri al minuto per 5 minuti, una o due volte al giorno.","p.stress.a2":"Pianifica un vero recupero: una passeggiata quotidiana all'aperto, un hobby o tempo senza schermi.","p.stress.a3":"Individua i tuoi principali fattori di stress e cambiane uno; ricorri a terapia o programmi basati sulla CBT se l'ansia persiste.","p.stress.pit":"Un'app di respirazione non risolve una vita sovraccarica né ansia e depressione cliniche: cerca aiuto professionale se i sintomi durano o compromettono la vita quotidiana.","p.brain.t":"Ottimizzazione del cervello","p.brain.tag":"Proteggi memoria, concentrazione e creatività per decenni","p.brain.why":"Ampie revisioni attribuiscono circa il 45% dei casi di demenza a fattori di rischio modificabili: ipertensione, perdita dell'udito, inattività, fumo, diabete, isolamento e altro. Esercizio, sonno, apprendimento e contatti sociali aiutano tutti.","p.brain.a1":"Controlla la pressione, correggi i problemi di udito e vista ed evita il fumo.","p.brain.a2":"Fai cose difficili e nuove: una lingua, uno strumento, un'abilità con riscontro.","p.brain.a3":"Proteggi il lavoro profondo: blocchi di 60–90 minuti su un solo compito, con le notifiche spente.","p.brain.pit":"La ricerca su chetoni e salute del cervello è promettente ma ancora emergente; gli integratori nootropici raramente superano sonno, esercizio e apprendimento.","p.hormesis.t":"Ormesi: caldo, freddo, luce e digiuno","p.hormesis.tag":"Piccoli stress controllati che possono costruire resilienza","p.hormesis.why":"La sauna è stata associata a una minore mortalità cardiovascolare in studi osservazionali; l'esposizione al freddo aumenta la vigilanza nell'immediato; l'alimentazione a finestra oraria può aiutare alcune persone. La maggior parte dei dati sui benefici a lungo termine è osservazionale o proviene da piccoli studi.","p.hormesis.a1":"Prova sessioni regolari di sauna di 10–20 minuti, aumentando gradualmente e bevendo a sufficienza.","p.hormesis.a2":"Se ti piacciono docce o immersioni fredde, inizia con brevi esposizioni ed evitale subito dopo l'allenamento di forza se punti alla crescita muscolare.","p.hormesis.a3":"Una pausa notturna di 12–14 ore tra i pasti è un punto di partenza semplice e a basso rischio.","p.hormesis.pit":"Caldo, freddo e digiuno non sono sicuri per tutti: malattie cardiache, gravidanza, disturbi alimentari, terapia del diabete e consumo di alcol richiedono un parere medico.","p.connect.t":"Relazioni e scopo","p.connect.tag":"Il fattore di longevità più sottovalutato","p.connect.why":"Solitudine e isolamento sociale sono associati a un rischio di mortalità paragonabile ad altri importanti fattori di stile di vita, mentre relazioni solide e un senso di scopo sono associati a migliore salute e vita più lunga.","p.connect.a1":"Programma contatti regolari con le persone a cui tieni e proteggili come un appuntamento medico.","p.connect.a2":"Unisciti a un gruppo costruito attorno a qualcosa che ami: sport, volontariato, un mestiere, una comunità.","p.connect.a3":"Scrivi ciò che dà significato alle tue giornate e allinea a esso un'azione settimanale.","p.connect.pit":"I social media non sostituiscono il contatto di persona; la qualità delle relazioni conta più della quantità.","p.measure.t":"Misurazione e diagnostica","p.measure.tag":"Conosci i tuoi numeri, agisci sulle tendenze","p.measure.why":"Pressione, glicemia, lipidi, infiammazione e stato nutrizionale rivelano i problemi anni prima dei sintomi. I wearable aggiungono tendenze di frequenza cardiaca a riposo, HRV e sonno. I test del DNA e dell'età biologica venduti direttamente al consumatore hanno oggi uno scarso valore clinico.","p.measure.a1":"Controlla regolarmente la pressione e chiedi glicemia a digiuno, HbA1c, lipidi con ApoB, hs-CRP e vitamina D.","p.measure.a2":"Usa i wearable per le tendenze su settimane, non per verdetti di un solo giorno.","p.measure.a3":"Ripeti i test dopo 8–12 settimane da un cambiamento per vedere se ha funzionato.","p.measure.pit":"Più test non è sempre meglio: risultati anomali senza un'azione chiara possono causare ansia e procedure inutili. Interpreta i risultati con un clinico.","p.supp.t":"Integrazione intelligente","p.supp.tag":"Colma le carenze, non inseguire miracoli","p.supp.why":"Pochi integratori hanno buone evidenze nell'uomo se usati per il motivo giusto; molti composti per la longevità in commercio non le hanno. Prima vengono alimentazione, sonno ed esercizio.","p.supp.a1":"Testa prima di integrare: vitamina D, ferritina e B12 sono carenze comuni.","p.supp.a2":"La creatina monoidrato (3–5 g al giorno) ha solide evidenze per muscoli e forza; gli omega-3 possono aiutare se il consumo di pesce azzurro è basso.","p.supp.a3":"Scegli prodotti testati da terzi e introduci un cambiamento alla volta.","p.supp.pit":"Megadosi, combinazioni di molti prodotti e miscele non regolamentate comportano rischi e interazioni con i farmaci. Le evidenze sull'uomo per gli stimolatori di NAD+ e il resveratrolo sono ancora insufficienti.","tools.h":"Calcolatori e timer","tools.p":"Tutto funziona localmente nel tuo browser; nulla viene inviato altrove.","disc.short":"Strumenti educativi, non consulenza medica né diagnosi.","t.met.h":"Insulino-resistenza e marcatori metabolici","t.met.p":"Compila ciò che hai: glicemia e insulina danno l'HOMA-IR; trigliceridi e glicemia danno l'indice TyG; vita e altezza danno il rapporto vi rasporta zucchero; riflette la glicemia media degli ultimi tre mesi circa.","g.ketones.t":"Chetoni","g.ketones.d":"Molecole prodotte dal fegato a partire dai grassi quando l'apporto di carboidrati è molto basso o durante un digiuno prolungato; un carburante alternativo per cervello e muscoli.","g.autophagy.t":"Autofagia","g.autophagy.d":"Il processo di riciclo della cellula che elimina i componenti danneggiati. Digiuno ed esercizio la influenzano; le evidenze sull'uomo sui benefici sono ancora in sviluppo.","g.mtor.t":"mTOR","g.mtor.d":"Una via di segnalazione della crescita attivata dai nutrienti, soprattutto gli amminoacidi; essenziale per costruire tessuti e studiata nell'invecchiamento.","g.ampk.t":"AMPK","g.ampk.d":"Un sensore energetico attivato da esercizio e scarsa disponibilità di energia, che favorisce l'uso dei grassi e la salute mitocondriale.","g.nad.t":"NAD+","g.nad.d":"Un coenzima centrale nel metabolismo energetico che diminuisce con l'età. Gli integratori che lo aumentano non hanno ancora mostrato chiari benefici clinici nell'uomo.","g.mito.t":"Mitocondri","g.mito.d":"Le centrali energetiche della cellula. Numero e qualità rispondono all'esercizio e sono legati alla salute metabolica.","g.hormesis.t":"Ormesi","g.hormesis.d":"Una risposta adattativa benefica a una bassa dose di uno stressor, come esercizio, caldo o freddo; dannosa ad alte dosi.","g.vo2.t":"VO2max","g.vo2.d":"La massima velocità con cui il corpo può usare l'ossigeno durante l'esercizio; un forte marcatore di fitness cardiorespiratorio e longevità.","g.hrv.t":"HRV","g.hrv.d":"Variabilità della frequenza cardiaca: variazione del tempo tra i battiti. Usata come indicatore approssimativo di recupero e stress; confrontala con la tua base personale.","g.healthspan.t":"Healthspan (anni in salute)","g.healthspan.d":"Il numero di anni vissuti in buona salute, in contrasto con la durata della vita, cioè gli anni totali vissuti.","g.senescence.t":"Senescenza cellulare","g.senescence.d":"Cellule che smettono di dividersi ma restano attive e rilasciano segnali infiammatori; si accumulano con l'età.","g.circadian.t":"Ritmo circadiano","g.circadian.d":"L'orologio interno di circa 24 ore che governa sonno, ormoni e metabolismo, regolato soprattutto dalla luce.","g.glyvar.t":"Variabilità glicemica","g.glyvar.d":"Quanto la glicemia oscilla su e giù durante il giorno. Grandi oscillazioni possono contare oltre la media.","g.apob.t":"ApoB","g.apob.d":"La proteina presente su ogni particella lipoproteica aterogena; la sua concentrazione approssima il numero di particelle che possono entrare nelle pareti arteriose.","g.crp.t":"hs-CRP","g.crp.d":"Un marcatore ematico di infiammazione di basso grado, legato al rischio cardiovascolare. Aumenta durante le infezioni.","g.epiclock.t":"Orologio epigenetico","g.epiclock.d":"Una stima statistica dell'età biologica dai pattern di metilazione del DNA. Interessante nella ricerca, con uso clinico limitato oggi.","g.zone2.t":"Zona 2","g.zone2.d":"Sforzo aerobico leggero in cui riesci ancora a conversare; costruisce la base mitocondriale e aerobica.","g.sarco.t":"Sarcopenia","g.sarco.d":"Perdita di massa e forza muscolare legata all'età, che allenamento di resistenza e proteine aiutano a prevenire.","g.microbiome.t":"Microbioma","g.microbiome.d":"I trilioni di microbi nell'intestino che influenzano digestione, immunità e metabolismo; diete varie e ricche di fibre lo sostengono.","g.vfat.t":"Grasso viscerale","g.vfat.d":"Grasso accumulato attorno agli organi interni; metabolicamente più attivo e più legato all'insulino-resistenza del grasso sottocutaneo.","g.cgm.t":"CGM","g.cgm.d":"Monitor continuo del glucosio: un sensore sulla pelle che registra la glicemia durante il giorno. Utile nel diabete; il valore per le persone sane è ancora dibattuto.","my.h":"Miti ed evidenze","my.p":"Il biohacking mescola scienza solida e marketing. Tocca per confrontare.","my.m":"Mito","my.r":"Cosa dicono le evidenze","my.detox.m":"Succhi e tisane detox purificano il corpo.","my.detox.r":"Fegato, reni, polmoni e intestino lo fanno già. Nessun prodotto detox ha dimostrato di eliminare le tossine meglio della normale fisiologia.","my.supps.m":"Più integratori, meglio è.","my.supps.r":"Oltre a correggere una carenza, i benefici sono minimi o non provati, e dosi elevate possono nuocere o interagire con i farmaci.","my.bioage.m":"Un test dell'età biologica rivela la tua età reale esatta.","my.bioage.r":"Orologi diversi danno risposte diverse, e nessuno è ancora validato per guidare le decisioni terapeutiche individuali.","my.cold.m":"Le immersioni nel freddo bruciano grassi e allungano la vita.","my.cold.r":"Il freddo aumenta la vigilanza e può migliorare l'umore nell'immediato; mancano evidenze nell'uomo su perdita di grasso o vita più lunga.","my.fasting.m":"Il digiuno va bene per tutti.","my.fasting.r":"I risultati variano, e il digiuno può essere inadatto o rischioso per alcuni gruppi. Il miglior schema alimentare è quello che puoi sostenere in sicurezza.","my.onediet.m":"Una sola dieta è ottimale per tutti.","my.onediet.r":"Le risposte individuali differiscono per glicemia, appetito e tolleranza. Aderenza e qualità del cibo contano più dell'etichetta.","my.sleepcatch.m":"Si può recuperare del tutto il sonno nel weekend.","my.sleepcatch.r":"Dormire di più aiuta in parte, ma orari irregolari e sonno breve ripetuto hanno comunque costi metabolici.","my.steps.m":"Contano solo i 10.000 passi.","my.steps.r":"I benefici iniziano ben al di sotto e si appiattiscono attorno a 7.000–10.000 passi al giorno; ogni aumento aiuta.","ft.disc":"VITALIS ha scopo di educazione generale. Non diagnostica, non cura e non sostituisce il parere medico professionale. Consulta un clinico qualificato prima di cambiare dieta, esercizio, integratori o farmaci.","ft.license":"Licenza MIT · © 2026 Alexandru-Ionuț Chiuță (Alexio)","ft.tf":"Trade-free · offline · nessun tracciamento: i tuoi dati restano in questo browser.","ft.src":"Ispirato alla n los efectos secundarios y quién no debería usarlo?","px3":"¿Cómo se almacenan, comparten o venden mis datos de salud?","px4":"¿Cuál es el coste total, incluidas las suscripciones, y cuál es la política de devolución?","px5":"¿La afirmación se basa en un resultado de salud real o en una medida indirecta?","prep.q4":"Qué llevar","pk1":"Entrada en el móvil","pk2":"Libreta o app de notas","pk3":"Resultados de analíticas recientes","pk4":"Lista de tu medicación y suplementos","pk5":"Móvil cargado o batería externa","pk6":"Calzado cómodo y una botella de agua","pil.h":"Los nueve pilares","pil.p":"Ordenados según el respaldo de la evidencia. Abre un pilar para ver el porqué, tres primeros pasos y errores comunes.","pil.act":"Primeros pasos","pil.pit":"Ojo con","pil.ev":"Evidencia","evd.strong":"Evidencia sólida","evd.moderate":"Evidencia moderada","evd.emerging":"Evidencia emergente","evd.varies":"Varía según el producto","p.sleep.t":"Sueño y ritmo circadiano","p.sleep.tag":"La base sobre la que se apoyan todos los demás pilares","p.sleep.why":"El sueño consolida la memoria y regula las hormonas del apetito, la sensibilidad a la insulina y el estado de ánimo. Dormir poco o de forma irregular de manera crónica se asocia con mayor riesgo de obesidad, diabetes, enfermedad cardiovascular y depresión.","p.sleep.a1":"Mantén una hora fija de despertar, también los fines de semana, y busca luz exterior en la primera hora tras despertar.","p.sleep.a2":"Deja la cafeína al menos 8 horas antes de acostarte y mantén el dormitorio oscuro, silencioso y fresco (unos 16–19 °C).","p.sleep.a3":"Baja las luces y aparta las pantallas la última hora; apunta a 7–9 horas en la cama en la mayoría de los adultos.","p.sleep.pit":"El alcohol acorta y fragmenta el sueño, y los rastreadores de sueño comerciales son estimaciones aproximadas: fíate de cómo te sientes y de la tendencia, no de una sola noche.","p.metab.t":"Salud metabólica e insulina","p.metab.tag":"Una nutrición que mantiene estables la glucosa y la insulina","p.metab.why":"La resistencia a la insulina, a menudo impulsada por el exceso de grasa visceral, el sedentarismo, el mal sueño y los ultraprocesados, está en el origen de la diabetes tipo 2, el hígado graso y buena parte de la enfermedad cardiovascular. Muchas personas mejoran al reducir los carbohidratos refinados y las bebidas azucaradas; comer bajo en carbohidratos o cetogénico es una opción eficaz, no la única.","p.metab.a1":"Basa tus comidas en proteína, vegetales ricos en fibra y alimentos mínimamente procesados; elimina primero las bebidas azucaradas.","p.metab.a2":"Camina 10–15 minutos después de tus comidas más copiosas; atenúa la subida de glucosa.","p.metab.a3":"Controla el índice cintura-altura y, con tu médico, la glucosa en ayunas, la HbA1c, los triglicéridos y la insulina en ayunas.","p.metab.pit":"Si tomas medicación para la diabetes o la tensión arterial, nunca cambies las dosis ni empieces una dieta cetogénica ni un ayuno sin supervisión médica.","p.move.t":"Movimiento y forma física","p.move.tag":"El músculo y la forma cardiorrespiratoria son fuertes predictores de la esperanza de vida","p.move.why":"La capacidad aeróbica (VO2max) y la fuerza muscular están entre los predictores modificables más potentes de mortalidad, y el músculo es además un gran sumidero de glucosa.","p.move.a1":"Acumula 150–300 minutos semanales de actividad moderada, con buena parte a un ritmo en el que puedas hablar (zona 2).","p.move.a2":"Haz pesas o entrenamiento de fuerza al menos dos veces por semana, trabajando todos los grandes grupos musculares.","p.move.a3":"Añade una sesión corta de intervalos intensos a la semana si estás en buen estado de salud, y camina tantos pasos diarios como puedas con comodidad.","p.move.pit":"Aumenta la carga poco a poco; los saltos bruscos causan la mayoría de las lesiones. Consulta antes con un médico si tienes cardiopatía o síntomas.","p.stress.t":"Estrés y resiliencia emocional","p.stress.tag":"Entrena al sistema nervioso para recuperarse","p.stress.why":"El estrés crónico altera el sueño, el apetito, la tensión arterial y la función inmunitaria. Habilidades como la respiración lenta, el contacto con la naturaleza y los métodos cognitivo-conductuales tienen efectos medibles en la ansiedad y el bienestar.","p.stress.a1":"Practica respiración lenta, a unas 5–6 respiraciones por minuto, durante 5 minutos, una o dos veces al día.","p.stress.a2":"Programa una recuperación real: un paseo diario al aire libre, una afición o tiempo sin pantallas.","p.stress.a3":"Identifica tus principales fuentes de estrés y cambia una de ellas; recurre a terapia o programas basados en TCC si la ansiedad persiste.","p.stress.pit":"Una app de respiración no arregla una vida sobrecargada ni la ansiedad o depresión clínicas: busca ayuda profesional si los síntomas se prolongan o afectan a tu día a día.","p.brain.t":"Optimización cerebral","p.brain.tag":"Protege la memoria, la concentración y la creatividad durante décadas","p.brain.why":"Grandes revisiones atribuyen aproximadamente el 45 % de los casos de demencia a factores de riesgo modificables: hipertensión, pérdida auditiva, inactividad, tabaquismo, diabetes, aislamiento y más. El ejercicio, el sueño, el aprendizaje y el contacto social ayudan.","p.brain.a1":"Controla la tensión arterial, corrige los problemas de audición y visión y evita el tabaco.","p.brain.a2":"Haz cosas difíciles y nuevas: un idioma, un instrumento, una habilidad con retroalimentación.","p.brain.a3":"Protege el trabajo profundo: bloques de 60–90 minutos haciendo una sola tarea y con las notificaciones apagadas.","p.brain.pit":"La investigación sobre cetonas y salud cerebral es prometedora pero aún emergente; los suplementos nootrópicos rara vez superan al sueño, el ejercicio y el aprendizaje.","p.hormesis.t":"Hormesis: calor, frío, luz y ayuno","p.hormesis.tag":"Un estrés pequeño y controlado que puede reforzar la resiliencia","p.hormesis.why":"El uso de la sauna se ha asociado con menor mortalidad cardiovascular en estudios observacionales; la exposición al frío aumenta el estado de alerta de forma aguda; comer en una ventana horaria limitada puede ayudar a algunas personas. La mayoría de los datos de beneficio a largo plazo son observacionales o de ensayos pequeños.","p.hormesis.a1":"Prueba sesiones regulares de sauna de 10–20 minutos, aumentando poco a poco y manteniéndote hidratado.","p.hormesis.a2":"Si te gustan las duchas o inmersiones frías, empieza con pocos minutos y evítalas justo después del entrenamiento de fuerza si tu objetivo es ganar músculo.","p.hormesis.a3":"Una pausa nocturna de 12–14 horas sin comer es un punto de partida fácil y de bajo riesgo.","p.hormesis.pit":"El calor, el frío y el ayuno no son seguros para todos: cardiopatías, embarazo, trastornos de la conducta alimentaria, tratamiento de la diabetes y consumo de alcohol requieren consejo médico.","p.connect.t":"Conexión y propósito","p.connect.tag":"El factor de longevidad más infravalorado","p.connect.why":"La soledad y el aislamiento social se asocian con un riesgo de mortalidad comparable al de otros grandes factores de estilo de vida, mientras que las relaciones sólidas y el sentido de propósito se asocian con mejor salud y una vida más larga.","p.connect.a1":"Programa contacto recurrente con las personas que te importan y protégelo como una cita médica.","p.connect.a2":"Únete a un grupo en torno a algo que disfrutes: deporte, voluntariado, una artesanía, una comunidad.","p.connect.a3":"Anota qué da sentido a tus días y alinea con ello una acción semanal.","p.connect.pit":"Las redes sociales no sustituyen al contacto en persona; la calidad de las relaciones importa más que la cantidad.","p.measure.t":"Medición y diagnóstico","p.measure.tag":"Conoce tus cifras, actúa según las tendencias","p.measure.why":"La tensión arterial, la glucosa, los lípidos, la inflamación y el estado nutricional revelan problemas años antes de los síntomas. Los wearables aportan tendencias de frecuencia cardiaca en reposo, HRV y sueño. Los test de ADN y de edad biológica de venta directa tienen hoy un valor clínico limitado.","p.measure.a1":"Controla la tensión con regularidad y pide glucosa en ayunas, HbA1c, lípidos con ApoB, hs-CRP y vitamina D.","p.measure.a2":"Usa los wearables para ver tendencias de semanas, no veredictos de un solo día.","p.measure.a3":"Repite las pruebas tras 8–12 semanas de un cambio para ver si funcionó.","p.measure.pit":"Más pruebas no siempre es mejor: resultados anormales sin una acción clara pueden causar ansiedad y procedimientos innecesarios. Interpreta los resultados con un profesional sanitario.","p.supp.t":"Suplementación inteligente","p.supp.tag":"Cubre carencias, no persigas milagros","p.supp.why":"Unos pocos suplementos tienen buena evidencia en humanos cuando se usan por el motivo adecuado; muchos compuestos de longevidad que se anuncian no la tienen. Primero van la comida, el sueño y el ejercicio.","p.supp.a1":"Hazte pruebas antes de suplementar: la vitamina D, la ferritina y la B12 son carencias frecuentes.","p.supp.a2":"La creatina monohidrato (3–5 g al día) tiene sólida evidencia para el músculo y la fuerza; el omega-3 puede ayudar cuando se come poco pescado azul.","p.supp.a3":"Elige productos analizados por terceros e introduce un cambio cada vez.","p.supp.pit":"Las megadosis, combinar muchos productos y las mezclas no reguladas conllevan riesgos e interacciones con medicamentos. La evidencia en humanos de los potenciadores de NAD+ y del resveratrol sigue siendo insuficiente.","tools.h":"Calculadoras y temporizadores","tools.p":"Todo funciona en local en tu navegador; no se envía nada a ningún sitio.","disc.short":"Herramientas educativas, no consejo médico ni diagnóstico.","t.met.h":"Resistencia a la insulina y marcadores metabólicos","t.met.p":"Rellena lo que tengas: glucosa e insulina dan el HOMA-IR; triglicéridos y glucosa dan el índice TyG; cintura y altura dan el índice cintura-altura.","t.met.note":"Los puntos de corte varían según el laboratorio, la técnica y la población; toma los resultados como punto de partida para hablar con tu médico.","f.glu":"Glucosa en ayunas","f.ins":"Insulina en ayunas","f.tg":"Triglicéridos","f.waist":"Cintura","f.height":"Altura","o.homa":"HOMA-IR","o.tyg":"Índice TyG","o.whtr":"Índice cintura-altura","o.need":"Rellena los campos para ver los resultados.","st.ok":"En rango objetivo","st.watch":"A vigilar","st.flag":"Consultar con un médico","t.en.h":"Necesidades de energía y proteína","t.en.p":"Estimación de Mifflin-St Jeor de la energía en reposo y diaria, más objetivos de proteína.","f.sex":"Sexo","sex.m":"Hombre","sex.f":"Mujer","f.age":"Edad","f.weight":"Peso","f.act":"Nivel de actividad","act.1":"Sedentario (trabajo de oficina, poco ejercicio)","act.2":"Ligero (1–3 entrenamientos a la semana)","act.3":"Moderado (3–5 entrenamientos a la semana)","act.4":"Alto (6–7 entrenamientos a la semana)","act.5":"Muy alto (trabajo físico y entrenamiento)","o.bmr":"Energía en reposo (BMR)","o.tdee":"Energía diaria (TDEE)","o.prot1":"Proteína, adultos en general","o.prot2":"Proteína, con entrenamiento de fuerza","t.hr.h":"Zonas de frecuencia cardiaca","t.hr.p":"Frecuencia cardiaca máxima estimada (Tanaka: 208 − 0,7 × edad) y cinco zonas de entrenamiento. Los valores individuales varían.","hz.1":"Zona 1 — recuperación","hz.2":"Zona 2 — suave, se puede hablar","hz.3":"Zona 3 — tempo","hz.4":"Zona 4 — umbral","hz.5":"Zona 5 — máxima","o.hrmax":"Frecuencia cardiaca máx. estimada","t.sl.h":"Planificador de ciclos de sueño","t.sl.p":"El sueño se organiza en ciclos de unos 90 minutos. Las horas incluyen unos 15 minutos para dormirse.","f.wake":"Necesito despertarme a las","f.bed":"Si me acuesto a las","o.bedat":"Acuéstate a las","o.wakeat":"Despiértate a las","o.cycles":"{0} ciclos · {1} h de sueño","o.caf":"Última cafeína hacia las {0}","t.fa.h":"Temporizador de ayuno","t.fa.p":"Registra tu pausa nocturna o más larga sin comer. Las descripciones de las fases son aproximadas y varían entre personas.","fa.start":"Iniciar ayuno","fa.stop":"Terminar ayuno","fa.goal":"Objetivo","fa.elapsed":"Transcurrido","fs.0":"Estado posprandial: la glucosa y la insulina en sangre están elevadas tras la comida.","fs.1":"Fase postabsortiva: la insulina baja y el cuerpo recurre más al combustible almacenado.","fs.2":"Aumenta la quema de grasa y en muchas personas empieza a subir la producción de cetonas.","fs.3":"Estado de ayuno más profundo; las respuestas varían mucho entre individuos.","fs.4":"Ayuno prolongado: solo con supervisión médica.","fa.warn":"No apto en embarazo, menores de 18 años, antecedentes de trastornos alimentarios, bajo peso, ni si usas medicación para la diabetes, salvo que tu médico lo apruebe.","t.br.h":"Guía de respiración","t.br.p":"Sigue el círculo. Las exhalaciones lentas activan el sistema parasimpático y pueden reducir el estrés percibido en minutos.","br.coh":"Coherente 5,5 / 5,5","br.box":"Cuadrada 4-4-4-4","br.478":"4-7-8","br.46":"Calma 4 / 6","br.start":"Iniciar","br.stop":"Detener","br.in":"Inhala","br.hold":"Retén","br.out":"Exhala","br.cycles":"{0} ciclos","sc.h":"Score 360","sc.p":"Dieciocho afirmaciones, dos por pilar. Responde pensando en el último mes y con sinceridad. Los resultados se quedan en este dispositivo.","sc.s.0":"Casi nunca","sc.s.1":"A veces","sc.s.2":"A menudo","sc.s.3":"Casi siempre","q.sleep.1":"Me despierto casi a la misma hora todos los días y recibo luz natural pronto.","q.sleep.2":"Duermo 7–9 horas y me despierto con sensación de descanso.","q.metab.1":"Mis comidas se basan sobre todo en proteína, verduras y alimentos mínimamente procesados.","q.metab.2":"Rara vez tomo bebidas azucaradas ni dulces o snacks entre comidas.","q.move.1":"Hago ejercicio de intensidad moderada 150 minutos o más a la semana.","q.move.2":"Hago entrenamiento de fuerza al menos dos veces por semana.","q.stress.1":"Tengo una práctica diaria que me calma, como respirar, caminar o meditar.","q.stress.2":"Me recupero bien tras los días estresantes y rara vez me siento desbordado/a.","q.brain.1":"Aprendo algo nuevo o realizo trabajo mental exigente con regularidad.","q.brain.2":"Puedo concentrarme 60 minutos sin mirar el móvil constantemente.","q.hormesis.1":"Uso calor, frío, ventanas de ayuno o prácticas similares de forma segura y regular.","q.hormesis.2":"Dejo al menos 12 horas entre la última comida del día y la primera del siguiente.","q.connect.1":"Paso tiempo de calidad con personas que me importan cada semana.","q.connect.2":"Siento que mis días tienen propósito y dirección.","q.measure.1":"Conozco mis valores recientes de tensión arterial, glucosa y colesterol.","q.measure.2":"Acudo a mi médico y me hago pruebas cuando toca, no solo cuando estoy enfermo/a.","q.supp.1":"Tomo suplementos solo por una razón, idealmente tras hacerme pruebas.","q.supp.2":"Sé qué tomo, en qué dosis y si interactúa con mi medicación.","sc.prog":"{0}/{1} respondidas","sc.go":"Ver mi Score 360","sc.res.h":"Tu resultado","sc.overall":"Global","sc.hi":"Base sólida. Mantén lo que funciona y afina tu pilar más débil.","sc.mid":"Buena base con margen claro de mejora. Elige el pilar más bajo y haz un cambio esta semana.","sc.lo":"Empieza por lo básico: sueño, movimiento y calidad de la comida. Los pasos pequeños y constantes son los que ganan.","sc.weak":"Empieza por","sc.open":"Abrir pilar","sc.retake":"Repetir el test","sc.hist":"Resultados anteriores","sc.note":"Una autoevaluación de estilo de vida, no una medida de edad biológica ni de riesgo de enfermedad.","lb.h":"Panel de biomarcadores","lb.p":"Introduce los valores de tu analítica. VITALIS los compara con umbrales de referencia de adultos de uso habitual. Unidades: mg/dL salvo indicación.","lb.sex":"Sexo (algunos umbrales difieren)","lb.sum":"{0} en rango · {1} a vigilar · {2} a consultar","lb.rng":"Referencia","lb.copy":"Copiar resumen","lb.copied":"Copiado","lb.note":"Los rangos de referencia difieren entre laboratorios y guías. Un valor fuera de rango no es un diagnóstico, y uno dentro de rango no es una garantía. Revisa los resultados con un profesional sanitario.","l.glu":"Glucosa en ayunas","l.a1c":"HbA1c","l.tg":"Triglicéridos","l.hdl":"Colesterol HDL","l.ldl":"Colesterol LDL","l.apob":"ApoB","l.sys":"Tensión arterial sistólica","l.dia":"Tensión arterial diastólica","l.crp":"hs-CRP","l.vitd":"Vitamina D (25-OH)","l.ferr":"Ferritina","l.tsh":"TSH","l.alt":"ALT","l.rhr":"Frecuencia cardiaca en reposo","ri.h":"Ritual diario","ri.p":"Doce pequeños hábitos. Toca un cuadrado para marcar un día. Busca la constancia, no la perfección.","ri.today":"Hoy: {0}/{1}","ri.streak":"Racha: {0} días con al menos la mitad de los hábitos cumplidos","ri.week":"Media de 7 días: {0} %","ri.add":"Añadir","ri.ph":"Añade tu propio hábito…","ri.del":"Quitar","h.wake":"Hora fija de despertar","h.light":"Luz exterior en la primera hora tras despertar","h.steps":"Más de 7000 pasos","h.train":"Sesión de fuerza o cardio (días de entrenamiento)","h.protein":"Proteína en cada comida principal","h.fiber":"Verduras o fibra en dos comidas","h.nosugar":"Sin bebidas azucaradas","h.caf":"Sin cafeína en las 8 horas previas a acostarme","h.screens":"Pantallas apagadas 60 minutos antes de dormir","h.breath":"5 minutos de respiración lenta","h.social":"Tiempo de calidad con alguien","h.learn":"20 minutos de aprendizaje o lectura","gl.h":"Glosario","gl.p":"Definiciones en lenguaje sencillo de términos que oirás en un evento de biohacking.","gl.search":"Buscar un término…","gl.none":"Ningún término coincide.","g.ir.t":"Resistencia a la insulina","g.ir.d":"Las células responden mal a la insulina, así que el cuerpo necesita más para sacar la glucosa de la sangre. Un paso temprano hacia la diabetes tipo 2.","g.homa.t":"HOMA-IR","g.homa.d":"Estimación de la resistencia a la insulina a partir de glucosa e insulina en ayunas: glucosa (mg/dL) × insulina (µIU/mL) ÷ 405.","g.a1c.t":"HbA1c","g.a1c.d":"El porcentaje de hemoglobina que lleva azúcar unida; refleja la glucosa media en sangre de unos tres meses.","g.ketones.t":"Cetonas","g.ketones.d":"Moléculas que el hígado produce a partir de grasa cuando se comen muy pocos carbohidratos o durante un ayuno prolongado; un combustible alternativo para el cerebro y los músculos.","g.autophagy.t":"Autofagia","g.autophagy.d":"El proceso de reciclaje de la célula que elimina componentes dañados. El ayuno y el ejercicio influyen en ella; la evidencia en humanos sobre sus beneficios aún se está desarrollando.","g.mtor.t":"mTOR","g.mtor.d":"Una vía de señalización del crecimiento activada por los nutrientes, sobre todo los aminoácidos; esencial para construir tejido y estudiada en el envejecimiento.","g.ampk.t":"AMPK","g.ampk.d":"Un sensor de energía que se activa con el ejercicio y la baja disponibilidad de energía, y favorece el uso de grasa y la salud mitocondrial.","g.nad.t":"NAD+","g.nad.d":"Una coenzima clave del metabolismo energético que disminuye con la edad. Los suplementos que la elevan aún no han mostrado un beneficio clínico claro en humanos.","g.mito.t":"Mitocondrias","g.mito.d":"Las centrales energéticas de la célula. Su número y calidad responden al ejercicio y se relacionan con la salud metabólica.","g.hormesis.t":"Hormesis","g.hormesis.d":"Una respuesta adaptativa beneficiosa a una dosis baja de un factor de estrés, como el ejercicio, el calor o el frío; perjudicial a dosis altas.","g.vo2.t":"VO2max","g.vo2.d":"La tasa máxima a la que tu cuerpo puede usar oxígeno durante el ejercicio; un marcador sólido de forma cardiorrespiratoria y longevidad.","g.hrv.t":"HRV","g.hrv.d":"Variabilidad de la frecuencia cardiaca: variación del tiempo entre latidos. Se usa como indicador aproximado de recuperación y estrés; compárala con tu propia referencia.","g.healthspan.t":"Años de vida sana","g.healthspan.d":"El número de años vividos con buena salud, frente a la esperanza de vida, el total de años vividos.","g.senescence.t":"Senescencia celular","g.senescence.d":"Células que dejan de dividirse pero siguen activas y liberan señales inflamatorias; se acumulan con la edad.","g.circadian.t":"Ritmo circadiano","g.circadian.d":"El reloj interno de unas 24 horas que gobierna el sueño, las hormonas y el metabolismo, marcado principalmente por la luz.","g.glyvar.t":"Variabilidad glucémica","g.glyvar.d":"Cuánto oscila la glucosa en sangre, arriba y abajo, a lo largo del día. Las grandes oscilaciones pueden importar más allá de la media.","g.apob.t":"ApoB","g.apob.d":"La proteína presente en cada partícula lipoproteica aterogénica; su concentración aproxima el número de partículas que pueden entrar en las paredes arteriales.","g.crp.t":"hs-CRP","g.crp.d":"Un marcador sanguíneo de inflamación de bajo grado, relacionado con el riesgo cardiovascular. Se dispara durante una infección.","g.epiclock.t":"Reloj epigenético","g.epiclock.d":"Una estimación estadística de la edad biológica a partir de los patrones de metilación del ADN. Interesante en investigación, con uso clínico limitado hoy.","g.zone2.t":"Zona 2","g.zone2.d":"Esfuerzo aeróbico suave en el que aún puedes mantener una conversación; construye la base mitocondrial y aeróbica.","g.sarco.t":"Sarcopenia","g.sarco.d":"Pérdida de masa y fuerza muscular relacionada con la edad, que el entrenamiento de fuerza y la proteína ayudan a prevenir.","g.microbiome.t":"Microbioma","g.microbiome.d":"Los billones de microbios de tu intestino que influyen en la digestión, la inmunidad y el metabolismo; las dietas variadas y ricas en fibra lo favorecen.","g.vfat.t":"Grasa visceral","g.vfat.d":"Grasa almacenada alrededor de los órganos internos; más activa metabólicamente y más ligada a la resistencia a la insulina que la grasa subcutánea.","g.cgm.t":"CGM","g.cgm.d":"Monitor continuo de glucosa: un sensor en la piel que registra la glucosa a lo largo del día. Útil en la diabetes; su valor en personas sanas aún se debate.","my.h":"Mitos frente a evidencia","my.p":"El biohacking mezcla ciencia sólida con marketing. Toca para comparar.","my.m":"Mito","my.r":"Lo que dice la evidencia","my.detox.m":"Los zumos y tés detox limpian tu cuerpo.","my.detox.r":"El hígado, los riñones, los pulmones y el intestino ya lo hacen. Ningún producto detox ha demostrado eliminar toxinas mejor que la fisiología normal.","my.supps.m":"Cuantos más suplementos, mejor.","my.supps.r":"Más allá de corregir una carencia, los beneficios son pequeños o no están demostrados, y las dosis altas pueden perjudicar o interactuar con medicamentos.","my.bioage.m":"Un test de edad biológica te dice tu edad real exacta.","my.bioage.r":"Los distintos relojes dan respuestas distintas, y ninguno está validado aún para orientar decisiones de tratamiento individuales.","my.cold.m":"Las inmersiones en frío queman grasa y alargan la vida.","my.cold.r":"El frío aumenta el estado de alerta y puede mejorar el ánimo de forma aguda; falta evidencia en humanos de pérdida de grasa o mayor longevidad.","my.fasting.m":"El ayuno es bueno para todo el mundo.","my.fasting.r":"Los resultados varían, y el ayuno puede no ser adecuado o seguro para algunos grupos. El mejor patrón de alimentación es el que puedes mantener con seguridad.","my.onediet.m":"Una dieta es la óptima para todas las personas.","my.onediet.r":"Las respuestas individuales difieren en glucosa, apetito y tolerancia. La adherencia y la calidad de los alimentos importan más que la etiqueta.","my.sleepcatch.m":"Se puede recuperar todo el sueño atrasado el fin de semana.","my.sleepcatch.r":"Dormir más ayuda en parte, pero los horarios irregulares y dormir poco de forma repetida siguen teniendo costes metabólicos.","my.steps.m":"Solo cuentan los 10 000 pasos.","my.steps.r":"Los beneficios empiezan muy por debajo y se estabilizan en unos 7000–10 000 pasos al día; cualquier aumento ayuda.","ft.disc":"VITALIS es de carácter educativo general. No diagnostica, no trata ni sustituye el consejo médico profesional. Consulta a un profesional sanitario cualificado antes de cambiar la dieta, el ejercicio, los suplementos o la medicación.","ft.license":"Licencia MIT · © 2026 Alexandru-Ionuț Chiuță (Alexio)","ft.tf":"Trade-free · sin conexión · sin rastreo: tus datos se quedan en este navegador.","ft.src":"Inspirado en la conferencia Biohacking360 (biohacking360.com). No oficial, sin afiliación.","ft.bmc":"Invítame a un café","ft.export":"Exportar mis datos","ft.import":"Importar datos","ft.reset":"Borrar todos los datos","ft.resetq":"¿Borrar todos los datos guardados en este navegador?","ft.imp.ok":"Datos importados.","ft.imp.err":"No se pudo leer el archivo.","theme":"Cambiar tema","o.range":"Algunos valores parecen fuera del rango plausible. Compruébalos.","ri.max":"Máximo 20 hábitos propios.","nav.aria":"Secciones","lang.aria":"Idioma","ft.imp.big":"El archivo es demasiado grande o no es válido."},"pt":{"title":"VITALIS — saúde, longevidade e biohacking de excelência","skip":"Saltar para o conteúdo","brand.sub":"saúde · longevidade · biohacking","nav.home":"Início","nav.event":"Conferência","nav.pillars":"Pilares","nav.tools":"Ferramentas","nav.score":"Score 360","nav.labs":"Biomarcadores","nav.ritual":"Ritual diário","nav.gloss":"Glossário","home.eyebrow":"A experiência definitiva de saúde, longevidade e biohacking","home.h1":"Melhora a tua saúde, uma célula de cada vez.","home.lead":"O VITALIS é um companheiro privado e offline para a otimização humana: nove pilares ordenados por evidência, calculadoras, um score de estilo de vida, um painel de biomarcadores e um registo de ritual diário. Inspirado na conferência Biohacking360, em Bucareste.","home.cta1":"Explorar os pilares","home.cta2":"A conferência","home.prob.h":"Qual destes te soa familiar?","home.prob.p":"Toca no que se aplica a ti. O VITALIS indica os pilares com maior probabilidade de ajudar.","home.prob.none":"Seleciona um ou mais para receber sugestões.","home.prob.rec":"Pilares sugeridos","home.out.h":"Soluções de biohacking","home.inside.h"
