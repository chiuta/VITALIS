desconhece?","pz3":"Que marcadores mostram se está a funcionar para mim?","prep.q3":"Perguntas para os expositores","px1":"Que ensaios em humanos sustentam este produto ou dispositivo, e foram independentes?","px2":"Quais são os efeitos secundários e quem não o deve usar?","px3":"Como são armazenados, partilhados ou vendidos os meus dados de saúde?","px4":"Qual é o custo total, incluindo subscrições, e qual é a política de reembolso?","px5":"A alegação baseia-se no meu resultado de saúde ou numa medida substituta?","prep.q4":"Lista de bagagem","pk1":"Bilhete no telemóvel","pk2":"Caderno ou app de notas","pk3":"Resultados de análises recentes","pk4":"Lista da tua medicação e suplementos","pk5":"Telemóvel carregado ou power bank","pk6":"Sapatos confortáveis e uma garrafa de água","pil.h":"Os nove pilares","pil.p":"Ordenados pela solidez da evidência. Abre um pilar para ver o porquê, três primeiros passos e armadilhas comuns.","pil.act":"Primeiros passos","pil.pit":"Atenção","pil.ev":"Evidência","evd.strong":"Evidência forte","evd.moderate":"Evidência moderada","evd.emerging":"Evidência emergente","evd.varies":"Varia consoante o produto","p.sleep.t":"Sono e ritmo circadiano","p.sleep.tag":"A base em que assentam todos os outros pilares","p.sleep.why":"O sono consolida a memória e regula as hormonas do apetite, a sensibilidade à insulina e o humor. Dormir pouco ou de forma irregular durante muito tempo associa-se a maior risco de obesidade, diabetes, doença cardiovascular e depressão.","p.sleep.a1":"Mantém uma hora fixa para acordar, incluindo ao fim de semana, e apanha luz exterior na primeira hora depois de acordar.","p.sleep.a2":"Deixa de tomar cafeína pelo menos 8 horas antes de deitar e mantém o quarto escuro, silencioso e fresco (cerca de 16–19 °C).","p.sleep.a3":"Reduz as luzes e afasta os ecrãs na última hora; procura 7–9 horas na cama, na maioria dos adultos.","p.sleep.pit":"O álcool encurta e fragmenta o sono, e os monitores de sono de consumo são estimativas grosseiras: confia no que sentes e na tendência, não numa só noite.","p.metab.t":"Saúde metabólica e insulina","p.metab.tag":"Uma alimentação que mantém a glicemia e a insulina estáveis","p.metab.why":"A resistência à insulina, muitas vezes causada por excesso de gordura visceral, sedentarismo, sono fraco e alimentos ultraprocessados, está na origem da diabetes tipo 2, da esteatose hepática e de grande parte da doença cardiovascular. Muitas pessoas melhoram ao reduzir os hidratos de carbono refinados e as bebidas açucaradas; a alimentação low-carb ou cetogénica é uma opção eficaz, não a única.","p.metab.a1":"Constrói as refeições em torno de proteína, vegetais ricos em fibra e alimentos pouco processados; começa por eliminar as bebidas açucaradas.","p.metab.a2":"Caminha 10–15 minutos depois das refeições principais; isso atenua a subida da glicose.","p.metab.a3":"Acompanha a relação cintura-altura e, com o teu médico, a glicemia em jejum, a HbA1c, os triglicéridos e a insulina em jejum.","p.metab.pit":"Se tomas medicação para a diabetes ou para a tensão arterial, nunca alteres doses nem inicies uma dieta cetogénica ou jejum sem supervisão médica.","p.move.t":"Movimento e condição física","p.move.tag":"O músculo e a aptidão cardiorrespiratória são fortes preditores de longevidade","p.move.why":"A aptidão aeróbica (VO2max) e a força muscular estão entre os preditores modificáveis de mortalidade mais fortes, e o músculo é também um dos principais locais de consumo de glicose.","p.move.a1":"Acumula 150–300 minutos por semana de atividade moderada, com grande parte suave o suficiente para conversar (zona 2).","p.move.a2":"Faz treino de força ou de resistência pelo menos duas vezes por semana, trabalhando todos os grandes grupos musculares.","p.move.a3":"Acrescenta uma sessão curta de intervalos intensos por semana, se estiveres saudável, e caminha o máximo de passos diários que conseguires com conforto.","p.move.pit":"Aumenta gradualmente; subidas bruscas de carga causam a maioria das lesões. Consulta primeiro um médico se tiveres doença cardíaca ou sintomas.","p.stress.t":"Stress e resiliência emocional","p.stress.tag":"Treina o sistema nervoso para recuperar","p.stress.why":"O stress crónico perturba o sono, o apetite, a tensão arterial e a função imunitária. Competências como a respiração lenta, o contacto com a natureza e os métodos cognitivo-comportamentais têm efeitos mensuráveis na ansiedade e no bem-estar.","p.stress.a1":"Pratica respiração lenta, a cerca de 5–6 respirações por minuto, durante 5 minutos, uma ou duas vezes por dia.","p.stress.a2":"Agenda uma recuperação real: uma caminhada diária ao ar livre, um passatempo ou tempo sem ecrãs.","p.stress.a3":"Identifica os teus principais fatores de stress e muda um deles; recorre a terapia ou a programas de base TCC quando a ansiedade persistir.","p.stress.pit":"Uma app de respiração não resolve uma vida sobrecarregada nem a ansiedade e a depressão clínicas: procura ajuda profissional quando os sintomas persistirem ou afetarem o dia a dia.","p.brain.t":"Otimização cerebral","p.brain.tag":"Protege a memória, o foco e a criatividade durante décadas","p.brain.why":"Grandes revisões atribuem cerca de 45% dos casos de demência a fatores de risco modificáveis: hipertensão, perda auditiva, inatividade, tabagismo, diabetes, isolamento e outros. Exercício, sono, aprendizagem e contacto social ajudam.","p.brain.a1":"Controla a tensão arterial, corrige problemas de audição e visão e evita o tabaco.","p.brain.a2":"Faz coisas difíceis e novas: uma língua, um instrumento, uma competência com feedback.","p.brain.a3":"Protege o trabalho profundo: blocos de 60–90 minutos numa só tarefa, com as notificações desligadas.","p.brain.pit":"A investigação sobre cetonas e saúde cerebral é promissora, mas ainda emergente; os suplementos nootrópicos raramente superam o sono, o exercício e a aprendizagem.","p.hormesis.t":"Hormese: calor, frio, luz e jejum","p.hormesis.tag":"Pequeno stress controlado que pode criar resiliência","p.hormesis.why":"A sauna foi associada a menor mortalidade cardiovascular em estudos observacionais; a exposição ao frio aumenta o estado de alerta de forma aguda; a alimentação com restrição horária pode ajudar algumas pessoas. A maior parte dos dados de benefício a longo prazo é observacional ou de pequenos ensaios.","p.hormesis.a1":"Experimenta sessões regulares de sauna de 10–20 minutos, aumentando gradualmente e mantendo-te hidratado.","p.hormesis.a2":"Se gostas de duches ou imersões frias, começa por pouco tempo e evita-os logo após o treino de força se o teu objetivo for ganhar músculo.","p.hormesis.a3":"Um intervalo noturno de 12–14 horas sem comer é um ponto de partida fácil e de baixo risco.","p.hormesis.pit":"Calor, frio e jejum não são seguros para todos: doença cardíaca, gravidez, perturbações alimentares, tratamento da diabetes e consumo de álcool exigem aconselhamento médico.","p.connect.t":"Ligação e propósito","p.connect.tag":"O fator de longevidade mais subvalorizado","p.connect.why":"A solidão e o isolamento social associam-se a um risco de mortalidade comparável ao de outros grandes fatores de estilo de vida, enquanto relações sólidas e um sentido de propósito se associam a melhor saúde e vida mais longa.","p.connect.a1":"Agenda contactos regulares com as pessoas de quem gostas e protege-os como uma consulta médica.","p.connect.a2":"Junta-te a um grupo em torno de algo que gostes: desporto, voluntariado, um ofício, uma comunidade.","p.connect.a3":"Escreve o que dá sentido aos teus dias e alinha uma ação semanal com isso.","p.connect.pit":"As redes sociais não substituem o contacto presencial; a qualidade das relações importa mais do que a quantidade.","p.measure.t":"Medição e diagnóstico","p.measure.tag":"Conhece os teus números, age sobre as tendências","p.measure.why":"A tensão arterial, a glicose, os lípidos, a inflamação e o estado nutricional revelam problemas anos antes dos sintomas. Os wearables acrescentam tendências da frequência cardíaca em repouso, da HRV e do sono. Os testes de ADN e de idade biológica vendidos diretamente ao consumidor têm hoje valor clínico limitado.","p.measure.a1":"Verifica a tensão arterial com regularidade e pede glicemia em jejum, HbA1c, lípidos com ApoB, hs-CRP e vitamina D.","p.measure.a2":"Usa os wearables para tendências ao longo de semanas, não para veredictos de um só dia.","p.measure.a3":"Repete os exames 8–12 semanas depois de uma mudança para ver se funcionou.","p.measure.pit":"Mais testes nem sempre são melhores: resultados anormais sem ação clara podem causar ansiedade e procedimentos desnecessários. Interpreta os resultados com um clínico.","p.supp.t":"Suplementação inteligente","p.supp.tag":"Preenche lacunas, não persigas milagres","p.supp.why":"Alguns suplementos têm boa evidência em humanos quando usados pela razão certa; muitos compostos de longevidade comercializados não têm. Alimentação, sono e exercício vêm primeiro.","p.supp.a1":"Testa antes de suplementar: vitamina D, ferritina e B12 são carências comuns.","p.supp.a2":"A creatina monoidratada (3–5 g por dia) tem forte evidência para músculo e força; o ómega-3 pode ajudar quando o consumo de peixe gordo é baixo.","p.supp.a3":"Escolhe produtos testados por terceiros e introduz uma mudança de cada vez.","p.supp.pit":"Megadoses, combinar muitos produtos e misturas não regulamentadas trazem riscos e interações com medicação. A evidência em humanos para estimuladores de NAD+ e resveratrol ainda é insuficiente.","tools.h":"Calculadoras e temporizadores","tools.p":"Tudo corre localmente no teu navegador; nada é enviado para lado nenhum.","disc.short":"Ferramentas educativas, não aconselhamento médico nem diagnóstico.","t.met.h":"Resistência à insulina e marcadores metabólicos","t.met.p":"Preenche o que tiveres: glicose e insulina dão o HOMA-IR; triglicéridos e glicose dão o índice TyG; cintura e altura dão a relação cintura-altura.","t.met.note":"Os valores de corte variam consoante o laboratório, o ensaio e a população; vê os resultados como ponto de partida para falar com o teu médico.","f.glu":"Glicemia em jejum","f.ins":"Insulina em jejum","f.tg":"Triglicéridos","f.waist":"Cintura","f.height":"Altura","o.homa":"HOMA-IR","o.tyg":"Índice TyG","o.whtr":"Relação cintura-altura","o.need":"Preenche os campos para ver os resultados.","st.ok":"No alvo","st.watch":"Merece atenção","st.flag":"Falar com um médico","t.en.h":"Necessidades de energia e proteína","t.en.p":"Estimativa de Mifflin-St Jeor da energia em repouso e diária, mais metas de proteína.","f.sex":"Sexo","sex.m":"Masculino","sex.f":"Feminino","f.age":"Idade","f.weight":"Peso","f.act":"Nível de atividade","act.1":"Sedentário (trabalho de secretária, pouco exercício)","act.2":"Ligeiro (1–3 treinos por semana)","act.3":"Moderado (3–5 treinos por semana)","act.4":"Elevado (6–7 treinos por semana)","act.5":"Muito elevado (trabalho físico e treino)","o.bmr":"Energia em repouso (BMR)","o.tdee":"Energia diária (TDEE)","o.prot1":"Proteína, adultos em geral","o.prot2":"Proteína, com treino de força","t.hr.h":"Zonas de frequência cardíaca","t.hr.p":"Frequência cardíaca máxima estimada (Tanaka: 208 − 0,7 × idade) e cinco zonas de treino. Os valores individuais variam.","hz.1":"Zona 1 — recuperação","hz.2":"Zona 2 — suave, dá para falar","hz.3":"Zona 3 — tempo","hz.4":"Zona 4 — limiar","hz.5":"Zona 5 — máxima","o.hrmax":"Frequência cardíaca máx. estimada","t.sl.h":"Planeador de ciclos de sono","t.sl.p":"O sono faz-se em ciclos de cerca de 90 minutos. Os horários incluem cerca de 15 minutos para adormecer.","f.wake":"Preciso de acordar às","f.bed":"Se me deitar às","o.bedat":"Deitar às","o.wakeat":"Acordar às","o.cycles":"{0} ciclos · {1} h de sono","o.caf":"Última cafeína por volta das {0}","t.fa.h":"Temporizador de jejum","t.fa.p":"Acompanha o teu intervalo noturno ou mais longo sem comer. As descrições das fases são aproximadas e diferem entre pessoas.","fa.start":"Iniciar jejum","fa.stop":"Terminar jejum","fa.goal":"Objetivo","fa.elapsed":"Decorrido","fs.0":"Estado alimentado: a glicemia e a insulina estão elevadas após a refeição.","fs.1":"Pós-absortivo: a insulina desce e o corpo recorre mais às reservas de energia.","fs.2":"A queima de gordura aumenta e, em muitas pessoas, a produção de cetonas começa a subir.","fs.3":"Estado de jejum mais profundo; as respostas variam muito entre indivíduos.","fs.4":"Jejum prolongado: apenas com supervisão médica.","fa.warn":"Não recomendado na gravidez, abaixo dos 18 anos, com historial de perturbação alimentar, baixo peso, ou se tomas medicação para a diabetes, salvo acordo do teu médico.","t.br.h":"Guia de respiração","t.br.p":"Segue o círculo. Expirações lentas ativam o sistema parassimpático e podem reduzir o stress percecionado em minutos.","br.coh":"Coerente 5,5 / 5,5","br.box":"Quadrada 4-4-4-4","br.478":"4-7-8","br.46":"Calma 4 / 6","br.start":"Iniciar","br.stop":"Parar","br.in":"Inspira","br.hold":"Segura","br.out":"Expira","br.cycles":"{0} ciclos","sc.h":"Score 360","sc.p":"Dezoito afirmações, duas por pilar. Responde com sinceridade, a pensar no último mês. Os resultados ficam neste dispositivo.","sc.s.0":"Quase nunca","sc.s.1":"Às vezes","sc.s.2":"Frequentemente","sc.s.3":"Quase sempre","q.sleep.1":"Acordo mais ou menos à mesma hora todos os dias e apanho luz natural cedo.","q.sleep.2":"Durmo 7–9 horas e acordo razoavelmente descansado.","q.metab.1":"As minhas refeições assentam sobretudo em proteína, vegetais e alimentos pouco processados.","q.metab.2":"Raramente bebo bebidas açucaradas ou como doces e petiscos entre refeições.","q.move.1":"Faço exercício de intensidade moderada 150 minutos ou mais por semana.","q.move.2":"Faço treino de força pelo menos duas vezes por semana.","q.stress.1":"Tenho uma prática diária que me acalma, como respiração, caminhada ou meditação.","q.stress.2":"Recupero bem após dias stressantes e raramente me sinto sobrecarregado.","q.brain.1":"Aprendo regularmente algo novo ou faço trabalho mental exigente.","q.brain.2":"Consigo concentrar-me durante 60 minutos sem verificar constantemente o telemóvel.","q.hormesis.1":"Uso calor, frio, janelas de jejum ou práticas semelhantes de forma segura e regular.","q.hormesis.2":"Deixo um intervalo de pelo menos 12 horas entre a última refeição e a primeira do dia seguinte.","q.connect.1":"Passo todas as semanas tempo de qualidade com as pessoas de quem gosto.","q.connect.2":"Sinto que os meus dias têm propósito e direção.","q.measure.1":"Conheço os meus valores recentes de tensão arterial, glicose e colesterol.","q.measure.2":"Vou ao médico e faço análises quando é devido, não só quando estou doente.","q.supp.1":"Tomo suplementos só por uma razão, idealmente após análises.","q.supp.2":"Sei o que tomo, em que dose e se interage com a minha medicação.","sc.prog":"{0}/{1} respondidas","sc.go":"Ver o meu Score 360","sc.res.h":"O teu resultado","sc.overall":"Global","sc.hi":"Base sólida. Mantém o que funciona e afina o teu pilar mais fraco.","sc.mid":"Base sólida com margem clara para crescer. Escolhe o pilar mais baixo e faz uma mudança esta semana.","sc.lo":"Começa pelo essencial: sono, movimento e qualidade da alimentação. Pequenos passos, repetidos, vencem.","sc.weak":"Começa por","sc.open":"Abrir pilar","sc.retake":"Repetir o questionário","sc.hist":"Resultados anteriores","sc.note":"Uma autoavaliação do estilo de vida, não uma medida da idade biológica nem do risco de doença.","lb.h":"Painel de biomarcadores","lb.p":"Escreve os valores do teu relatório de análises. O VITALIS compara-os com limiares de referência de adultos habitualmente usados. Unidades: mg/dL, salvo indicação.","lb.sex":"Sexo (alguns limiares diferem)","lb.sum":"{0} dentro do intervalo · {1} a vigiar · {2} a discutir","lb.rng":"Referência","lb.copy":"Copiar resumo","lb.copied":"Copiado","lb.note":"Os intervalos de referência diferem entre laboratórios e normas clínicas. Um valor fora do intervalo não é um diagnóstico, e um valor dentro do intervalo não é uma garantia. Revê os resultados com um clínico.","l.glu":"Glicemia em jejum","l.a1c":"HbA1c","l.tg":"Triglicéridos","l.hdl":"Colesterol HDL","l.ldl":"Colesterol LDL","l.apob":"ApoB","l.sys":"Tensão arterial sistólica","l.dia":"Tensão arterial diastólica","l.crp":"hs-CRP","l.vitd":"Vitamina D (25-OH)","l.ferr":"Ferritina","l.tsh":"TSH","l.alt":"ALT","l.rhr":"Frequência cardíaca em repouso","ri.h":"Ritual diário","ri.p":"Doze pequenos hábitos. Toca num quadrado para marcar um dia. Procura a consistência, não a perfeição.","ri.today":"Hoje: {0}/{1}","ri.streak":"Sequência: {0} dias com pelo menos metade dos hábitos cumpridos","ri.week":"Média de 7 dias: {0}%","ri.add":"Adicionar","ri.ph":"Adiciona o teu próprio hábito…","ri.del":"Remover","h.wake":"Hora fixa para acordar","h.light":"Luz exterior na primeira hora depois de acordar","h.steps":"Mais de 7000 passos","h.train":"Sessão de força ou cardio (dias de treino)","h.protein":"Proteína em cada refeição principal","h.fiber":"Vegetais ou fibra em duas refeições","h.nosugar":"Sem bebidas açucaradas","h.caf":"Sem cafeína nas 8 horas antes de deitar","h.screens":"Ecrãs desligados 60 minutos antes de deitar","h.breath":"5 minutos de respiração lenta","h.social":"Tempo de qualidade com alguém","h.learn":"20 minutos de aprendizagem ou leitura","gl.h":"Glossário","gl.p":"Definições em linguagem simples de termos que vais ouvir num evento de biohacking.","gl.search":"Pesquisar um termo…","gl.none":"Nenhum termo correspondente.","g.ir.t":"Resistência à insulina","g.ir.d":"As células respondem mal à insulina, por isso o corpo precisa de mais para retirar a glicose do sangue. Um passo precoce rumo à diabetes tipo 2.","g.homa.t":"HOMA-IR","g.homa.d":"Estimativa da resistência à insulina a partir da glicemia e da insulina em jejum: glicose (mg/dL) × insulina (µIU/mL) ÷ 405.","g.a1c.t":"HbA1c","g.a1c.d":"A proporção de hemoglobina que transporta açúcar; reflete a glicemia média ao longo de cerca de três meses.","g.ketones.t":"Cetonas","g.ketones.d":"Moléculas produzidas pelo fígado a partir da gordura quando a ingestão de hidratos de carbono é muito baixa ou durante o jejum prolongado; um combustível alternativo para o cérebro e os músculos.","g.autophagy.t":"Autofagia","g.autophagy.d":"O processo de reciclagem da célula que elimina componentes danificados. O jejum e o exercício influenciam-no; a evidência de benefícios em humanos ainda está a evoluir.","g.mtor.t":"mTOR","g.mtor.d":"Uma via de sinalização do crescimento ativada por nutrientes, sobretudo aminoácidos; essencial para formar tecidos e estudada no envelhecimento.","g.ampk.t":"AMPK","g.ampk.d":"Um sensor de energia ativado pelo exercício e pela baixa disponibilidade energética, que promove o uso de gordura e a saúde mitocondrial.","g.nad.t":"NAD+","g.nad.d":"Uma coenzima central no metabolismo energético que diminui com a idade. Os suplementos que a aumentam ainda não mostraram benefício clínico claro em humanos.","g.mito.t":"Mitocôndrias","g.mito.d":"As centrais energéticas da célula. O seu número e qualidade respondem ao exercício e estão ligados à saúde metabólica.","g.hormesis.t":"Hormese","g.hormesis.d":"Uma resposta adaptativa benéfica a uma dose baixa de um fator de stress, como o exercício, o calor ou o frio; prejudicial em doses elevadas.","g.vo2.t":"VO2max","g.vo2.d":"A taxa máxima a que o corpo consegue usar oxigénio durante o exercício; um forte marcador de aptidão cardiorrespiratória e de longevidade.","g.hrv.t":"HRV","g.hrv.d":"Variabilidade da frequência cardíaca: variação do tempo entre batimentos. Usada como indicador aproximado de recuperação e stress; compara com a tua própria base.","g.healthspan.t":"Esperança de vida saudável","g.healthspan.d":"O número de anos vividos com boa saúde, por oposição à esperança de vida, o total de anos vividos.","g.senescence.t":"Senescência celular","g.senescence.d":"Células que deixam de se dividir mas continuam ativas e libertam sinais inflamatórios; acumulam-se com a idade.","g.circadian.t":"Ritmo circadiano","g.circadian.d":"O relógio interno de cerca de 24 horas que rege o sono, as hormonas e o metabolismo, ajustado sobretudo pela luz.","g.glyvar.t":"Variabilidade glicémica","g.glyvar.d":"Quanto a glicemia oscila ao longo do dia. Grandes oscilações podem importar para além da média.","g.apob.t":"ApoB","g.apob.d":"A proteína presente em cada partícula lipoproteica aterogénica; a sua concentração aproxima o número de partículas que podem entrar nas paredes das artérias.","g.crp.t":"hs-CRP","g.crp.d":"Um marcador sanguíneo de inflamação de baixo grau, relacionado com o risco cardiovascular. Sobe durante infeções.","g.epiclock.t":"Relógio epigenético","g.epiclock.d":"Uma estimativa estatística da idade biológica a partir dos padrões de metilação do ADN. Interessante em investigação, com uso clínico limitado atualmente.","g.zone2.t":"Zona 2","g.zone2.d":"Esforço aeróbico suave em que ainda consegues manter uma conversa; constrói a base mitocondrial e aeróbica.","g.sarco.t":"Sarcopenia","g.sarco.d":"Perda de massa e força muscular associada à idade, que o treino de resistência e a proteína ajudam a prevenir.","g.microbiome.t":"Microbioma","g.microbiome.d":"Os biliões de microrganismos do intestino que influenciam a digestão, a imunidade e o metabolismo; dietas diversificadas e ricas em fibra apoiam-no.","g.vfat.t":"Gordura visceral","g.vfat.d":"Gordura armazenada à volta dos órgãos internos; metabolicamente mais ativa e mais fortemente ligada à resistência à insulina do que a gordura sob a pele.","g.cgm.t":"CGM","g.cgm.d":"Monitor contínuo de glicose: um sensor na pele que regista a glicose ao longo do dia. Útil na diabetes; o valor em pessoas saudáveis ainda é debatido.","my.h":"Mitos vs evidência","my.p":"O biohacking mistura ciência sólida com marketing. Toca para comparar.","my.m":"Mito","my.r":"O que diz a evidência","my.detox.m":"Sumos e chás detox limpam o teu corpo.","my.detox.r":"O fígado, os rins, os pulmões e o intestino já fazem isso. Nenhum produto detox demonstrou remover toxinas melhor do que a fisiologia normal.","my.supps.m":"Quantos mais suplementos, melhor.","my.supps.r":"Além de corrigir uma carência, os benefícios são pequenos ou não comprovados, e doses elevadas podem prejudicar ou interagir com medicação.","my.bioage.m":"Um teste de idade biológica diz-te a tua idade real exata.","my.bioage.r":"Relógios diferentes dão respostas diferentes, e nenhum está ainda validado para orientar decisões de tratamento individuais.","my.cold.m":"As imersões em água fria queimam gordura e prolongam a vida.","my.cold.r":"O frio aumenta o estado de alerta e pode melhorar o humor de forma aguda; faltam evidências em humanos de perda de gordura ou vida mais longa.","my.fasting.m":"O jejum serve para toda a gente.","my.fasting.r":"Os resultados variam, e o jejum pode ser inadequado ou inseguro para alguns grupos. O melhor padrão alimentar é aquele que consegues manter em segurança.","my.onediet.m":"Existe uma dieta ótima para todas as pessoas.","my.onediet.r":"As respostas individuais diferem em glicose, apetite e tolerância. A adesão e a qualidade dos alimentos contam mais do que o rótulo.","my.sleepcatch.m":"Podes compensar totalmente o sono ao fim de semana.","my.sleepcatch.r":"Dormir mais ajuda em parte, mas os horários irregulares e o sono curto repetido continuam a ter custos metabólicos.","my.steps.m":"Só contam 10 000 passos.","my.steps.r":"Os benefícios começam bem abaixo disso e estabilizam em cerca de 7000–10 000 passos por dia; qualquer aumento ajuda.","ft.disc":"O VITALIS destina-se a educação geral. Não diagnostica, não trata nem substitui aconselhamento médico profissional. Consulta um clínico qualificado antes de alterares a alimentação, o exercício, os suplementos ou a medicação.","ft.license":"Licença MIT · © 2026 Alexandru-Ionuț Chiuță (Alexio)","ft.tf":"Trade-free · offline · sem rastreio: os teus dados ficam neste navegador.","ft.src":"Inspirado na conferência Biohacking360 (biohacking360.com). Não oficial, sem afiliação.","ft.bmc":"Paga-me um café","ft.export":"Exportar os meus dados","ft.import":"Importar dados","ft.reset":"Apagar todos os dados","ft.resetq":"Apagar todos os dados guardados neste navegador?","ft.imp.ok":"Dados importados.","ft.imp.err":"Não foi possível ler o ficheiro.","theme":"Mudar de tema","o.range":"Alguns valores parecem fora do intervalo plausível. Verifica-os.","ri.max":"Máximo de 20 hábitos próprios.","nav.aria":"Secções","lang.aria":"Idioma","ft.imp.big":"O ficheiro é demasiado grande ou inválido."},"de":{"title":"VITALIS — ultimative Gesundheit, Langlebigkeit & Biohacking","skip":"Zum Inhalt springen","brand.sub":"Gesundheit · Langlebigkeit · Biohacking","nav.home":"Start","nav.event":"Konferenz","nav.pillars":"Säulen","nav.tools":"Tools","nav.score":"Score 360","nav.labs":"Biomarker","nav.ritual":"Tagesritual","nav.gloss":"Glossar","home.eyebrow":"Das ultimative Erlebnis für Gesundheit, Langlebigkeit & Biohacking","home.h1":"Verbessere deine Gesundheit, Zelle für Zelle.","home.lead":"VITALIS ist ein privater Offline-Begleiter für Selbstoptimierung: neun nach Evidenz gereihte Säulen, Rechner, ein Lebensstil-Score, ein Biomarker-Panel und ein Tagesritual-Tracker. Inspiriert von der Biohacking360-Konferenz in Bukarest.","home.cta1":"Säulen entdecken","home.cta2":"Die Konferenz","home.prob.h":"Was kommt dir bekannt vor?","home.prob.p":"Tippe auf das, was auf dich zutrifft. VITALIS zeigt dir die Säulen, die am ehesten helfen.","home.prob.none":"Wähle eine oder mehrere Optionen für Vorschläge.","home.prob.rec":"Empfohlene Säulen","home.out.h":"Biohacking-Lösungen","home.inside.h":"Das steckt drin","cd.d":"Tage","cd.h":"Std.","cd.m":"Min.","cd.s":"Sek.","cd.until":"bis Biohacking360 — Nord Events, Bukarest, 14. November 2026","cd.live":"Biohacking360 findet heute in Bukarest statt.","cd.done":"Biohacking360 (14. November 2026) hat stattgefunden.","prob.fatigue":"Chronische Müdigkeit","prob.energy":"Wenig Energie","prob.sleep":"Schlechter Schlaf","prob.deficiency":"Nährstoffmängel","prob.chaotic":"Chaotische Ernährung","prob.anxiety":"Angst & Stress","prob.shape":"Nachlassende Fitness","prob.mental":"Probleme mit der geistigen Leistung","out.stamina.t":"Stelle deine Ausdauer wieder her","out.stamina.d":"Behebe die Grundlagen, die Energie rauben: Schlaf, Blutzuckerschwankungen, Bewegungsmangel.","out.vitality.t":"Baue deine Vitalität auf","out.vitality.d":"Kraft, Fitness und Stoffwechselgesundheit sind die Basis für eine lange gesunde Lebensspanne.","out.performance.t":"Steigere deine Leistung","out.performance.d":"Fokus, Erholung und Stressbewältigung, die auch unter Druck halten.","out.longevity.t":"Erreiche Langlebigkeit","out.longevity.d":"Setze auf die Hebel mit der stärksten Evidenz für mehr gesunde Lebensjahre.","inside.event.t":"Konferenzführer","inside.event.d":"Programm, Speaker, Tickets, Expo und ein Vorbereitungskit für Biohacking360.","inside.pillars.t":"Neun Säulen","inside.pillars.d":"Schlaf, Stoffwechsel, Bewegung, Stress, Gehirn, Hormesis, Verbundenheit, Messung, Supplemente.","inside.tools.t":"Rechner & Timer","inside.tools.d":"HOMA-IR, TyG, Energiebedarf, Herzfrequenzzonen, Schlafzyklen, Fastentimer, Atemtrainer.","inside.score.t":"Score 360","inside.score.d":"Ein Lebensstil-Check mit 18 Fragen und Radardiagramm deiner Stärken und Lücken.","inside.labs.t":"Biomarker-Panel","inside.labs.d":"Gib Laborwerte ein und sieh, welche im Normbereich liegen oder mit deinem Arzt besprochen werden sollten.","inside.ritual.t":"Tagesritual","inside.ritual.d":"Zwölf kleine Gewohnheiten, ein Siebentagesraster und ein Serienzähler.","inside.gloss.t":"Glossar & Mythen","inside.gloss.d":"24 Fachbegriffe und 8 beliebte Mythen, anhand der Evidenz geprüft.","ev.h":"Biohacking360 — Konferenzführer","ev.date":"Samstag, 14. November 2026 · Nord Events, Bukarest","ev.s1":"Teilnehmende","ev.s2":"Aussteller","ev.s3":"Stunden praxisnaher Inhalte","ev.note":"Inoffizieller Begleiter auf Basis der am 5. November 2026 auf biohacking360.com veröffentlichten Informationen. Programm, Preise und Verfügbarkeit können sich ändern: Bestätige alles stets auf der offiziellen Website.","ev.site":"Offizielle Website","ev.tickets":"Tickets kaufen","ev.sp.h":"Speaker","sp.bik.role":"Stoffwechselforscher · Insulinresistenz","sp.bik.b":"Forscher zu Adipositas, Insulinresistenz und mitochondrialer Dysfunktion; PhD in Bioenergetik mit Postdoc an der Duke-NUS Medical School, Singapur. Autor von Why We Get Sick und How Not To Get Sick.","sp.bos.role":"Ärztin · ketogene Medizin","sp.bos.b":"Ärztin mit über 30 Jahren Erfahrung in chronischen Erkrankungen, Gehirngesundheit und Suchtrehabilitation. Autorin von Any Way You Can, mit über einer Million verkaufter Bücher und einer YouTube-Community mit 1,2 Millionen Abonnenten.","ev.ag.h":"Programm","ev.ag.p":"Hake die Sessions ab, die du besuchen willst, und plane so deinen Tag.","ev.ag.mine":"{0} von {1} Punkten in meinem Tag","ag.reg":"Registrierung · Kaffee & Networking","ag.open":"Eröffnung","ag.s1":"Session 1 — Insulinresistenz und deine Stoffwechselgesundheit (Dr. Ben Bikman)","ag.s1.d":"Was Insulinresistenz ist, wie sie mit Adipositas, mitochondrialer Dysfunktion und chronischen Krankheiten zusammenhängt und was Low-Carb-Forschung für den Stoffwechsel bedeutet.","ag.brk":"Kaffeepause","ag.back":"Willkommen zurück","ag.s2":"Session 2 — Ketogene Medizin für Gehirngesundheit und chronische Krankheiten (Dr. Annette Bosworth)","ag.s2.d":"Wie ketogene Ernährung bei chronischen Erkrankungen medizinisch eingesetzt wird, was Nahrung im Gehirn bewirkt und Erkenntnisse aus über 30 Jahren Praxis.","ag.qa":"Fragerunde mit Dr. Annette Bosworth","ag.close":"Abschluss & Networking","ag.vip":"VIP-Empfang (Inhaber von First-Class-Tickets; Ort per SMS)","ev.tk.h":"Tickets","tk.vat":"+ MwSt.","tk.ga.n":"General Access — Early Bird","tk.ga.d":"Beide Masterclasses, Expo-Bereich und Produktdemos, Networking, Teilnahmezertifikat.","tk.fc.n":"First Class","tk.seats":"Nur 10 Plätze","tk.fc.d":"Zusätzlich VIP-Empfang, Plätze in der ersten Reihe, Fast-Track-Check-in und ein privates Abendessen mit den Speakern. Genaue Leistungen findest du auf der offiziellen Website.","ev.ex.h":"Expo-Bereich","ev.ex.p":"Ausprobieren, Live-Demos und Workshops sowie Zonen, die deine Gesundheit in Minuten entschlüsseln.","ex.wear.t":"Wearables & Monitoring","ex.wear.d":"Smarte Sensoren, biometrische Wearables und Gesundheitstracking in Echtzeit.","ex.nutri.t":"Ernährung & Supplemente","ex.nutri.d":"Supplemente und Nutraceuticals der nächsten Generation, abgestimmt auf DNA, Mikrobiom und Lebensstil.","ex.recov.t":"Regenerationslösungen","ex.recov.d":"Kryotherapie, Rotlicht, Infrarotsaunen und hyperbare Sauerstoffkammern.","ex.diag.t":"Diagnostik & Longevity-Kliniken","ex.diag.d":"DNA- und Stoffwechseltests, kognitive Leistungsscans, personalisierte Programme.","ev.prep.h":"Vorbereitungskit","prep.q1":"Fragen an Dr. Ben Bikman","pb1":"Welche frühen Anzeichen von Insulinresistenz sollte ich bei meinem Arzt messen lassen?","pb2":"Wie stark verändern Schlaf und Stress die Insulinsensitivität im Vergleich zur Ernährung?","pb3":"Welche ersten Schritte bringen am meisten, wenn ich mich nicht low-carb ernähre?","prep.q2":"Fragen an Dr. Annette Bosworth","pz1":"Welche Sicherheitschecks sind vor einer ketogenen Diät nötig, besonders bei Medikamenteneinnahme?","pz2":"Was sagt die aktuelle Evidenz zu Ketonen und Gehirngesundheit, und was ist noch unbekannt?","pz3":"Welche Marker zeigen, ob es bei mir wirkt?","prep.q3":"Fragen an Aussteller","px1":"Welche Humanstudien stützen dieses Produkt oder Gerät, und waren sie unabhängig?","px2":"Welche Nebenwirkungen gibt es, und wer sollte es nicht verwenden?","px3":"Wie werden meine Gesundheitsdaten gespeichert, weitergegeben oder verkauft?","px4":"Wie hoch sind die Gesamtkosten inklusive Abos, und wie lautet die Rückgaberegelung?","px5":"Beruht die Aussage auf meinem Gesundheitsergebnis oder auf einem Surrogatmarker?","prep.q4":"Packliste","pk1":"Ticket auf dem Handy","pk2":"Notizbuch oder Notiz-App","pk3":"Aktuelle Laborergebnisse","pk4":"Liste deiner Medikamente und Supplemente","pk5":"Geladenes Handy oder Powerbank","pk6":"Bequeme Schuhe und eine Wasserflasche","pil.h":"Die neun Säulen","pil.p":"Gereiht danach, wie gut die Evidenz sie stützt. Öffne eine Säule für das Warum, drei erste Schritte und häufige Fallstricke.","pil.act":"Erste Schritte","pil.pit":"Achtung","pil.ev":"Evidenz","evd.strong":"Starke Evidenz","evd.moderate":"Mäßige Evidenz","evd.emerging":"Aufkommende Evidenz","evd.varies":"Je nach Produkt unterschiedlich","p.sleep.t":"Schlaf & zirkadianer Rhythmus","p.sleep.tag":"Das Fundament, auf dem alle anderen Säulen ruhen","p.sleep.why":"Schlaf festigt das Gedächtnis und reguliert Appetithormone, Insulinsensitivität und Stimmung. Chronisch kurzer oder unregelmäßiger Schlaf geht mit einem höheren Risiko für Adipositas, Diabetes, Herz-Kreislauf-Erkrankungen und Depression einher.","p.sleep.a1":"Steh jeden Tag zur gleichen Zeit auf, auch am Wochenende, und hol dir innerhalb einer Stunde nach dem Aufwachen Tageslicht.","p.sleep.a2":"Verzichte mindestens 8 Stunden vor dem Schlafen auf Koffein und halte das Schlafzimmer dunkel, ruhig und kühl (etwa 16–19 °C).","p.sleep.a3":"Dimme in der letzten Stunde das Licht und lege Bildschirme weg; die meisten Erwachsenen sollten 7–9 Stunden im Bett verbringen.","p.sleep.pit":"Alkohol verkürzt und zerstückelt den Schlaf, und Schlaftracker liefern nur grobe Schätzungen: Vertraue deinem Gefühl und dem Trend, nicht einer einzelnen Nacht.","p.metab.t":"Stoffwechselgesundheit & Insulin","p.metab.tag":"Ernährung, die Blutzucker und Insulin stabil hält","p.metab.why":"Insulinresistenz, oft durch überschüssiges viszerales Fett, Bewegungsmangel, schlechten Schlaf und ultraverarbeitete Lebensmittel bedingt, steht am Anfang von Typ-2-Diabetes, Fettleber und vielen Herz-Kreislauf-Erkrankungen. Vielen hilft es, raffinierte Kohlenhydrate und zuckerhaltige Getränke zu reduzieren; Low-Carb oder ketogene Ernährung ist eine wirksame Option, aber nicht die einzige.","p.metab.a1":"Baue Mahlzeiten um Protein, ballaststoffreiche Pflanzen und wenig verarbeitete Lebensmittel auf; streiche zuerst zuckerhaltige Getränke.","p.metab.a2":"Geh nach deinen größten Mahlzeiten 10–15 Minuten spazieren; das dämpft den Glukoseanstieg.","p.metab.a3":"Beobachte das Taille-Größe-Verhältnis und lass mit deinem Arzt Nüchternglukose, HbA1c, Triglyceride und Nüchterninsulin prüfen.","p.metab.pit":"Wenn du Medikamente gegen Diabetes oder Bluthochdruck nimmst, ändere nie Dosen und starte keine ketogene Diät oder Fastenkur ohne ärztliche Aufsicht.","p.move.t":"Bewegung & Fitness","p.move.tag":"Muskeln und kardiorespiratorische Fitness sind starke Prädiktoren der Lebensdauer","p.move.why":"Aerobe Fitness (VO2max) und Muskelkraft gehören zu den stärksten veränderbaren Prädiktoren der Sterblichkeit, und der Muskel ist zudem ein wichtiger Ort der Glukoseaufnahme.","p.move.a1":"Sammle 150–300 Minuten pro Woche moderate Aktivität, ein großer Teil davon so locker, dass du dich unterhalten kannst (Zone 2).","p.move.a2":"Mach mindestens zweimal pro Woche Krafttraining und trainiere alle großen Muskelgruppen.","p.move.a3":"Füge, wenn du gesund bist, pro Woche eine kurze harte Intervalleinheit hinzu und geh so viele Schritte am Tag, wie dir angenehm sind.","p.move.pit":"Steigere dich schrittweise; plötzliche große Belastungssprünge verursachen die meisten Verletzungen. Lass dich bei Herzerkrankung oder Beschwerden zuerst ärztlich beraten.","p.stress.t":"Stress & emotionale Resilienz","p.stress.tag":"Trainiere dein Nervensystem, sich zu erholen","p.stress.why":"Chronischer Stress stört Schlaf, Appetit, Blutdruck und Immunfunktion. Techniken wie langsames Atmen, Zeit in der Natur und kognitiv-verhaltenstherapeutische Methoden wirken messbar auf Angst und Wohlbefinden.","p.stress.a1":"Übe ein- bis zweimal täglich 5 Minuten langsames Atmen mit etwa 5–6 Atemzügen pro Minute.","p.stress.a2":"Plane echte Erholung ein: einen täglichen Spaziergang im Freien, ein Hobby oder Zeit ohne Bildschirme.","p.stress.a3":"Benenne deine wichtigsten Stressoren und ändere einen davon; nutze Therapie oder KVT-basierte Programme, wenn die Angst anhält.","p.stress.pit":"Eine Atem-App löst weder ein überlastetes Leben noch klinische Angst oder Depression: Such dir professionelle Hilfe, wenn Symptome anhalten oder den Alltag beeinträchtigen.","p.brain.t":"Gehirnoptimierung","p.brain.tag":"Schütze Gedächtnis, Fokus und Kreativität über Jahrzehnte","p.brain.why":"Große Übersichtsarbeiten führen etwa 45 % der Demenzfälle auf veränderbare Risikofaktoren zurück: Bluthochdruck, Hörverlust, Bewegungsmangel, Rauchen, Diabetes, Isolation und mehr. Bewegung, Schlaf, Lernen und soziale Kontakte helfen alle.","p.brain.a1":"Kontrolliere den Blutdruck, behandle Hör- und Sehprobleme und rauche nicht.","p.brain.a2":"Mach Dinge, die schwierig und neu sind: eine Sprache, ein Instrument, eine Fertigkeit mit Feedback.","p.brain.a3":"Schütze konzentrierte Arbeit: Blöcke von 60–90 Minuten mit nur einer Aufgabe und ausgeschalteten Benachrichtigungen.","p.brain.pit":"Die Forschung zu Ketonen und Gehirngesundheit ist vielversprechend, aber noch am Anfang; Nootropika bringen selten mehr als Schlaf, Bewegung und Lernen.","p.hormesis.t":"Hormesis: Hitze, Kälte, Licht & Fasten","p.hormesis.tag":"Kleiner, kontrollierter Stress, der Resilienz aufbauen kann","p.hormesis.why":"Saunabesuche wurden in Beobachtungsstudien mit geringerer kardiovaskulärer Sterblichkeit in Verbindung gebracht; Kälte steigert akut die Wachheit; zeitlich eingeschränktes Essen (Time-Restricted Eating) kann manchen helfen. Die meisten Langzeitdaten stammen aus Beobachtungsstudien oder kleinen Studien.","p.hormesis.a1":"Probiere regelmäßige Saunagänge von 10–20 Minuten, steigere dich langsam und trinke ausreichend.","p.hormesis.a2":"Wenn du kalt duschst oder badest, beginne kurz und vermeide es direkt nach dem Krafttraining, falls Muskelaufbau dein Ziel ist.","p.hormesis.a3":"Eine nächtliche Essenspause von 12–14 Stunden ist ein einfacher, risikoarmer Einstieg.","p.hormesis.pit":"Hitze, Kälte und Fasten sind nicht für alle sicher: Bei Herzerkrankung, Schwangerschaft, Essstörungen, Diabetesbehandlung und Alkoholkonsum ist ärztlicher Rat nötig.","p.connect.t":"Verbundenheit & Sinn","p.connect.tag":"Der am meisten unterschätzte Langlebigkeitsfaktor","p.connect.why":"Einsamkeit und soziale Isolation gehen mit einem Sterberisiko einher, das mit anderen großen Lebensstilfaktoren vergleichbar ist, während enge Beziehungen und ein Sinn im Leben mit besserer Gesundheit und längerem Leben verbunden sind.","p.connect.a1":"Plane regelmäßigen Kontakt zu Menschen ein, die dir wichtig sind, und schütze ihn wie einen Arzttermin.","p.connect.a2":"Tritt einer Gruppe bei, die sich um etwas dreht, das dir Freude macht: Sport, Ehrenamt, ein Handwerk, eine Gemeinschaft.","p.connect.a3":"Schreib auf, was deinen Tagen Sinn gibt, und richte eine wöchentliche Handlung daran aus.","p.connect.pit":"Soziale Medien ersetzen keinen persönlichen Kontakt; die Qualität der Beziehungen zählt mehr als die Menge.","p.measure.t":"Messung & Diagnostik","p.measure.tag":"Kenne deine Werte, handle nach Trends","p.measure.why":"Blutdruck, Glukose, Blutfette, Entzündung und Nährstoffstatus zeigen Probleme Jahre vor den Symptomen. Wearables liefern Trends bei Ruheherzfrequenz, HRV und Schlaf. DNA- und Biologisches-Alter-Tests für Endverbraucher haben heute nur begrenzten klinischen Wert.","p.measure.a1":"Miss regelmäßig den Blutdruck und lass Nüchternglukose, HbA1c, Blutfette mit ApoB, hs-CRP und Vitamin D bestimmen.","p.measure.a2":"Nutze Wearables für Trends über Wochen, nicht für Urteile über einzelne Tage.","p.measure.a3":"Teste nach 8–12 Wochen einer Veränderung erneut, um zu sehen, ob sie gewirkt hat.","p.measure.pit":"Mehr Tests sind nicht immer besser: Auffällige Ergebnisse ohne klare Handlungsoption können Ängste und unnötige Eingriffe auslösen. Lass Ergebnisse von Fachleuten einordnen.","p.supp.t":"Gezielte Supplementierung","p.supp.tag":"Lücken füllen, keine Wunder jagen","p.supp.why":"Wenige Supplemente haben gute Humanevidenz, wenn sie aus dem richtigen Grund genommen werden; viele beworbene Longevity-Substanzen nicht. Ernährung, Schlaf und Bewegung kommen zuerst.","p.supp.a1":"Teste, bevor du supplementierst: Vitamin D, Ferritin und B12 sind häufige Lücken.","p.supp.a2":"Kreatin-Monohydrat (3–5 g täglich) hat starke Evidenz für Muskeln und Kraft; Omega-3 kann helfen, wenn du wenig fetten Fisch isst.","p.supp.a3":"Wähle von Dritten geprüfte Produkte und führe jeweils nur eine Änderung ein.","p.supp.pit":"Megadosen, viele kombinierte Produkte und unregulierte Mischungen bergen Risiken und Wechselwirkungen mit Medikamenten. Die Evidenz für NAD+-Booster und Resveratrol beim Menschen ist noch unzureichend.","tools.h":"Rechner & Timer","tools.p":"Alles läuft lokal in deinem Browser; nichts wird irgendwohin gesendet.","disc.short":"Lehrmittel, keine medizinische Beratung oder Diagnose.","t.met.h":"Insulinresistenz & Stoffwechselmarker","t.met.p":"Fülle aus, was du hast: Glukose und Insulin ergeben HOMA-IR; Triglyceride und Glukose den TyG-Index; Taille und Größe das Taille-Größe-Verhältnis.","t.met.note":"Grenzwerte variieren je nach Labor, Testverfahren und Bevölkerung; nutze die Ergebnisse als Gesprächsanlass für deinen Arzt.","f.glu":"Nüchternglukose","f.ins":"Nüchterninsulin","f.tg":"Triglyceride","f.waist":"Taille","f.height":"Größe","o.homa":"HOMA-IR","o.tyg":"TyG-Index","o.whtr":"Taille-Größe-Verhältnis","o.need":"Fülle die Felder aus, um Ergebnisse zu sehen.","st.ok":"Im Zielbereich","st.watch":"Beobachten","st.flag":"Mit Arzt besprechen","t.en.h":"Energie- & Proteinbedarf","t.en.p":"Schätzung von Grund- und Gesamtumsatz nach Mifflin-St Jeor sowie Proteinziele.","f.sex":"Geschlecht","sex.m":"Männlich","sex.f":"Weiblich","f.age":"Alter","f.weight":"Gewicht","f.act":"Aktivitätslevel","act.1":"Sitzend (Schreibtischjob, kaum Sport)","act.2":"Leicht (1–3 Workouts pro Woche)","act.3":"Moderat (3–5 Workouts pro Woche)","act.4":"Hoch (6–7 Workouts pro Woche)","act.5":"Sehr hoch (körperliche Arbeit und Training)","o.bmr":"Grundumsatz (BMR)","o.tdee":"Gesamtumsatz (TDEE)","o.prot1":"Protein, Erwachsene allgemein","o.prot2":"Protein, mit Krafttraining","t.hr.h":"Herzfrequenzzonen","t.hr.p":"Geschätzte maximale Herzfrequenz (Tanaka: 208 − 0,7 × Alter) und fünf Trainingszonen. Individuelle Werte variieren.","hz.1":"Zone 1 — Regeneration","hz.2":"Zone 2 — locker, Unterhaltung möglich","hz.3":"Zone 3 — Tempo","hz.4":"Zone 4 — Schwelle","hz.5":"Zone 5 — maximal","o.hrmax":"Geschätzte max. Herzfrequenz","t.sl.h":"Schlafzyklus-Planer","t.sl.p":"Schlaf verläuft in Zyklen von etwa 90 Minuten. Die Zeiten enthalten rund 15 Minuten zum Einschlafen.","f.wake":"Ich muss aufstehen um","f.bed":"Wenn ich ins Bett gehe um","o.bedat":"Geh ins Bett um","o.wakeat":"Aufwachen um","o.cycles":"{0} Zyklen · {1} Std. Schlaf","o.caf":"Letztes Koffein gegen {0}","t.fa.h":"Fastentimer","t.fa.p":"Erfasse deine nächtliche oder längere Essenspause. Die Phasenbeschreibungen sind ungefähr und von Mensch zu Mensch verschieden.","fa.start":"Fasten starten","fa.stop":"Fasten beenden","fa.goal":"Ziel","fa.elapsed":"Vergangen","fs.0":"Postprandial: Blutzucker und Insulin sind nach der Mahlzeit erhöht.","fs.1":"Postabsorptiv: Das Insulin sinkt und der Körper greift verstärkt auf gespeicherte Energie zurück.","fs.2":"Die Fettverbrennung steigt, und bei vielen beginnt die Ketonproduktion zuzunehmen.","fs.3":"Tieferer Fastenzustand; die Reaktionen unterscheiden sich stark von Mensch zu Mensch.","fs.4":"Verlängertes Fasten: nur unter ärztlicher Aufsicht.","fa.warn":"Nicht bei Schwangerschaft, unter 18 Jahren, Essstörungen in der Vorgeschichte, Untergewicht oder Einnahme von Diabetesmedikamenten, es sei denn, dein Arzt stimmt zu.","t.br.h":"Atemtrainer","t.br.p":"Folge dem Kreis. Langsames Ausatmen aktiviert das parasympathische System und kann das empfundene Stressniveau binnen Minuten senken.","br.coh":"Kohärent 5,5 / 5,5","br.box":"Box 4-4-4-4","br.478":"4-7-8","br.46":"Ruhig 4 / 6","br.start":"Start","br.stop":"Stopp","br.in":"Einatmen","br.hold":"Halten","br.out":"Ausatmen","br.cycles":"{0} Zyklen","sc.h":"Score 360","sc.p":"Achtzehn Aussagen, zwei pro Säule. Antworte ehrlich und bezogen auf den letzten Monat. Die Ergebnisse bleiben auf diesem Gerät.","sc.s.0":"Fast nie","sc.s.1":"Manchmal","sc.s.2":"Oft","sc.s.3":"Fast immer","q.sleep.1":"Ich stehe jeden Tag etwa zur gleichen Zeit auf und bekomme früh Tageslicht.","q.sleep.2":"Ich schlafe 7–9 Stunden und wache einigermaßen erholt auf.","q.metab.1":"Meine Mahlzeiten bestehen überwiegend aus Protein, Gemüse und wenig verarbeiteten Lebensmitteln.","q.metab.2":"Ich trinke selten zuckerhaltige Getränke oder esse zwischendurch Süßes und Snacks.","q.move.1":"Ich bewege mich 150 Minuten oder mehr pro Woche mit moderater Intensität.","q.move.2":"Ich mache mindestens zweimal pro Woche Krafttraining.","q.stress.1":"Ich habe eine tägliche Routine, die mich beruhigt, etwa Atmen, Spazierengehen oder Meditation.","q.stress.2":"Ich erhole mich gut nach stressigen Tagen und fühle mich selten überfordert.","q.brain.1":"Ich lerne regelmäßig etwas Neues oder leiste anspruchsvolle geistige Arbeit.","q.brain.2":"Ich kann mich 60 Minuten konzentrieren, ohne ständig auf mein Handy zu schauen.","q.hormesis.1":"Ich nutze Hitze, Kälte, Fastenfenster oder ähnliche Praktiken sicher und regelmäßig.","q.hormesis.2":"Zwischen meiner letzten Mahlzeit und der ersten am nächsten Tag liegen mindestens 12 Stunden.","q.connect.1":"Ich verbringe jede Woche bedeutungsvolle Zeit mit Menschen, die mir wichtig sind.","q.connect.2":"Ich habe das Gefühl, dass meine Tage Sinn und Richtung haben.","q.measure.1":"Ich kenne meine aktuellen Blutdruck-, Glukose- und Cholesterinwerte.","q.measure.2":"Ich gehe zum Arzt und lasse testen, wenn es fällig ist, nicht nur wenn ich krank bin.","q.supp.1":"Ich nehme Supplemente nur aus einem Grund, idealerweise nach einem Test.","q.supp.2":"Ich weiß, was ich in welcher Dosis nehme und ob es mit meinen Medikamenten wechselwirkt.","sc.prog":"{0}/{1} beantwortet","sc.go":"Meinen Score 360 ansehen","sc.res.h":"Dein Ergebnis","sc.overall":"Gesamt","sc.hi":"Starkes Fundament. Behalte, was funktioniert, und optimiere deine schwächste Säule.","sc.mid":"Solide Basis mit klarem Potenzial. Wähle die niedrigste Säule und ändere diese Woche eine Sache.","sc.lo":"Beginne mit den Grundlagen: Schlaf, Bewegung und Ernährungsqualität. Kleine Schritte, regelmäßig wiederholt, zahlen sich aus.","sc.weak":"Beginne mit","sc.open":"Säule öffnen","sc.retake":"Check wiederholen","sc.hist":"Frühere Ergebnisse","sc.note":"Eine Selbsteinschätzung des Lebensstils, kein Maß für biologisches Alter oder Krankheitsrisiko.","lb.h":"Biomarker-Panel","lb.p":"Gib die Werte aus deinem Laborbericht ein. VITALIS vergleicht sie mit üblichen Referenzgrenzen für Erwachsene. Einheiten: mg/dL, sofern nicht anders angegeben.","lb.sex":"Geschlecht (manche Grenzwerte unterscheiden sich)","lb.sum":"{0} im Normbereich · {1} beobachten · {2} besprechen","lb.rng":"Referenz","lb.copy":"Zusammenfassung kopieren","lb.copied":"Kopiert","lb.note":"Referenzbereiche unterscheiden sich zwischen Laboren und Leitlinien. Ein Wert außerhalb eines Bereichs ist keine Diagnose, und ein Wert innerhalb ist keine Garantie. Lass Ergebnisse von Fachleuten einordnen.","l.glu":"Nüchternglukose","l.a1c":"HbA1c","l.tg":"Triglyceride","l.hdl":"HDL-Cholesterin","l.ldl":"LDL-Cholesterin","l.apob":"ApoB","l.sys":"Systolischer Blutdruck","l.dia":"Diastolischer Blutdruck","l.crp":"hs-CRP","l.vitd":"Vitamin D (25-OH)","l.ferr":"Ferritin","l.tsh":"TSH","l.alt":"ALT","l.rhr":"Ruheherzfrequenz","ri.h":"Tagesritual","ri.p":"Zwölf kleine Gewohnheiten. Tippe auf ein Feld, um einen Tag zu markieren. Es geht um Beständigkeit, nicht Perfektion.","ri.today":"Heute: {0}/{1}","ri.streak":"Serie: {0} Tage mit mindestens der Hälfte der Gewohnheiten","ri.week":"7-Tage-Schnitt: {0} %","ri.add":"Hinzufügen","ri.ph":"Eigene Gewohnheit hinzufügen…","ri.del":"Entfernen","h.wake":"Feste Aufstehzeit","h.light":"Tageslicht innerhalb einer Stunde nach dem Aufwachen","h.steps":"Über 7.000 Schritte","h.train":"Kraft- oder Cardio-Einheit (Trainingstage)","h.protein":"Protein bei jeder Hauptmahlzeit","h.fiber":"Gemüse oder Ballaststoffe zu zwei Mahlzeiten","h.nosugar":"Keine zuckerhaltigen Getränke","h.caf":"Kein Koffein in den 8 Stunden vor dem Schlafen","h.screens":"Bildschirme 60 Minuten vor dem Schlafen aus","h.breath":"5 Minuten langsames Atmen","h.social":"Bedeutungsvolle Zeit mit jemandem","h.learn":"20 Minuten lernen oder lesen","gl.h":"Glossar","gl.p":"Verständliche Definitionen von Begriffen, die dir bei einem Biohacking-Event begegnen.","gl.search":"Begriff suchen…","gl.none":"Kein passender Begriff.","g.ir.t":"Insulinresistenz","g.ir.d":"Zellen reagieren schlecht auf Insulin, sodass der Körper mehr davon braucht, um Glukose aus dem Blut zu transportieren. Ein früher Schritt Richtung Typ-2-Diabetes.","g.homa.t":"HOMA-IR","g.homa.d":"Schätzwert der Insulinresistenz aus Nüchternglukose und Nüchterninsulin: Glukose (mg/dL) × Insulin (µIU/mL) ÷ 405.","g.a1c.t":"HbA1c","g.a1c.d":"Der Anteil des Hämoglobins, an den Zucker gebunden ist; spiegelt die durchschnittliche Blutglukose der letzten etwa drei Monate wider.","g.ketones.t":"Ketone","g.ketones.d":"Moleküle, die die Leber aus Fett bildet, wenn die Kohlenhydratzufuhr sehr niedrig ist oder bei längerem Fasten; ein alternativer Brennstoff für Gehirn und Muskeln.","g.autophagy.t":"Autophagie","g.autophagy.d":"Das Recyclingprogramm der Zelle, das beschädigte Bestandteile beseitigt. Fasten und Bewegung beeinflussen es; die Evidenz für Vorteile beim Menschen entwickelt sich noch.","g.mtor.t":"mTOR","g.mtor.d":"Ein Wachstumssignalweg, der durch Nährstoffe, besonders Aminosäuren, aktiviert wird; wichtig für den Gewebeaufbau und in der Alternsforschung untersucht.","g.ampk.t":"AMPK","g.ampk.d":"Ein Energiesensor, der durch Bewegung und geringe Energieverfügbarkeit aktiviert wird und Fettnutzung und Mitochondriengesundheit fördert.","g.nad.t":"NAD+","g.nad.d":"Ein zentrales Coenzym des Energiestoffwechsels, das mit dem Alter abnimmt. Supplemente, die es erhöhen, haben beim Menschen bisher keinen klaren klinischen Nutzen gezeigt.","g.mito.t":"Mitochondrien","g.mito.d":"Die Kraftwerke der Zelle. Ihre Anzahl und Qualität reagieren auf Bewegung und hängen mit der Stoffwechselgesundheit zusammen.","g.hormesis.t":"Hormesis","g.hormesis.d":"Eine vorteilhafte Anpassungsreaktion auf eine niedrige Dosis eines Stressors, etwa Bewegung, Hitze oder Kälte; in hohen Dosen schädlich.","g.vo2.t":"VO2max","g.vo2.d":"Die maximale Rate, mit der dein Körper bei Belastung Sauerstoff nutzen kann; ein starker Marker für kardiorespiratorische Fitness und Langlebigkeit.","g.hrv.t":"HRV","g.hrv.d":"Herzfrequenzvariabilität: die Schwankung der Zeit zwischen Herzschlägen. Grober Indikator für Erholung und Stress; vergleiche mit deiner eigenen Basislinie.","g.healthspan.t":"Gesundheitsspanne","g.healthspan.d":"Die Zahl der bei guter Gesundheit gelebten Jahre, im Unterschied zur Lebensspanne, den insgesamt gelebten Jahren.","g.senescence.t":"Zelluläre Seneszenz","g.senescence.d":"Zellen, die aufhören sich zu teilen, aber aktiv bleiben und Entzündungssignale abgeben; sie sammeln sich mit dem Alter an.","g.circadian.t":"Zirkadianer Rhythmus","g.circadian.d":"Die innere Uhr von etwa 24 Stunden, die Schlaf, Hormone und Stoffwechsel steuert und vor allem durch Licht gestellt wird.","g.glyvar.t":"Glykämische Variabilität","g.glyvar.d":"Wie stark die Blutglukose im Tagesverlauf auf und ab schwankt. Große Schwankungen könnten über den Durchschnitt hinaus eine Rolle spielen.","g.apob.t":"ApoB","g.apob.d":"Das Protein auf jedem atherogenen Lipoproteinpartikel; seine Konzentration entspricht näherungsweise der Zahl der Partikel, die in Arterienwände eindringen können.","g.crp.t":"hs-CRP","g.crp.d":"Ein Blutmarker für niedriggradige Entzündung, verbunden mit dem Herz-Kreislauf-Risiko. Steigt bei Infektionen sprunghaft an.","g.epiclock.t":"Epigenetische Uhr","g.epiclock.d":"Eine statistische Schätzung des biologischen Alters aus DNA-Methylierungsmustern. In der Forschung interessant, heute klinisch nur begrenzt nutzbar.","g.zone2.t":"Zone 2","g.zone2.d":"Lockere aerobe Belastung, bei der du dich noch unterhalten kannst; baut die mitochondriale und aerobe Basis auf.","g.sarco.t":"Sarkopenie","g.sarco.d":"Altersbedingter Verlust von Muskelmasse und -kraft, dem Krafttraining und Protein vorbeugen helfen.","g.microbiome.t":"Mikrobiom","g.microbiome.d":"Die Billionen Mikroben in deinem Darm, die Verdauung, Immunität und Stoffwechsel beeinflussen; ballaststoffreiche, vielfältige Ernährung unterstützt es.","g.vfat.t":"Viszerales Fett","g.vfat.d":"Fett, das um die inneren Organe gespeichert wird; stoffwechselaktiver und enger mit Insulinresistenz verknüpft als Unterhautfett.","g.cgm.t":"CGM","g.cgm.d":"Kontinuierliche Glukosemessung: ein Hautsensor, der die Glukose über den ganzen Tag aufzeichnet. Nützlich bei Diabetes; der Nutzen für Gesunde ist noch umstritten.","my.h":"Mythen vs. Evidenz","my.p":"Biohacking mischt solide Wissenschaft mit Marketing. Tippe zum Vergleichen.","my.m":"Mythos","my.r":"Was die Evidenz sagt","my.detox.m":"Detox-Säfte und -Tees reinigen deinen Körper.","my.detox.r":"Leber, Nieren, Lunge und Darm erledigen das bereits. Für kein Detox-Produkt ist gezeigt, dass es Giftstoffe besser entfernt als die normale Physiologie.","my.supps.m":"Je mehr Supplemente, desto besser.","my.supps.r":"Über den Ausgleich eines Mangels hinaus ist der Nutzen gering oder unbewiesen, und hohe Dosen können schaden oder mit Medikamenten wechselwirken.","my.bioage.m":"Ein Test des biologischen Alters verrät dein genaues wahres Alter.","my.bioage.r":"Verschiedene Uhren liefern unterschiedliche Ergebnisse, und keine ist bisher validiert, um individuelle Behandlungsentscheidungen zu leiten.","my.cold.m":"Kaltbäder verbrennen Fett und verlängern das Leben.","my.cold.r":"Kälte steigert die Wachheit und kann akut die Stimmung heben; für Fettverlust oder längeres Leben beim Menschen fehlt die Evidenz.","my.fasting.m":"Fasten ist für jeden richtig.","my.fasting.r":"Die Ergebnisse variieren, und Fasten kann für manche Gruppen ungeeignet oder unsicher sein. Das beste Essmuster ist eines, das du sicher durchhalten kannst.","my.onediet.m":"Eine Diät ist für alle Menschen optimal.","my.onediet.r":"Individuelle Reaktionen bei Glukose, Appetit und Verträglichkeit unterscheiden sich. Konsequenz und Lebensmittelqualität zählen mehr als das Etikett.","my.sleepcatch.m":"Schlaf lässt sich am Wochenende vollständig nachholen.","my.sleepcatch.r":"Zusätzlicher Schlaf hilft teilweise, aber unregelmäßige Zeiten und wiederholt zu kurzer Schlaf haben weiterhin metabolische Kosten.","my.steps.m":"Nur 10.000 Schritte zählen.","my.steps.r":"Der Nutzen beginnt weit darunter und flacht bei etwa 7.000–10.000 Schritten pro Tag ab; jede Steigerung hilft.","ft.disc":"VITALIS dient der allgemeinen Bildung. Es diagnostiziert und behandelt nicht und ersetzt keine professionelle ärztliche Beratung. Sprich mit einer qualifizierten Fachperson, bevor du Ernährung, Training, Supplemente oder Medikamente änderst.","ft.license":"MIT-Lizenz · © 2026 Alexandru-Ionuț Chiuță (Alexio)","ft.tf":"Trade-free · offline · kein Tracking: Deine Daten bleiben in diesem Browser.","ft.src":"Inspiriert von der Biohacking360-Konferenz (biohacking360.com). Inoffiziell, nicht verbunden.","ft.bmc":"Spendier mir einen Kaffee","ft.export":"Meine Daten exportieren","ft.import":"Daten importieren","ft.reset":"Alle Daten löschen","ft.resetq":"Alle in diesem Browser gespeicherten Daten löschen?","ft.imp.ok":"Daten importiert.", zisztencia","sp.bik.b":"Az elhízás, az inzulinrezisztencia és a mitokondriális diszfunkció kutatója; bioenergetikai PhD, posztdoktori ösztöndíjjal a szingapúri Duke-NUS Orvosi Egyetemen. A Why We Get Sick és a How Not To Get Sick szerzője.","sp.bos.role":"Orvos · ketogén medicina","sp.bos.b":"30+ év tapasztalattal rendelkező orvos a krónikus betegségek, az agyegészség és a függőségből való felépülés területén. Az Any Way You Can szerzője, több mint egymillió eladott könyvvel és 1,2 millió feliratkozós YouTube-közösséggel.","ev.ag.h":"Program","ev.ag.p":"Jelöld be a látogatni kívánt előadásokat, és állítsd össze a napodat.","ev.ag.mine":"{0}/{1} elem a napomban","ag.reg":"Regisztráció · kávé és networking","ag.open":"Megnyitó","ag.s1":"1. előadás — Inzulinrezisztencia és az anyagcsere-egészséged (Dr. Ben Bikman)","ag.s1.d":"Mi az inzulinrezisztencia, hogyan függ össze az elhízással, a mitokondriális diszfunkcióval és a krónikus betegségekkel, és mit jelent az alacsony szénhidráttartalmú étrend kutatása az anyagcserére nézve.","ag.brk":"Kávészünet","ag.back":"Újra együtt","ag.s2":"2. előadás — Ketogén medicina az agyegészségért és a krónikus betegségek ellen (Dr. Annette Bosworth)","ag.s2.d":"Hogyan alkalmazzák a ketogén étrendet a gyógyászatban krónikus állapotokra, mit tesz az étel az aggyal, és tanulságok 30+ év praxisából.","ag.qa":"Kérdések és válaszok Dr. Annette Bosworth-szal","ag.close":"Zárás és networking","ag.vip":"VIP fogadás (First Class jegytulajdonosoknak; a helyszínt SMS-ben küldik)","ev.tk.h":"Jegyek","tk.vat":"+ ÁFA","tk.ga.n":"General Access — Early Bird","tk.ga.d":"Mindkét masterclass, kiállítási terület és termékbemutatók, networking, részvételi tanúsítvány.","tk.fc.n":"First Class","tk.seats":"Csak 10 hely","tk.fc.d":"Tartalmazza a VIP fogadást, első sori ülőhelyet, gyorsított belépést és privát vacsorát az előadókkal. A pontos tartalomért nézd meg a hivatalos oldalt.","ev.ex.h":"Kiállítási terület","ev.ex.p":"Kipróbálási lehetőség, élő bemutatók és workshopok, valamint zónák, amelyek percek alatt megfejtik az egészségedet.","ex.wear.t":"Viselhető eszközök és monitorozás","ex.wear.d":"Okos szenzorok, biometrikus viselhető eszközök és valós idejű egészségkövetés.","ex.nutri.t":"Táplálkozás és étrend-kiegészítők","ex.nutri.d":"Új generációs étrend-kiegészítők és nutraceutikumok, a DNS-hez, mikrobiómhoz és életmódhoz igazítva.","ex.recov.t":"Regenerációs megoldások","ex.recov.d":"Krioterápia, vörösfény, infraszaunák és hiperbárikus oxigénkamrák.","ex.diag.t":"Diagnosztika és longevity-klinikák","ex.diag.d":"DNS- és anyagcsere-tesztek, kognitív teljesítményvizsgálatok, személyre szabott programok.","ev.prep.h":"Felkészülési csomag","prep.q1":"Kérdések Dr. Ben Bikmannek","pb1":"Az inzulinrezisztencia mely korai jeleinek mérését kérjem az orvosomtól?","pb2":"Mennyire változtatja az alvás és a stressz az inzulinérzékenységet az étrendhez képest?","pb3":"Ha nem eszem alacsony szénhidráttartalmúan, mely első lépések hatnak a legjobban?","prep.q2":"Kérdések Dr. Annette Bosworth-nak","pz1":"Milyen biztonsági ellenőrzések kellenek a ketogén étrend megkezdése előtt, különösen gyógyszerszedés mellett?","pz2":"Mit mondanak a jelenlegi bizonyítékok a ketonokról és az agyegészségről, és mi nem ismert még?","pz3":"Mely markerek mutatják, hogy nálam működik-e?","prep.q3":"Kérdések a kiállítóknak","px1":"Milyen humán vizsgálatok támasztják alá ezt a terméket vagy eszközt, és függetlenek voltak-e?","px2":"Milyen mellékhatásai vannak, és kinek nem szabad használnia?","px3":"Hogyan tárolják, osztják meg vagy adják el az egészségügyi adataimat?","px4":"Mi a teljes költség az előfizetésekkel együtt, és milyen a visszatérítési szabályzat?","px5":"Az állítás az egészségi kimenetelemen vagy egy helyettesítő mutatón alapul?","prep.q4":"Csomaglista","pk1":"Jegy a telefonodon","pk2":"Jegyzetfüzet vagy jegyzetapp","pk3":"Friss laboreredmények","pk4":"A szedett gyógyszerek és étrend-kiegészítők listája","pk5":"Feltöltött telefon vagy powerbank","pk6":"Kényelmes cipő és egy kulacs","pil.h":"A kilenc pillér","pil.p":"A bizonyítékok erőssége szerint rendezve. Nyiss meg egy pillért: megtudod az okát, három első lépést és a gyakori buktatókat.","pil.act":"Első lépések","pil.pit":"Vigyázz","pil.ev":"Bizonyíték","evd.strong":"Erős bizonyíték","evd.moderate":"Mérsékelt bizonyíték","evd.emerging":"Kialakulóban lévő bizonyíték","evd.varies":"Terméktől függ","p.sleep.t":"Alvás és cirkadián ritmus","p.sleep.tag":"Az alap, amelyen minden más pillér nyugszik","p.sleep.why":"Az alvás rögzíti az emlékeket, szabályozza az étvágyhormonokat, az inzulinérzékenységet és a hangulatot. A tartósan rövid vagy szabálytalan alvás az elhízás, a cukorbetegség, a szív- és érrendszeri betegségek és a depresszió magasabb kockázatával jár.","p.sleep.a1":"Tartsd a fix ébredési időt hétvégén is, és ébredés után egy órán belül szerezz természetes fényt.","p.sleep.a2":"Lefekvés előtt legalább 8 órával hagyd abba a koffeint, és tartsd a hálószobát sötéten, csendesen és hűvösen (kb. 16–19 °C).","p.sleep.a3":"Az utolsó órában tompítsd a fényt és tedd el a képernyőket; a legtöbb felnőttnek 7–9 óra ágyban töltött idő a cél.","p.sleep.pit":"Az alkohol rövidíti és széttördeli az alvást, a fogyasztói alvásmérők pedig durva becslések: a közérzetedben és a trendben bízz, ne egyetlen éjszakában.","p.metab.t":"Anyagcsere-egészség és inzulin","p.metab.tag":"Táplálkozás, amely egyenletesen tartja a vércukrot és az inzulint","p.metab.why":"Az inzulinrezisztencia, amelyet gyakran a túlzott zsigeri zsír, a mozgáshiány, a rossz alvás és az ultrafeldolgozott élelmiszerek táplálnak, a 2-es típusú cukorbetegség, a zsírmáj és sok szív- és érrendszeri betegség hátterében áll. Sokaknak segít a finomított szénhidrátok és a cukros italok elhagyása; az alacsony szénhidráttartalmú vagy ketogén étrend az egyik hatékony lehetőség, de nem az egyetlen.","p.metab.a1":"Az étkezéseid épüljenek fehérjére, rostban gazdag növényekre és minimálisan feldolgozott ételekre; először a cukros italokat hagyd el.","p.metab.a2":"A legnagyobb étkezések után sétálj 10–15 percet; mérsékli a glükózemelkedést.","p.metab.a3":"Kövesd a derék-magasság arányt, és az orvosoddal együtt az éhgyomri glükózt, a HbA1c-t, a trigliceridet és az éhgyomri inzulint.","p.metab.pit":"Ha cukorbetegségre vagy vérnyomásra szedsz gyógyszert, orvosi felügyelet nélkül soha ne módosíts adagot, és ne kezdj ketogén étrendet vagy böjtöt.","p.move.t":"Mozgás és kondíció","p.move.tag":"Az izomzat és a szív-légzőrendszeri kondíció az élettartam erős előrejelzői","p.move.why":"Az aerob kondíció (VO2max) és az izomerő a halálozás legerősebb módosítható előrejelzői közé tartozik, az izom pedig a glükóz felvételének fő helye is.","p.move.a1":"Gyűjts heti 150–300 perc mérsékelt aktivitást, jelentős részét olyan könnyű tempóban, hogy beszélni tudj (2. zóna).","p.move.a2":"Súlyzózz vagy végezz ellenállásos edzést legalább hetente kétszer, minden nagy izomcsoportot megdolgoztatva.","p.move.a3":"Ha egészséges vagy, adj hozzá heti egy rövid, kemény intervallum-edzést, és sétálj annyi lépést naponta, amennyit kényelmesen bírsz.","p.move.pit":"Fokozatosan növeld a terhelést; a hirtelen nagy ugrások okozzák a legtöbb sérülést. Szívbetegség vagy tünetek esetén előbb fordulj orvoshoz.","p.stress.t":"Stressz és érzelmi rugalmasság","p.stress.tag":"Edzd az idegrendszert a regenerálódásra","p.stress.why":"A tartós stressz felborítja az alvást, az étvágyat, a vérnyomást és az immunműködést. A lassú légzés, a természetben töltött idő és a kognitív-viselkedésterápiás módszerek mérhetően hatnak a szorongásra és a jóllétre.","p.stress.a1":"Gyakorolj lassú légzést kb. percenként 5–6 légvétellel, 5 percig, naponta egyszer-kétszer.","p.stress.a2":"Tervezz be valódi pihenést: napi séta a szabadban, hobbi vagy képernyőmentes idő.","p.stress.a3":"Nevezd meg a fő stresszforrásaidat, és változtass meg egyet; tartós szorongásnál használj terápiát vagy CBT-alapú programot.","p.stress.pit":"Egy légzésapp nem old meg egy túlterhelt életet vagy a klinikai szorongást és depressziót: tartós vagy a mindennapokat zavaró tüneteknél kérj szakmai segítséget.","p.brain.t":"Agyoptimalizálás","p.brain.tag":"Védd az emlékezetet, a fókuszt és a kreativitást évtizedekig","p.brain.why":"Nagy összefoglalók a demenciaesetek nagyjából 45%-át módosítható kockázati tényezőknek tulajdonítják: magas vérnyomás, halláskárosodás, mozgáshiány, dohányzás, cukorbetegség, elszigeteltség és más. A mozgás, az alvás, a tanulás és a társas kapcsolatok mind segítenek.","p.brain.a1":"Szabályozd a vérnyomásod, korrigáld a hallás- és látásproblémákat, és kerüld a dohányzást.","p.brain.a2":"Csinálj nehéz és új dolgokat: nyelvet, hangszert, visszajelzéssel tanulható készséget.","p.brain.a3":"Védd a mély munkát: 60–90 perces egyfeladatos blokkok kikapcsolt értesítésekkel.","p.brain.pit":"A ketonokról és az agyegészségről szóló kutatások ígéretesek, de még kialakulóban vannak; a nootróp kiegészítők ritkán múlják felül az alvást, a mozgást és a tanulást.","p.hormesis.t":"Hormézis: hő, hideg, fény és böjt","p.hormesis.tag":"Kis, kontrollált stressz, ami rugalmasságot építhet","p.hormesis.why":"A szaunázást megfigyeléses vizsgálatok az alacsonyabb szív- és érrendszeri halálozással hozták összefüggésbe; a hidegexpozíció akutan növeli az éberséget; az időkorlátozott étkezés egyeseknek segíthet. A hosszú távú előnyökre vonatkozó adatok többnyire megfigyeléses vagy kis vizsgálatokból származnak.","p.hormesis.a1":"Próbálj rendszeres, 10–20 perces szaunázást, fokozatosan építve, és maradj hidratált.","p.hormesis.a2":"Ha szereted a hideg zuhanyt vagy a hideg merülést, kezdd röviden, és erősítő edzés után közvetlenül kerüld, ha az izomnövekedés a célod.","p.hormesis.a3":"A 12–14 órás éjszakai étkezési szünet könnyű, kis kockázatú kiindulópont.","p.hormesis.pit":"A hő, a hideg és a böjt nem mindenkinek biztonságos: szívbetegség, terhesség, evészavar, cukorbetegség-kezelés és alkoholfogyasztás esetén kérj orvosi tanácsot.","p.connect.t":"Kapcsolódás és értelem","p.connect.tag":"A hosszú élet leginkább alulértékelt tényezője","p.connect.why":"A magány és a társas elszigeteltség más nagy életmódtényezőkkel összemérhető halálozási kockázattal jár, míg az erős kapcsolatok és a céltudat jobb egészséggel és hosszabb élettel függnek össze.","p.connect.a1":"Tervezz be rendszeres találkozást azokkal, akiket szeretsz, és védd úgy, mint egy orvosi időpontot.","p.connect.a2":"Csatlakozz egy olyan csoporthoz, amely valami számodra élvezetes köré épül: sport, önkéntesség, kézművesség, közösség.","p.connect.a3":"Írd le, mi ad értelmet a napjaidnak, és igazíts hozzá egy heti tevékenységet.","p.connect.pit":"A közösségi média nem helyettesíti a személyes találkozást; a kapcsolatok minősége fontosabb, mint a mennyisége.","p.measure.t":"Mérés és diagnosztika","p.measure.tag":"Ismerd a számaidat, a trendekre reagálj","p.measure.why":"A vérnyomás, a glükóz, a lipidek, a gyulladás és a tápanyagellátottság évekkel a tünetek előtt jelzi a problémákat. A viselhető eszközök trendeket adnak a nyugalmi pulzusról, a HRV-ről és az alvásról. A közvetlenül fogyasztóknak szánt DNS- és biológiaikor-tesztek klinikai értéke ma korlátozott.","p.measure.a1":"Rendszeresen mérd a vérnyomásod, és kérj éhgyomri glükózt, HbA1c-t, lipideket ApoB-vel, hs-CRP-t és D-vitamint.","p.measure.a2":"A viselhető eszközöket heteken átívelő trendekhez használd, ne egyetlen nap megítélésére.","p.measure.a3":"Egy változtatás után 8–12 héttel mérj újra, hogy lásd, bevált-e.","p.measure.pit":"Több vizsgálat nem mindig jobb: a világos teendő nélküli kóros eredmények szorongást és felesleges beavatkozásokat okozhatnak. Az eredményeket orvossal értelmezd.","p.supp.t":"Okos étrend-kiegészítés","p.supp.tag":"Pótold a hiányokat, ne csodákat hajszolj","p.supp.why":"Néhány kiegészítőnek jó humán bizonyítéka van, ha a megfelelő okból szedik; sok forgalmazott hosszú életet ígérő vegyületnek nincs. Az étel, az alvás és a mozgás az első.","p.supp.a1":"Szedés előtt vizsgáltass: a D-vitamin, a ferritin és a B12 gyakori hiányok.","p.supp.a2":"A kreatin-monohidrát (napi 3–5 g) erős bizonyítékkal bír az izom és az erő terén; az omega-3 segíthet, ha kevés zsíros halat eszel.","p.supp.a3":"Válassz harmadik fél által tesztelt termékeket, és egyszerre csak egy változtatást vezess be.","p.supp.pit":"A megadózisok, a sok termék halmozása és a szabályozatlan keverékek kockázatot és gyógyszer-kölcsönhatásokat hordoznak. A NAD+-növelők és a resveratrol humán bizonyítékai még nem elegendők.","tools.h":"Kalkulátorok és időzítők","tools.p":"Minden helyben fut a böngésződben; semmi nem kerül elküldésre sehová.","disc.short":"Oktatási eszközök, nem orvosi tanács vagy diagnózis.","t.met.h":"Inzulinrezisztencia és anyagcsere-markerek","t.met.p":"Töltsd ki, amid van: a glükózból és az inzulinból HOMA-IR, a trigliceridből és a glükózból TyG-index, a derékból és a magasságból derék-magasság arány adódik.","t.met.note":"A határértékek laboronként, módszerenként és populációnként eltérnek; az eredményt tekintsd beszélgetésindítónak az orvosoddal.","f.glu":"Éhgyomri glükóz","f.ins":"Éhgyomri inzulin","f.tg":"Triglicerid","f.waist":"Derékbőség","f.height":"Magasság","o.homa":"HOMA-IR","o.tyg":"TyG-index","o.whtr":"Derék-magasság arány","o.need":"Töltsd ki a mezőket az eredményekért.","st.ok":"Célértéken belül","st.watch":"Érdemes figyelni","st.flag":"Beszéld meg orvossal","t.en.h":"Energia- és fehérjeszükséglet","t.en.p":"Mifflin-St Jeor-becslés a nyugalmi és napi energiaigényre, plusz fehérjecélok.","f.sex":"Nem","sex.m":"Férfi","sex.f":"Nő","f.age":"Életkor","f.weight":"Testtömeg","f.act":"Aktivitási szint","act.1":"Ülő (irodai munka, kevés mozgás)","act.2":"Enyhe (heti 1–3 edzés)","act.3":"Mérsékelt (heti 3–5 edzés)","act.4":"Magas (heti 6–7 edzés)","act.5":"Nagyon magas (fizikai munka és edzés)","o.bmr":"Nyugalmi energiaigény (BMR)","o.tdee":"Napi energiaigény (TDEE)","o.prot1":"Fehérje, átlagos felnőtt","o.prot2":"Fehérje, erősítő edzéssel","t.hr.h":"Pulzuszónák","t.hr.p":"Becsült maximális pulzus (Tanaka: 208 − 0,7 × életkor) és öt edzészóna. Az egyéni értékek eltérhetnek.","hz.1":"1. zóna — regeneráció","hz.2":"2. zóna — könnyű, beszélgetős","hz.3":"3. zóna — tempó","hz.4":"4. zóna — küszöb","hz.5":"5. zóna — maximális","o.hrmax":"Becsült maximális pulzus","t.sl.h":"Alvásciklus-tervező","t.sl.p":"Az alvás nagyjából 90 perces ciklusokban zajlik. Az időpontok kb. 15 perc elalvási időt tartalmaznak.","f.wake":"Ekkor kell felkelnem","f.bed":"Ha ekkor fekszem le","o.bedat":"Feküdj le ekkor","o.wakeat":"Kelj fel ekkor","o.cycles":"{0} ciklus · {1} óra alvás","o.caf":"Utolsó koffein kb. {0}","t.fa.h":"Böjtidőzítő","t.fa.p":"Kövesd az éjszakai vagy hosszabb étkezési szünetedet. A szakaszleírások hozzávetőlegesek, és emberenként eltérnek.","fa.start":"Böjt indítása","fa.stop":"Böjt vége","fa.goal":"Cél","fa.elapsed":"Eltelt idő","fs.0":"Táplált állapot: az étkezés után a vércukor és az inzulin magas.","fs.1":"Posztabszorptív: az inzulin csökken, a szervezet több tárolt tüzelőanyagot használ.","fs.2":"A zsírégetés nő, és sokaknál megindul a ketontermelés növekedése.","fs.3":"Mélyebb éhező állapot; a válaszok egyénenként nagyon eltérnek.","fs.4":"Hosszan tartó böjt: csak orvosi felügyelettel.","fa.warn":"Nem javasolt terhesség alatt, 18 év alatt, evészavar a kórtörténetben, alulsúly esetén, vagy ha cukorbetegség elleni gyógyszert szedsz, kivéve ha az orvosod egyetért.","t.br.h":"Légzésritmus-vezető","t.br.p":"Kövesd a kört. A lassú kilégzés aktiválja a paraszimpatikus rendszert, és percek alatt csökkentheti az észlelt stresszt.","br.coh":"Koherens 5,5 / 5,5","br.box":"Négyzet 4-4-4-4","br.478":"4-7-8","br.46":"Nyugtató 4 / 6","br.start":"Indítás","br.stop":"Leállítás","br.in":"Belégzés","br.hold":"Tartás","br.out":"Kilégzés","br.cycles":"{0} ciklus","sc.h":"Score 360","sc.p":"Tizennyolc állítás, pillérenként kettő. Az elmúlt hónapra vonatkozóan válaszolj, őszintén. Az eredmények ezen az eszközön maradnak.","sc.s.0":"Szinte soha","sc.s.1":"Néha","sc.s.2":"Gyakran","sc.s.3":"Szinte mindig","q.sleep.1":"Nagyjából minden nap ugyanabban az időben ébredek, és korán érem a nappali fényt.","q.sleep.2":"7–9 órát alszom, és meglehetősen kipihenten ébredek.","q.metab.1":"Az étkezéseim főként fehérjére, zöldségre és minimálisan feldolgozott ételre épülnek.","q.metab.2":"Ritkán iszom cukros italokat, és ritkán eszem édességet vagy nasit étkezések között.","q.move.1":"Hetente legalább 150 percet mozgok mérsékelt intenzitással.","q.move.2":"Hetente legalább kétszer erősítő edzést végzek.","q.stress.1":"Van napi nyugtató gyakorlatom, például légzés, séta vagy meditáció.","q.stress.2":"A stresszes napok után jól regenerálódom, és ritkán érzem magam túlterheltnek.","q.brain.1":"Rendszeresen tanulok valami újat, vagy végzek megterhelő szellemi munkát.","q.brain.2":"60 percig tudok fókuszálni anélkül, hogy folyton a telefonomat nézném.","q.hormesis.1":"Biztonságosan és rendszeresen alkalmazok hőt, hideget, böjtablakokat vagy hasonló gyakorlatokat.","q.hormesis.2":"Az utolsó és a másnapi első étkezésem között legalább 12 óra szünet van.","q.connect.1":"Minden héten értelmes időt töltök azokkal, akiket szeretek.","q.connect.2":"Úgy érzem, a napjaimnak célja és iránya van.","q.measure.1":"Ismerem a legutóbbi vérnyomás-, glükóz- és koleszterinértékeimet.","q.measure.2":"Felkeresem az orvosomat és vizsgálatra megyek, amikor esedékes, nem csak betegen.","q.supp.1":"Kiegészítőt csak okkal szedek, lehetőleg vizsgálat után.","q.supp.2":"Tudom, mit szedek, milyen adagban, és hogy kölcsönhat-e a gyógyszereimmel.","sc.prog":"{0}/{1} megválaszolva","sc.go":"Mutasd a Score 360-amat","sc.res.h":"Az eredményed","sc.overall":"Összesen","sc.hi":"Erős alap. Tartsd meg, ami működik, és finomhangold a leggyengébb pilléredet.","sc.mid":"Szilárd alap, egyértelmű fejlődési lehetőséggel. Válaszd a legalacsonyabb pillért, és változtass valamit ezen a héten.","sc.lo":"Kezdd az alapokkal: alvás, mozgás és ételminőség. A kis, ismételt lépések győznek.","sc.weak":"Kezdd ezzel","sc.open":"Pillér megnyitása","sc.retake":"Teszt újrakezdése","sc.hist":"Korábbi eredmények","sc.note":"Életmód-önértékelés, nem a biológiai kor vagy a betegségkockázat mérése.","lb.h":"Biomarker-panel","lb.p":"Írd be a laborleleted értékeit. A VITALIS összeveti őket a felnőtteknél általánosan használt referenciahatárokkal. Mértékegység: mg/dL, ha nincs másképp jelölve.","lb.sex":"Nem (egyes határértékek eltérnek)","lb.sum":"{0} tartományban · {1} figyelendő · {2} megbeszélendő","lb.rng":"Referencia","lb.copy":"Összegzés másolása","lb.copied":"Másolva","lb.note":"A referenciatartományok laboronként és irányelvenként eltérnek. A tartományon kívüli érték nem diagnózis, a tartományon belüli érték pedig nem garancia. Az eredményeket orvossal beszéld meg.","l.glu":"Éhgyomri glükóz","l.a1c":"HbA1c","l.tg":"Triglicerid","l.hdl":"HDL-koleszterin","l.ldl":"LDL-koleszterin","l.apob":"ApoB","l.sys":"Szisztolés vérnyomás","l.dia":"Diasztolés vérnyomás","l.crp":"hs-CRP","l.vitd":"D-vitamin (25-OH)","l.ferr":"Ferritin","l.tsh":"TSH","l.alt":"ALT","l.rhr":"Nyugalmi pulzus","ri.h":"Napi rituálé","ri.p":"Tizenkét apró szokás. Koppints egy négyzetre a nap jelöléséhez. A következetességre törekedj, ne a tökéletességre.","ri.today":"Ma: {0}/{1}","ri.streak":"Sorozat: {0} nap a szokások legalább felével","ri.week":"7 napos átlag: {0}%","ri.add":"Hozzáadás","ri.ph":"Add hozzá a saját szokásod…","ri.del":"Eltávolítás","h.wake":"Fix ébredési idő","h.light":"Fény a szabadban ébredés után egy órán belül","h.steps":"7000+ lépés","h.train":"Erő- vagy kardióedzés (edzésnapokon)","h.protein":"Fehérje minden főétkezésnél","h.fiber":"Zöldség vagy rost két étkezésnél","h.nosugar":"Nincs cukros ital","h.caf":"Nincs koffein lefekvés előtt 8 órával","h.screens":"Képernyők kikapcsolva lefekvés előtt 60 perccel","h.breath":"5 perc lassú légzés","h.social":"Értelmes idő valakivel","h.learn":"20 perc tanulás vagy olvasás","gl.h":"Szójegyzék","gl.p":"Közérthető meghatározások a biohacking-rendezvényeken hallott fogalmakhoz.","gl.search":"Fogalom keresése…","gl.none":"Nincs találat.","g.ir.t":"Inzulinrezisztencia","g.ir.d":"A sejtek gyengén reagálnak az inzulinra, ezért a szervezetnek több kell belőle, hogy a glükózt kivigye a vérből. A 2-es típusú cukorbetegség korai lépcsőfoka.","g.homa.t":"HOMA-IR","g.homa.d":"Az inzulinrezisztencia becslése az éhgyomri glükózból és inzulinból: glükóz (mg/dL) × inzulin (µIU/mL) ÷ 405.","g.a1c.t":"HbA1c","g.a1c.d":"A cukrot szállító hemoglobin aránya; nagyjából három hónap átlagos vércukorszintjét tükrözi.","g.ketones.t":"Ketonok","g.ketones.d":"A máj által zsírból termelt molekulák nagyon alacsony szénhidrátbevitelnél vagy hosszan tartó böjtnél; az agy és az izmok alternatív üzemanyaga.","g.autophagy.t":"Autofágia","g.autophagy.d":"A sejt újrahasznosító folyamata, amely eltávolítja a sérült összetevőket. A böjt és a mozgás befolyásolja; az előnyeire vonatkozó humán bizonyítékok még alakulnak.","g.mtor.t":"mTOR","g.mtor.d":"Tápanyagok, főként aminosavak által aktivált növekedési jelátviteli útvonal; nélkülözhetetlen a szövetépítéshez, és az öregedés kutatásában vizsgálják.","g.ampk.t":"AMPK","g.ampk.d":"Energiaérzékelő, amelyet a mozgás és az alacsony energiaellátottság kapcsol be, elősegítve a zsír felhasználását és a mitokondriumok egészségét.","g.nad.t":"NAD+","g.nad.d":"Az energia-anyagcsere központi koenzimje, szintje az életkorral csökken. Az emelésére szolgáló kiegészítők még nem mutattak egyértelmű klinikai előnyt embereknél.","g.mito.t":"Mitokondriumok","g.mito.d":"A sejt erőművei. Számuk és minőségük reagál a mozgásra, és összefügg az anyagcsere-egészséggel.","g.hormesis.t":"Hormézis","g.hormesis.d":"Jótékony alkalmazkodási válasz egy stresszor alacsony dózisára, például mozgásra, hőre vagy hidegre; magas dózisban káros.","g.vo2.t":"VO2max","g.vo2.d":"Az a maximális sebesség, amellyel a szervezeted az oxigént hasznosítani tudja edzés közben; a szív-légzőrendszeri kondíció és a hosszú élet erős markere.","g.hrv.t":"HRV","g.hrv.d":"Szívfrekvencia-variabilitás: a szívverések közti idő változása. A regeneráció és a stressz hozzávetőleges mutatója; a saját alapvonaladhoz hasonlítsd.","g.healthspan.t":"Egészséges évek","g.healthspan.d":"A jó egészségben leélt évek száma, szemben az élettartammal, vagyis az összes leélt évvel.","g.senescence.t":"Sejtszeneszcencia","g.senescence.d":"Olyan sejtek, amelyek abbahagyják az osztódást, de aktívak maradnak és gyulladásos jeleket bocsátanak ki; az életkorral felhalmozódnak.","g.circadian.t":"Cirkadián ritmus","g.circadian.d":"A nagyjából 24 órás belső óra, amely az alvást, a hormonokat és az anyagcserét irányítja, főként a fény állítja be.","g.glyvar.t":"Glikémiás variabilitás","g.glyvar.d":"Mennyire ingadozik a vércukor a nap folyamán. A nagy kilengések az átlagon túl is számíthatnak.","g.apob.t":"ApoB","g.apob.d":"Minden aterogén lipoproteinrészecskén jelen lévő fehérje; koncentrációja közelíti az érfalba bejutni képes részecskék számát.","g.crp.t":"hs-CRP","g.crp.d":"Az alacsony fokú gyulladás vérmarkere, összefügg a szív- és érrendszeri kockázattal. Fertőzéskor megugrik.","g.epiclock.t":"Epigenetikai óra","g.epiclock.d":"A biológiai kor statisztikai becslése a DNS-metilációs mintázatokból. A kutatásban érdekes, klinikai használata ma korlátozott.","g.zone2.t":"2. zóna","g.zone2.d":"Könnyű aerob megterhelés, amelynél még tudsz beszélgetni; mitokondriális és aerob alapot épít.","g.sarco.t":"Szarkopénia","g.sarco.d":"Az izomtömeg és izomerő életkorral járó csökkenése, amelynek megelőzésében az ellenállásos edzés és a fehérje segít.","g.microbiome.t":"Mikrobióm","g.microbiome.d":"A bélrendszeredben élő billiónyi mikroba, amely befolyásolja az emésztést, az immunitást és az anyagcserét; a rostban gazdag, változatos étrend támogatja.","g.vfat.t":"Zsigeri zsír","g.vfat.d":"A belső szervek körül tárolt zsír; anyagcsere szempontjából aktívabb, és a bőr alatti zsírnál szorosabban kapcsolódik az in
