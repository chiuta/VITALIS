frecvente.","pil.act":"Primele mișcări","pil.pit":"Atenție","pil.ev":"Dovezi","evd.strong":"Dovezi solide","evd.moderate":"Dovezi moderate","evd.emerging":"Dovezi în curs de apariție","evd.varies":"Variază în funcție de produs","p.sleep.t":"Somn și ritm circadian","p.sleep.tag":"Fundația pe care se sprijină toți ceilalți piloni","p.sleep.why":"Somnul consolidează memoria și reglează hormonii apetitului, sensibilitatea la insulină și starea de spirit. Somnul scurt sau neregulat, cronic, este asociat cu un risc mai mare de obezitate, diabet, boli cardiovasculare și depresie.","p.sleep.a1":"Păstrează o oră fixă de trezire, inclusiv în weekend, și ia lumină de afară în prima oră după trezire.","p.sleep.a2":"Oprește cofeina cu cel puțin 8 ore înainte de culcare și ține dormitorul întunecat, liniștit și răcoros (aproximativ 16–19 °C).","p.sleep.a3":"Reduce luminile și lasă ecranele deoparte în ultima oră; vizează 7–9 ore în pat pentru majoritatea adulților.","p.sleep.pit":"Alcoolul scurtează și fragmentează somnul, iar dispozitivele de monitorizare a somnului pentru public sunt estimări aproximative: ai încredere în cum te simți și în tendință, nu într-o singură noapte.","p.metab.t":"Sănătate metabolică și insulină","p.metab.tag":"O alimentație care menține stabile glicemia și insulina","p.metab.why":"Rezistența la insulină, adesea favorizată de excesul de grăsime viscerală, sedentarism, somn slab și alimente ultraprocesate, stă la originea diabetului de tip 2, a ficatului gras și a multor boli cardiovasculare. Mulți oameni se îmbunătățesc reducând carbohidrații rafinați și băuturile zaharoase; alimentația low-carb sau ketogenică este o opțiune eficientă, nu singura.","p.metab.a1":"Construiește mesele în jurul proteinelor, al plantelor bogate în fibre și al alimentelor minim procesate; elimină mai întâi băuturile zaharoase.","p.metab.a2":"Plimbă-te 10–15 minute după mesele principale; atenuează creșterea glicemiei.","p.metab.a3":"Urmărește raportul talie/înălțime și, împreună cu medicul, glicemia à jeun, HbA1c, trigliceridele și insulina à jeun.","p.metab.pit":"Dacă iei medicamente pentru diabet sau tensiune, nu modifica niciodată dozele și nu începe o dietă ketogenică sau un post fără supraveghere medicală.","p.move.t":"Mișcare și condiție fizică","p.move.tag":"Masa musculară și condiția cardiorespiratorie sunt predictori puternici ai longevității","p.move.why":"Condiția aerobă (VO2max) și forța musculară se numără printre cei mai puternici predictori modificabili ai mortalității, iar mușchiul este și un loc important de utilizare a glucozei.","p.move.a1":"Acumulează 150–300 de minute pe săptămână de activitate moderată, o mare parte suficient de ușoară încât să poți vorbi (zona 2).","p.move.a2":"Fă antrenament cu greutăți sau de rezistență de cel puțin două ori pe săptămână, lucrând toate grupele musculare mari.","p.move.a3":"Adaugă o scurtă sesiune de intervale intense pe săptămână dacă nu ai probleme de sănătate și fă cât mai mulți pași zilnic, în limita confortului.","p.move.pit":"Crește treptat; salturile mari și bruște de efort provoacă majoritatea accidentărilor. Consultă mai întâi un medic dacă ai boli de inimă sau simptome.","p.stress.t":"Stres și reziliență emoțională","p.stress.tag":"Antrenează sistemul nervos să se recupereze","p.stress.why":"Stresul cronic perturbă somnul, apetitul, tensiunea arterială și funcția imunitară. Abilități precum respirația lentă, timpul petrecut în natură și metodele cognitiv-comportamentale au efecte măsurabile asupra anxietății și stării de bine.","p.stress.a1":"Exersează respirația lentă, la aproximativ 5–6 respirații pe minut, timp de 5 minute, o dată sau de două ori pe zi.","p.stress.a2":"Programează recuperarea reală: o plimbare zilnică în aer liber, un hobby sau timp fără ecrane.","p.stress.a3":"Numește-ți principalii stresori și schimbă unul dintre ei; apelează la terapie sau programe bazate pe CBT când anxietatea persistă.","p.stress.pit":"O aplicație de respirație nu repară o viață suprasolicitată și nici anxietatea sau depresia clinică: cere ajutor specializat când simptomele durează sau îți afectează viața de zi cu zi.","p.brain.t":"Optimizarea creierului","p.brain.tag":"Protejează memoria, concentrarea și creativitatea pentru decenii","p.brain.why":"Sinteze ample ale literaturii atribuie circa 45% din cazurile de demență unor factori de risc modificabili: hipertensiune, pierderea auzului, sedentarism, fumat, diabet, izolare și altele. Exercițiul, somnul, învățarea și contactul social ajută.","p.brain.a1":"Controlează tensiunea arterială, corectează problemele de auz și vedere și evită fumatul.","p.brain.a2":"Fă lucruri grele și noi: o limbă străină, un instrument, o abilitate cu feedback.","p.brain.a3":"Protejează munca profundă: blocuri de 60–90 de minute dedicate unei singure sarcini, cu notificările oprite.","p.brain.pit":"Cercetarea despre cetone și sănătatea creierului este promițătoare, dar încă la început; suplimentele nootrope rareori aduc mai mult decât somnul, exercițiul și învățarea.","p.hormesis.t":"Hormeză: căldură, frig, lumină și post","p.hormesis.tag":"Un stres mic, controlat, care poate construi reziliență","p.hormesis.why":"Băile de saună au fost asociate cu o mortalitate cardiovasculară mai mică în studii observaționale; expunerea la frig crește acut starea de alertă; alimentația în interval de timp restrâns poate ajuta unele persoane. Majoritatea datelor privind beneficiile pe termen lung sunt observaționale sau provin din studii mici.","p.hormesis.a1":"Încearcă sesiuni regulate de saună de 10–20 de minute, crescând treptat și rămânând hidratat.","p.hormesis.a2":"Dacă îți plac dușurile reci sau scufundările în apă rece, începe scurt și evită-le imediat după antrenamentul de forță dacă ții la creșterea musculară.","p.hormesis.a3":"O pauză alimentară nocturnă de 12–14 ore este un punct de pornire simplu și cu risc scăzut.","p.hormesis.pit":"Căldura, frigul și postul nu sunt sigure pentru toată lumea: bolile de inimă, sarcina, tulburările alimentare, tratamentul diabetului și consumul de alcool impun sfat medical.","p.connect.t":"Conexiune și scop","p.connect.tag":"Cel mai subestimat factor de longevitate","p.connect.why":"Singurătatea și izolarea socială sunt asociate cu un risc de mortalitate comparabil cu al altor factori majori ai stilului de viață, în timp ce relațiile solide și sentimentul scopului sunt asociate cu o sănătate mai bună și o viață mai lungă.","p.connect.a1":"Programează contact regulat cu oamenii la care ții și protejează-l ca pe o programare medicală.","p.connect.a2":"Alătură-te unui grup construit în jurul unui lucru care îți place: sport, voluntariat, un meșteșug, o comunitate.","p.connect.a3":"Notează ce dă sens zilelor tale și aliniază o acțiune săptămânală cu acel sens.","p.connect.pit":"Rețelele sociale nu înlocuiesc contactul față în față; calitatea relațiilor contează mai mult decât cantitatea.","p.measure.t":"Măsurare și diagnostic","p.measure.tag":"Cunoaște-ți valorile, acționează după tendințe","p.measure.why":"Tensiunea arterială, glucoza, lipidele, inflamația și statusul nutrienților dezvăluie probleme cu ani înainte de simptome. Dispozitivele purtabile adaugă tendințe ale pulsului de repaus, HRV și somnului. Testele ADN și de vârstă biologică vândute direct consumatorului au astăzi o valoare clinică limitată.","p.measure.a1":"Verifică regulat tensiunea arterială și cere glicemie à jeun, HbA1c, lipide cu ApoB, hs-CRP și vitamina D.","p.measure.a2":"Folosește dispozitivele purtabile pentru tendințe pe săptămâni, nu pentru verdicte de o zi.","p.measure.a3":"Repetă testele după 8–12 săptămâni de la o schimbare, ca să vezi dacă a funcționat.","p.measure.pit":"Mai multe teste nu înseamnă întotdeauna mai bine: rezultatele anormale fără o acțiune clară pot provoca anxietate și proceduri inutile. Interpretează rezultatele împreună cu un medic.","p.supp.t":"Suplimentare inteligentă","p.supp.tag":"Acoperă lacunele, nu alerga după minuni","p.supp.why":"Câteva suplimente au dovezi bune la oameni când sunt folosite din motivul potrivit; multe dintre compușii de longevitate promovați nu au. Alimentația, somnul și exercițiul vin pe primul loc.","p.supp.a1":"Testează înainte să suplimentezi: vitamina D, feritina și B12 sunt deficiențe frecvente.","p.supp.a2":"Creatina monohidrat (3–5 g pe zi) are dovezi solide pentru mușchi și forță; omega-3 poate ajuta când consumul de pește gras este scăzut.","p.supp.a3":"Alege produse testate de terți și introdu câte o singură schimbare pe rând.","p.supp.pit":"Megadozele, combinarea multor produse și amestecurile nereglementate implică riscuri și interacțiuni cu medicamentele. Dovezile pentru stimulatorii de NAD+ și resveratrol la oameni sunt încă insuficiente.","tools.h":"Calculatoare și cronometre","tools.p":"Totul rulează local, în browserul tău; nimic nu este trimis nicăieri.","disc.short":"Instrumente educaționale, nu sfat medical sau diagnostic.","t.met.h":"Rezistența la insulină și markeri metabolici","t.met.p":"Completează ce ai: glucoza și insulina dau HOMA-IR; trigliceridele și glucoza dau indicele TyG; talia și înălțimea dau raportul talie/înălțime.","t.met.note":"Pragurile variază în funcție de laborator, metodă și populație; consideră rezultatele un punct de plecare pentru discuția cu medicul.","f.glu":"Glicemie à jeun","f.ins":"Insulină à jeun","f.tg":"Trigliceride","f.waist":"Talie","f.height":"Înălțime","o.homa":"HOMA-IR","o.tyg":"Indice TyG","o.whtr":"Raport talie/înălțime","o.need":"Completează câmpurile pentru a vedea rezultatele.","st.ok":"În intervalul țintă","st.watch":"Merită urmărit","st.flag":"Discută cu medicul","t.en.h":"Necesar de energie și proteine","t.en.p":"Estimare Mifflin-St Jeor a energiei de repaus și zilnice, plus ținte de proteine.","f.sex":"Sex","sex.m":"Masculin","sex.f":"Feminin","f.age":"Vârstă","f.weight":"Greutate","f.act":"Nivel de activitate","act.1":"Sedentar (muncă de birou, puțin sport)","act.2":"Ușor (1–3 antrenamente pe săptămână)","act.3":"Moderat (3–5 antrenamente pe săptămână)","act.4":"Ridicat (6–7 antrenamente pe săptămână)","act.5":"Foarte ridicat (muncă fizică și antrenament)","o.bmr":"Energie de repaus (BMR)","o.tdee":"Energie zilnică (TDEE)","o.prot1":"Proteine, adulți în general","o.prot2":"Proteine, cu antrenament de forță","t.hr.h":"Zone de puls","t.hr.p":"Puls maxim estimat (Tanaka: 208 − 0,7 × vârsta) și cinci zone de antrenament. Valorile individuale variază.","hz.1":"Zona 1 — recuperare","hz.2":"Zona 2 — ușor, poți vorbi","hz.3":"Zona 3 — tempo","hz.4":"Zona 4 — prag","hz.5":"Zona 5 — maximal","o.hrmax":"Puls maxim estimat","t.sl.h":"Planificator de cicluri de somn","t.sl.p":"Somnul vine în cicluri de aproximativ 90 de minute. Orele includ circa 15 minute pentru adormire.","f.wake":"Trebuie să mă trezesc la","f.bed":"Dacă mă culc la","o.bedat":"Culcă-te la","o.wakeat":"Trezește-te la","o.cycles":"{0} cicluri · {1} h de somn","o.caf":"Ultima cofeină în jurul orei {0}","t.fa.h":"Cronometru de post","t.fa.p":"Urmărește pauza alimentară nocturnă sau mai lungă. Descrierile etapelor sunt aproximative și diferă de la o persoană la alta.","fa.start":"Începe postul","fa.stop":"Încheie postul","fa.goal":"Obiectiv","fa.elapsed":"Scurs","fs.0":"Stare postprandială: glicemia și insulina sunt crescute după masă.","fs.1":"Stare postabsorbtivă: insulina scade și organismul folosește mai mult combustibilul de rezervă.","fs.2":"Arderea grăsimilor crește, iar producția de cetone începe să crească la mulți oameni.","fs.3":"Stare de post mai profundă; răspunsurile variază mult de la o persoană la alta.","fs.4":"Post prelungit: doar sub supraveghere medicală.","fa.warn":"Nu în sarcină, sub 18 ani, cu istoric de tulburări alimentare, în subponderalitate sau dacă iei medicamente pentru diabet, decât cu acordul medicului.","t.br.h":"Ghid de respirație","t.br.p":"Urmărește cercul. Expirațiile lente activează sistemul parasimpatic și pot reduce stresul perceput în câteva minute.","br.coh":"Coerent 5,5 / 5,5","br.box":"Pătrat 4-4-4-4","br.478":"4-7-8","br.46":"Calm 4 / 6","br.start":"Start","br.stop":"Stop","br.in":"Inspiră","br.hold":"Ține","br.out":"Expiră","br.cycles":"{0} cicluri","sc.h":"Scor 360","sc.p":"Optsprezece afirmații, câte două pentru fiecare pilon. Răspunde pentru ultima lună, sincer. Rezultatele rămân pe acest dispozitiv.","sc.s.0":"Aproape niciodată","sc.s.1":"Uneori","sc.s.2":"Adesea","sc.s.3":"Aproape mereu","q.sleep.1":"Mă trezesc cam la aceeași oră în fiecare zi și iau lumină naturală devreme.","q.sleep.2":"Dorm 7–9 ore și mă trezesc destul de odihnit.","q.metab.1":"Mesele mele se bazează în principal pe proteine, legume și alimente minim procesate.","q.metab.2":"Rareori beau băuturi zaharoase sau mănânc dulciuri și gustări între mese.","q.move.1":"Fac mișcare moderată timp de 150 de minute sau mai mult pe săptămână.","q.move.2":"Fac antrenament de forță de cel puțin două ori pe săptămână.","q.stress.1":"Am o practică zilnică care mă liniștește, precum respirația, plimbarea sau meditația.","q.stress.2":"Mă recuperez bine după zilele stresante și rareori mă simt copleșit.","q.brain.1":"Învăț regulat ceva nou sau fac muncă mentală solicitantă.","q.brain.2":"Mă pot concentra 60 de minute fără să-mi verific mereu telefonul.","q.hormesis.1":"Folosesc căldura, frigul, ferestre de post sau practici similare în siguranță și regulat.","q.hormesis.2":"Las o pauză de cel puțin 12 ore între ultima masă și prima din ziua următoare.","q.connect.1":"Petrec în fiecare săptămână timp semnificativ cu oamenii la care țin.","q.connect.2":"Simt că zilele mele au scop și direcție.","q.measure.1":"Îmi cunosc valorile recente ale tensiunii arteriale, glicemiei și colesterolului.","q.measure.2":"Merg la medic și îmi fac analizele la timp, nu doar când sunt bolnav.","q.supp.1":"Iau suplimente doar dintr-un motiv, ideal după testare.","q.supp.2":"Știu ce iau, în ce doză și dacă interacționează cu medicamentele mele.","sc.prog":"{0}/{1} răspunsuri","sc.go":"Vezi Scorul meu 360","sc.res.h":"Rezultatul tău","sc.overall":"General","sc.hi":"Fundație solidă. Păstrează ce funcționează și rafinează-ți cel mai slab pilon.","sc.mid":"Bază solidă, cu loc clar de creștere. Alege cel mai slab pilon și fă o schimbare săptămâna aceasta.","sc.lo":"Începe cu bazele: somn, mișcare și calitatea alimentelor. Pașii mici, repetați, câștigă.","sc.weak":"Începe cu","sc.open":"Deschide pilonul","sc.retake":"Refă testul","sc.hist":"Rezultate anterioare","sc.note":"O autoevaluare a stilului de viață, nu o măsură a vârstei biologice sau a riscului de boală.","lb.h":"Panou de biomarkeri","lb.p":"Introdu valorile din buletinul de analize. VITALIS le compară cu pragurile de referință folosite frecvent la adulți. Unități: mg/dL, dacă nu se specifică altfel.","lb.sex":"Sex (unele praguri diferă)","lb.sum":"{0} în limite · {1} de urmărit · {2} de discutat","lb.rng":"Referință","lb.copy":"Copiază rezumatul","lb.copied":"Copiat","lb.note":"Intervalele de referință diferă între laboratoare și ghiduri. O valoare în afara intervalului nu este un diagnostic, iar o valoare în interval nu este o garanție. Discută rezultatele cu un medic.","l.glu":"Glicemie à jeun","l.a1c":"HbA1c","l.tg":"Trigliceride","l.hdl":"Colesterol HDL","l.ldl":"Colesterol LDL","l.apob":"ApoB","l.sys":"Tensiune arterială sistolică","l.dia":"Tensiune arterială diastolică","l.crp":"hs-CRP","l.vitd":"Vitamina D (25-OH)","l.ferr":"Feritină","l.tsh":"TSH","l.alt":"ALT","l.rhr":"Puls de repaus","ri.h":"Ritual zilnic","ri.p":"Douăsprezece obiceiuri mici. Atinge un pătrat pentru a marca o zi. Țintește constanța, nu perfecțiunea.","ri.today":"Azi: {0}/{1}","ri.streak":"Serie: {0} zile cu cel puțin jumătate din obiceiuri bifate","ri.week":"Media pe 7 zile: {0}%","ri.add":"Adaugă","ri.ph":"Adaugă propriul obicei…","ri.del":"Șterge","h.wake":"Oră fixă de trezire","h.light":"Lumină de afară în prima oră după trezire","h.steps":"Peste 7.000 de pași","h.train":"Sesiune de forță sau cardio (în zilele de antrenament)","h.protein":"Proteine la fiecare masă principală","h.fiber":"Legume sau fibre la două mese","h.nosugar":"Fără băuturi zaharoase","h.caf":"Fără cafeină în cele 8 ore dinainte de culcare","h.screens":"Ecrane oprite cu 60 de minute înainte de culcare","h.breath":"5 minute de respirație lentă","h.social":"Timp semnificativ cu cineva","h.learn":"20 de minute de învățat sau citit","gl.h":"Glosar","gl.p":"Definiții pe înțelesul tuturor ale termenilor pe care îi vei auzi la un eveniment de biohacking.","gl.search":"Caută un termen…","gl.none":"Niciun termen potrivit.","g.ir.t":"Rezistența la insulină","g.ir.d":"Celulele răspund slab la insulină, așa că organismul are nevoie de mai multă pentru a scoate glucoza din sânge. Un pas timpuriu spre diabetul de tip 2.","g.homa.t":"HOMA-IR","g.homa.d":"Estimare a rezistenței la insulină din glicemia și insulina à jeun: glucoză (mg/dL) × insulină (µIU/mL) ÷ 405.","g.a1c.t":"HbA1c","g.a1c.d":"Proporția de hemoglobină care transportă zahăr; reflectă glicemia medie din ultimele aproximativ trei luni.","g.ketones.t":"Cetone","g.ketones.d":"Molecule produse de ficat din grăsimi când aportul de carbohidrați este foarte scăzut sau în timpul postului prelungit; un combustibil alternativ pentru creier și mușchi.","g.autophagy.t":"Autofagie","g.autophagy.d":"Procesul de reciclare al celulei, care elimină componentele deteriorate. Postul și exercițiul o influențează; dovezile la oameni privind beneficiile sunt încă în dezvoltare.","g.mtor.t":"mTOR","g.mtor.d":"O cale de semnalizare a creșterii, activată de nutrienți, mai ales de aminoacizi; esențială pentru construirea țesuturilor și studiată în îmbătrânire.","g.ampk.t":"AMPK","g.ampk.d":"Un senzor de energie activat de exercițiu și de disponibilitatea scăzută a energiei, care favorizează folosirea grăsimilor și sănătatea mitocondriilor.","g.nad.t":"NAD+","g.nad.d":"O coenzimă centrală pentru metabolismul energetic, al cărei nivel scade cu vârsta. Suplimentele care o cresc nu au arătat încă un beneficiu clinic clar la oameni.","g.mito.t":"Mitocondrii","g.mito.d":"Centralele energetice ale celulei. Numărul și calitatea lor răspund la exercițiu și sunt legate de sănătatea metabolică.","g.hormesis.t":"Hormeză","g.hormesis.d":"Un răspuns adaptativ benefic la o doză mică de factor de stres, precum exercițiul, căldura sau frigul; dăunător la doze mari.","g.vo2.t":"VO2max","g.vo2.d":"Rata maximă la care organismul tău poate folosi oxigenul în timpul efortului; un marker puternic al condiției cardiorespiratorii și al longevității.","g.hrv.t":"HRV","g.hrv.d":"Variabilitatea frecvenței cardiace: variația timpului dintre bătăi. Folosită ca indicator aproximativ al recuperării și stresului; compară-o cu propria valoare de referință.","g.healthspan.t":"Ani sănătoși (healthspan)","g.healthspan.d":"Numărul de ani trăiți în stare bună de sănătate, spre deosebire de durata vieții, adică totalul anilor trăiți.","g.senescence.t":"Senescența celulară","g.senescence.d":"Celule care nu se mai divid, dar rămân active și eliberează semnale inflamatorii; se acumulează odată cu vârsta.","g.circadian.t":"Ritm circadian","g.circadian.d":"Ceasul intern de aproximativ 24 de ore care guvernează somnul, hormonii și metabolismul, reglat în principal de lumină.","g.glyvar.t":"Variabilitate glicemică","g.glyvar.d":"Cât de mult oscilează glicemia în sus și în jos în timpul zilei. Oscilațiile mari pot conta dincolo de medie.","g.apob.t":"ApoB","g.apob.d":"Proteina de pe fiecare particulă lipoproteică aterogenă; concentrația ei aproximează numărul de particule care pot pătrunde în pereții arterelor.","g.crp.t":"hs-CRP","g.crp.d":"Un marker sanguin al inflamației de grad scăzut, legat de riscul cardiovascular. Crește în infecții.","g.epiclock.t":"Ceas epigenetic","g.epiclock.d":"O estimare statistică a vârstei biologice pe baza tiparelor de metilare a ADN-ului. Interesant în cercetare, cu utilizare clinică limitată astăzi.","g.zone2.t":"Zona 2","g.zone2.d":"Efort aerob ușor, la care poți încă purta o conversație; construiește baza mitocondrială și aerobă.","g.sarco.t":"Sarcopenie","g.sarco.d":"Pierderea de masă și forță musculară legată de vârstă, pe care antrenamentul de rezistență și proteinele ajută să o prevină.","g.microbiome.t":"Microbiom","g.microbiome.d":"Trilioanele de microbi din intestin care influențează digestia, imunitatea și metabolismul; dietele diverse, bogate în fibre, îl sprijină.","g.vfat.t":"Grăsime viscerală","g.vfat.d":"Grăsimea depozitată în jurul organelor interne; mai activă metabolic și mai strâns legată de rezistența la insulină decât grăsimea de sub piele.","g.cgm.t":"CGM","g.cgm.d":"Monitor continuu al glucozei: un senzor pe piele care înregistrează glicemia pe parcursul zilei. Util în diabet; valoarea pentru persoanele sănătoase este încă dezbătută.","my.h":"Mituri vs dovezi","my.p":"Biohackingul amestecă știința solidă cu marketingul. Atinge pentru a compara.","my.m":"Mit","my.r":"Ce spun dovezile","my.detox.m":"Sucurile și ceaiurile detox curăță organismul.","my.detox.r":"Ficatul, rinichii, plămânii și intestinul fac deja asta. Niciun produs detox nu s-a dovedit că elimină toxinele mai bine decât fiziologia normală.","my.supps.m":"Cu cât mai multe suplimente, cu atât mai bine.","my.supps.r":"Dincolo de corectarea unui deficit, beneficiile sunt mici sau nedovedite, iar dozele mari pot dăuna sau pot interacționa cu medicamentele.","my.bioage.m":"Un test de vârstă biologică îți spune vârsta reală exactă.","my.bioage.r":"Ceasuri diferite dau răspunsuri diferite și niciunul nu este încă validat pentru a ghida decizii de tratament individuale.","my.cold.m":"Băile reci ard grăsimea și prelungesc viața.","my.cold.r":"Frigul crește starea de alertă și poate îmbunătăți acut dispoziția; lipsesc dovezile la oameni pentru pierderea de grăsime sau o viață mai lungă.","my.fasting.m":"Postul este potrivit pentru toată lumea.","my.fasting.r":"Rezultatele variază, iar postul poate fi nepotrivit sau nesigur pentru unele grupuri. Cel mai bun tipar alimentar este cel pe care îl poți menține în siguranță.","my.onediet.m":"O singură dietă este optimă pentru toți oamenii.","my.onediet.r":"Răspunsurile individuale diferă în privința glicemiei, apetitului și toleranței. Respectarea dietei și calitatea alimentelor contează mai mult decât eticheta.","my.sleepcatch.m":"Poți recupera complet somnul în weekend.","my.sleepcatch.r":"Somnul în plus ajută parțial, dar orele neregulate și somnul scurt repetat tot au costuri metabolice.","my.steps.m":"Contează doar 10.000 de pași.","my.steps.r":"Beneficiile încep cu mult sub această valoare și se aplatizează la aproximativ 7.000–10.000 de pași pe zi; orice creștere ajută.","ft.disc":"VITALIS are scop educațional general. Nu diagnostichează, nu tratează și nu înlocuiește sfatul medical profesionist. Consultă un medic calificat înainte de a-ți schimba alimentația, exercițiile, suplimentele sau medicația.","ft.license":"Licență MIT · © 2026 Alexandru-Ionuț Chiuță (Alexio)","ft.tf":"Trade-free · offline · fără urmărire: datele tale rămân în acest browser.","ft.src":"Inspirat de conferința Biohacking360 (biohacking360.com). Neoficial, fără afiliere.","ft.bmc":"Cumpără-mi o cafea","ft.export":"Exportă datele mele","ft.import":"Importă date","ft.reset":"Șterge toate datele","ft.resetq":"Ștergi toate datele salvate în acest browser?","ft.imp.ok":"Date importate.","ft.imp.err":"Fișierul nu a putut fi citit.","theme":"Schimbă tema","o.range":"Unele valori par în afara intervalului plauzibil. Verifică-le.","ri.max":"Maximum 20 de obiceiuri proprii.","nav.aria":"Secțiuni","lang.aria":"Limbă","ft.imp.big":"Fișierul este prea mare sau invalid."},"en":{"title":"VITALIS — ultimate health, longevity & biohacking","skip":"Skip to content","brand.sub":"health · longevity · biohacking","nav.home":"Home","nav.event":"Conference","nav.pillars":"Pillars","nav.tools":"Tools","nav.score":"Score 360","nav.labs":"Biomarkers","nav.ritual":"Daily ritual","nav.gloss":"Glossary","home.eyebrow":"The ultimate health, longevity & biohacking experience","home.h1":"Upgrade your health, one cell at a time.","home.lead":"VITALIS is a private, offline companion for human optimization: nine evidence-ranked pillars, calculators, a lifestyle score, a biomarker panel and a daily ritual tracker. Inspired by the Biohacking360 conference in Bucharest.","home.cta1":"Explore the pillars","home.cta2":"The conference","home.prob.h":"Which of these sounds familiar?","home.prob.p":"Tap what applies to you. VITALIS points to the pillars most likely to help.","home.prob.none":"Select one or more to get suggestions.","home.prob.rec":"Suggested pillars","home.out.h":"Biohacking solutions","home.inside.h":"What is inside","cd.d":"days","cd.h":"hours","cd.m":"min","cd.s":"sec","cd.until":"until Biohacking360 — Nord Events, Bucharest, 14 November 2026","cd.live":"Biohacking360 is happening today in Bucharest.","cd.done":"Biohacking360 (14 November 2026) has taken place.","prob.fatigue":"Chronic fatigue","prob.energy":"Low energy","prob.sleep":"Poor sleep","prob.deficiency":"Nutritional deficiencies","prob.chaotic":"Chaotic nutrition","prob.anxiety":"Anxiety & stress","prob.shape":"Declining physical shape","prob.mental":"Mental performance issues","out.stamina.t":"Restore your stamina","out.stamina.d":"Fix the basics that drain energy: sleep, blood sugar swings, inactivity.","out.vitality.t":"Build your vitality","out.vitality.d":"Strength, fitness and metabolic health are the base of a long healthspan.","out.performance.t":"Increase your performance","out.performance.d":"Focus, recovery and stress control that hold up under pressure.","out.longevity.t":"Achieve longevity","out.longevity.d":"Prioritize the levers with the strongest evidence for more healthy years.","inside.event.t":"Conference guide","inside.event.d":"Agenda, speakers, tickets, expo and a preparation kit for Biohacking360.","inside.pillars.t":"Nine pillars","inside.pillars.d":"Sleep, metabolism, movement, stress, brain, hormesis, connection, measurement, supplements.","inside.tools.t":"Calculators & timers","inside.tools.d":"HOMA-IR, TyG, energy needs, heart-rate zones, sleep cycles, fasting timer, breathing pacer.","inside.score.t":"Score 360","inside.score.d":"An 18-question lifestyle check with a radar chart of your strengths and gaps.","inside.labs.t":"Biomarker panel","inside.labs.d":"Enter lab values and see which ones are in range or worth discussing with your doctor.","inside.ritual.t":"Daily ritual","inside.ritual.d":"Twelve small habits, a seven-day grid and a streak counter.","inside.gloss.t":"Glossary & myths","inside.gloss.d":"24 key terms and 8 popular myths, checked against the evidence.","ev.h":"Biohacking360 — conference guide","ev.date":"Saturday, 14 November 2026 · Nord Events, Bucharest","ev.s1":"participants","ev.s2":"exhibitors","ev.s3":"hours of actionable content","ev.note":"Unofficial companion based on information published at biohacking360.com on 5 November 2026. Programme, prices and availability can change: always confirm on the official site.","ev.site":"Official website","ev.tickets":"Get tickets","ev.sp.h":"Speakers","sp.bik.role":"Metabolic scientist · insulin resistance","sp.bik.b":"Researcher in obesity, insulin resistance and mitochondrial dysfunction; PhD in bioenergetics with a postdoctoral fellowship at Duke-NUS Medical School, Singapore. Author of Why We Get Sick and How Not To Get Sick.","sp.bos.role":"Physician · ketogenic medicine","sp.bos.b":"Physician with 30+ years of experience in chronic disease, brain health and addiction recovery. Author of Any Way You Can, with over one million books sold and a YouTube community of 1.2 million subscribers.","ev.ag.h":"Agenda","ev.ag.p":"Tick the sessions you plan to attend to build your day.","ev.ag.mine":"{0} of {1} items in my day","ag.reg":"Registration · coffee & networking","ag.open":"Event opening","ag.s1":"Session 1 — Insulin Resistance and Your Metabolic Health (Dr. Ben Bikman)","ag.s1.d":"What insulin resistance is, how it links to obesity, mitochondrial dysfunction and chronic disease, and what low-carb research means for metabolism.","ag.brk":"Coffee break","ag.back":"Welcome back","ag.s2":"Session 2 — Ketogenic Medicine for Brain Health and Chronic Disease (Dr. Annette Bosworth)","ag.s2.d":"How ketogenic diets are used in medicine for chronic conditions, what food does to the brain, and lessons from 30+ years of practice.","ag.qa":"Q&A with Dr. Annette Bosworth","ag.close":"Closing & networking","ag.vip":"VIP reception (First Class ticket holders; location sent by SMS)","ev.tk.h":"Tickets","tk.vat":"+ VAT","tk.ga.n":"General Access — Early Bird","tk.ga.d":"Both masterclasses, expo area and product demos, networking, participation certificate.","tk.fc.n":"First Class","tk.seats":"Only 10 seats","tk.fc.d":"Adds the VIP reception, front-row seats, fast-track check-in and a private dinner with the speakers. Check the official site for exact inclusions.","ev.ex.h":"Expo area","ev.ex.p":"Hands-on testing, live demos and workshops, plus zones that decode your health in minutes.","ex.wear.t":"Wearables & monitoring","ex.wear.d":"Smart sensors, biometric wearables and real-time health tracking.","ex.nutri.t":"Nutrition & supplements","ex.nutri.d":"Next-generation supplements and nutraceuticals tailored to DNA, microbiome and lifestyle.","ex.recov.t":"Recovery solutions","ex.recov.d":"Cryotherapy, red light, infrared saunas and hyperbaric oxygen chambers.","ex.diag.t":"Diagnostics & longevity clinics","ex.diag.d":"DNA and metabolic testing, cognitive performance scans, personalized programmes.","ev.prep.h":"Preparation kit","prep.q1":"Questions for Dr. Ben Bikman","pb1":"Which early signs of insulin resistance should I ask my doctor to measure?","pb2":"How much do sleep and stress change insulin sensitivity compared with diet?","pb3":"If I am not eating low-carb, which first steps have the biggest impact?","prep.q2":"Questions for Dr. Annette Bosworth","pz1":"Which safety checks are needed before starting a ketogenic diet, especially with medication?","pz2":"What does current evidence say about ketones and brain health, and what is still unknown?","pz3":"Which markers show whether it is working for me?","prep.q3":"Questions for exhibitors","px1":"What human trials support this product or device, and were they independent?","px2":"What are the side effects and who should not use it?","px3":"How is my health data stored, shared or sold?","px4":"What is the total cost, including subscriptions, and what is the refund policy?","px5":"Is the claim based on my health outcome or on a surrogate measure?","prep.q4":"Pack list","pk1":"Ticket on your phone","pk2":"Notebook or notes app","pk3":"Recent lab results","pk4":"List of your medication and supplements","pk5":"Charged phone or power bank","pk6":"Comfortable shoes and a water bottle","pil.h":"The nine pillars","pil.p":"Ordered by how well the evidence supports them. Open a pillar for the why, three first moves and common pitfalls.","pil.act":"First moves","pil.pit":"Watch out","pil.ev":"Evidence","evd.strong":"Strong evidence","evd.moderate":"Moderate evidence","evd.emerging":"Emerging evidence","evd.varies":"Varies by product","p.sleep.t":"Sleep & circadian rhythm","p.sleep.tag":"The foundation that every other pillar rests on","p.sleep.why":"Sleep consolidates memory, regulates appetite hormones, insulin sensitivity and mood. Chronic short or irregular sleep is linked to higher risk of obesity, diabetes, cardiovascular disease and depression.","p.sleep.a1":"Keep a fixed wake-up time, including weekends, and get outdoor light within an hour of waking.","p.sleep.a2":"Stop caffeine at least 8 hours before bed and keep the bedroom dark, quiet and cool (about 16–19 °C).","p.sleep.a3":"Dim lights and put screens away for the last hour; aim for 7–9 hours in bed for most adults.","p.sleep.pit":"Alcohol shortens and fragments sleep, and consumer sleep trackers are rough estimates: trust how you feel and the trend, not a single night.","p.metab.t":"Metabolic health & insulin","p.metab.tag":"Nutrition that keeps blood sugar and insulin steady","p.metab.why":"Insulin resistance, often driven by excess visceral fat, inactivity, poor sleep and ultra-processed food, sits upstream of type 2 diabetes, fatty liver and much cardiovascular disease. Many people improve by cutting refined carbohydrates and sugary drinks; low-carb or ketogenic eating is one effective option, not the only one.","p.metab.a1":"Build meals around protein, fibre-rich plants and minimally processed foods; drop sugary drinks first.","p.metab.a2":"Walk 10–15 minutes after your largest meals; it blunts the glucose rise.","p.metab.a3":"Track waist-to-height ratio and, with your doctor, fasting glucose, HbA1c, triglycerides and fasting insulin.","p.metab.pit":"If you take medication for diabetes or blood pressure, never change doses or start a ketogenic diet or fasting without medical supervision.","p.move.t":"Movement & fitness","p.move.tag":"Muscle and cardiorespiratory fitness are strong predictors of lifespan","p.move.why":"Aerobic fitness (VO2max) and muscle strength are among the strongest modifiable predictors of mortality, and muscle is also a major site of glucose disposal.","p.move.a1":"Accumulate 150–300 minutes a week of moderate activity, with a large share easy enough to talk (zone 2).","p.move.a2":"Lift or do resistance training at least twice a week, working every major muscle group.","p.move.a3":"Add one short hard interval session a week if you are healthy, and walk as many daily steps as you comfortably can.","p.move.pit":"Ramp up gradually; sudden large jumps in load cause most injuries. See a doctor first if you have heart disease or symptoms.","p.stress.t":"Stress & emotional resilience","p.stress.tag":"Train the nervous system to recover","p.stress.why":"Chronic stress disrupts sleep, appetite, blood pressure and immune function. Skills such as slow breathing, time in nature and cognitive-behavioural methods have measurable effects on anxiety and well-being.","p.stress.a1":"Practise slow breathing at about 5–6 breaths per minute for 5 minutes, once or twice a day.","p.stress.a2":"Schedule real recovery: a daily walk outdoors, a hobby or time without screens.","p.stress.a3":"Name your main stressors and change one of them; use therapy or CBT-based programmes when anxiety persists.","p.stress.pit":"A breathing app cannot fix an overloaded life or clinical anxiety and depression: seek professional help when symptoms last or impair daily life.","p.brain.t":"Brain optimization","p.brain.tag":"Protect memory, focus and creativity for decades","p.brain.why":"Large reviews attribute roughly 45% of dementia cases to modifiable risk factors: hypertension, hearing loss, inactivity, smoking, diabetes, isolation and more. Exercise, sleep, learning and social contact all help.","p.brain.a1":"Control blood pressure, correct hearing and vision problems and avoid smoking.","p.brain.a2":"Do things that are hard and new: a language, an instrument, a skill with feedback.","p.brain.a3":"Protect deep work: single-tasking blocks of 60–90 minutes with notifications off.","p.brain.pit":"Research on ketones and brain health is promising but still emerging; nootropic supplements rarely beat sleep, exercise and learning.","p.hormesis.t":"Hormesis: heat, cold, light & fasting","p.hormesis.tag":"Small, controlled stress that can build resilience","p.hormesis.why":"Sauna bathing has been associated with lower cardiovascular mortality in observational studies; cold exposure raises alertness acutely; time-restricted eating may help some people. Most long-term benefit data are observational or from small trials.","p.hormesis.a1":"Try regular sauna sessions of 10–20 minutes, building up gradually and staying hydrated.","p.hormesis.a2":"If you like cold showers or plunges, start brief and avoid them right after strength training if muscle growth is your goal.","p.hormesis.a3":"A 12–14 hour overnight eating gap is an easy, low-risk starting point.","p.hormesis.pit":"Heat, cold and fasting are not safe for everyone: heart disease, pregnancy, eating disorders, diabetes treatment and alcohol use call for medical advice.","p.connect.t":"Connection & purpose","p.connect.tag":"The most underrated longevity factor","p.connect.why":"Loneliness and social isolation are associated with mortality risk comparable to other major lifestyle factors, while strong relationships and a sense of purpose are associated with better health and longer life.","p.connect.a1":"Schedule recurring contact with people you care about and protect it like a medical appointment.","p.connect.a2":"Join a group built around something you enjoy: sport, volunteering, a craft, a community.","p.connect.a3":"Write down what gives your days meaning and align one weekly action with it.","p.connect.pit":"Social media is not a substitute for in-person contact; quality of relationships matters more than quantity.","p.measure.t":"Measurement & diagnostics","p.measure.tag":"Know your numbers, act on trends","p.measure.why":"Blood pressure, glucose, lipids, inflammation and nutrient status reveal problems years before symptoms. Wearables add trends in resting heart rate, HRV and sleep. Direct-to-consumer DNA and biological-age tests have limited clinical value today.","p.measure.a1":"Check blood pressure regularly and ask for fasting glucose, HbA1c, lipids with ApoB, hs-CRP and vitamin D.","p.measure.a2":"Use wearables for trends over weeks, not for single-day verdicts.","p.measure.a3":"Retest after 8–12 weeks of a change to see whether it worked.","p.measure.pit":"More testing is not always better: abnormal results without a clear action can cause anxiety and unnecessary procedures. Interpret results with a clinician.","p.supp.t":"Smart supplementation","p.supp.tag":"Fill gaps, do not chase miracles","p.supp.why":"A few supplements have good human evidence when used for the right reason; many marketed longevity compounds do not. Food, sleep and exercise come first.","p.supp.a1":"Test before you supplement: vitamin D, ferritin and B12 are common gaps.","p.supp.a2":"Creatine monohydrate (3–5 g a day) has strong evidence for muscle and strength; omega-3 can help when oily fish intake is low.","p.supp.a3":"Choose third-party tested products and introduce one change at a time.","p.supp.pit":"Megadoses, stacking many products and unregulated blends carry risks and interactions with medication. Evidence for NAD+ boosters and resveratrol in humans is still insufficient.","tools.h":"Calculators & timers","tools.p":"Everything runs locally in your browser; nothing is sent anywhere.","disc.short":"Educational tools, not medical advice or diagnosis.","t.met.h":"Insulin resistance & metabolic markers","t.met.p":"Fill what you have: glucose and insulin give HOMA-IR; triglycerides and glucose give the TyG index; waist and height give the waist-to-height ratio.","t.met.note":"Cut-offs vary by laboratory, assay and population; treat results as a conversation starter for your doctor.","f.glu":"Fasting glucose","f.ins":"Fasting insulin","f.tg":"Triglycerides","f.waist":"Waist","f.height":"Height","o.homa":"HOMA-IR","o.tyg":"TyG index","o.whtr":"Waist-to-height ratio","o.need":"Fill in the fields to see results.","st.ok":"In target range","st.watch":"Worth watching","st.flag":"Discuss with a doctor","t.en.h":"Energy & protein needs","t.en.p":"Mifflin-St Jeor estimate of resting and daily energy, plus protein targets.","f.sex":"Sex","sex.m":"Male","sex.f":"Female","f.age":"Age","f.weight":"Weight","f.act":"Activity level","act.1":"Sedentary (desk job, little exercise)","act.2":"Light (1–3 workouts a week)","act.3":"Moderate (3–5 workouts a week)","act.4":"High (6–7 workouts a week)","act.5":"Very high (physical job and training)","o.bmr":"Resting energy (BMR)","o.tdee":"Daily energy (TDEE)","o.prot1":"Protein, general adults","o.prot2":"Protein, with ame time every day and get daylight early.","q.sleep.2":"I sleep 7–9 hours and wake up fairly rested.","q.metab.1":"My meals are built mostly on protein, vegetables and minimally processed food.","q.metab.2":"I rarely drink sugary drinks or eat sweets and snacks between meals.","q.move.1":"I exercise at a moderate level for 150 minutes or more a week.","q.move.2":"I do strength training at least twice a week.","q.stress.1":"I have a daily practice that calms me down, such as breathing, walking or meditation.","q.stress.2":"I recover well after stressful days and rarely feel overwhelmed.","q.brain.1":"I regularly learn something new or do demanding mental work.","q.brain.2":"I can focus for 60 minutes without constantly checking my phone.","q.hormesis.1":"I use heat, cold, fasting windows or similar practices safely and regularly.","q.hormesis.2":"I leave a gap of at least 12 hours between my last meal and the first one the next day.","q.connect.1":"I spend meaningful time with people I care about every week.","q.connect.2":"I feel my days have purpose and direction.","q.measure.1":"I know my recent blood pressure, glucose and cholesterol values.","q.measure.2":"I check in with my doctor and test when it is due, not only when I am ill.","q.supp.1":"I take supplements only for a reason, ideally after testing.","q.supp.2":"I know what I take, in what dose, and whether it interacts with my medication.","sc.prog":"{0}/{1} answered","sc.go":"See my Score 360","sc.res.h":"Your result","sc.overall":"Overall","sc.hi":"Strong foundation. Keep what works and fine-tune your weakest pillar.","sc.mid":"Solid base with clear room to grow. Pick the lowest pillar and make one change this week.","sc.lo":"Start with the basics: sleep, movement and food quality. Small steps, repeated, win.","sc.weak":"Start with","sc.open":"Open pillar","sc.retake":"Retake the check","sc.hist":"Previous results","sc.note":"A lifestyle self-assessment, not a measure of biological age or disease risk.","lb.h":"Biomarker panel","lb.p":"Type values from your lab report. VITALIS compares them with commonly used adult reference thresholds. Units: mg/dL unless stated.","lb.sex":"Sex (some thresholds differ)","lb.sum":"{0} in range · {1} to watch · {2} to discuss","lb.rng":"Reference","lb.copy":"Copy summary","lb.copied":"Copied","lb.note":"Reference ranges differ between laboratories and guidelines. A value outside a range is not a diagnosis, and a value inside a range is not a guarantee. Review results with a clinician.","l.glu":"Fasting glucose","l.a1c":"HbA1c","l.tg":"Triglycerides","l.hdl":"HDL cholesterol","l.ldl":"LDL cholesterol","l.apob":"ApoB","l.sys":"Systolic blood pressure","l.dia":"Diastolic blood pressure","l.crp":"hs-CRP","l.vitd":"Vitamin D (25-OH)","l.ferr":"Ferritin","l.tsh":"TSH","l.alt":"ALT","l.rhr":"Resting heart rate","ri.h":"Daily ritual","ri.p":"Twelve small habits. Tap a square to mark a day. Aim for consistency, not perfection.","ri.today":"Today: {0}/{1}","ri.streak":"Streak: {0} days with at least half the habits done","ri.week":"7-day average: {0}%","ri.add":"Add","ri.ph":"Add your own habit…","ri.del":"Remove","h.wake":"Fixed wake-up time","h.light":"Outdoor light within an hour of waking","h.steps":"7,000+ steps","h.train":"Strength or cardio session (training days)","h.protein":"Protein at each main meal","h.fiber":"Vegetables or fibre at two meals","h.nosugar":"No sugary drinks","h.caf":"No caffeine in the 8 hours before bed","h.screens":"Screens off 60 minutes before bed","h.breath":"5 minutes of slow breathing","h.social":"Meaningful time with someone","h.learn":"20 minutes of learning or reading","gl.h":"Glossary","gl.p":"Plain-language definitions of terms you will hear at a biohacking event.","gl.search":"Search a term…","gl.none":"No matching term.","g.ir.t":"Insulin resistance","g.ir.d":"Cells respond poorly to insulin, so the body needs more of it to move glucose out of the blood. An early step toward type 2 diabetes.","g.homa.t":"HOMA-IR","g.homa.d":"Estimate of insulin resistance from fasting glucose and fasting insulin: glucose (mg/dL) × insulin (µIU/mL) ÷ 405.","g.a1c.t":"HbA1c","g.a1c.d":"The share of haemoglobin carrying sugar; reflects average blood glucose over about three months.","g.ketones.t":"Ketones","g.ketones.d":"Molecules made from fat by the liver when carbohydrate intake is very low or during prolonged fasting; an alternative fuel for the brain and muscles.","g.autophagy.t":"Autophagy","g.autophagy.d":"The cell's recycling process that clears damaged components. Fasting and exercise influence it; human evidence on benefits is still developing.","g.mtor.t":"mTOR","g.mtor.d":"A growth-signalling pathway activated by nutrients, especially amino acids; essential for building tissue and studied in ageing.","g.ampk.t":"AMPK","g.ampk.d":"An energy sensor switched on by exercise and low energy availability, promoting fat use and mitochondrial health.","g.nad.t":"NAD+","g.nad.d":"A coenzyme central to energy metabolism that declines with age. Supplements that raise it have not yet shown clear clinical benefit in humans.","g.mito.t":"Mitochondria","g.mito.d":"The cell's power plants. Their number and quality respond to exercise and are linked to metabolic health.","g.hormesis.t":"Hormesis","g.hormesis.d":"A beneficial adaptive response to a low dose of a stressor, such as exercise, heat or cold; harmful at high doses.","g.vo2.t":"VO2max","g.vo2.d":"The maximum rate at which your body can use oxygen during exercise; a strong marker of cardiorespiratory fitness and longevity.","g.hrv.t":"HRV","g.hrv.d":"Heart-rate variability: variation in time between heartbeats. Used as a rough indicator of recovery and stress; compare to your own baseline.","g.healthspan.t":"Healthspan","g.healthspan.d":"The number of years lived in good health, as opposed to lifespan, the total years lived.","g.senescence.t":"Cellular senescence","g.senescence.d":"Cells that stop dividing but stay active and release inflammatory signals; accumulate with age.","g.circadian.t":"Circadian rhythm","g.circadian.d":"The roughly 24-hour internal clock that governs sleep, hormones and metabolism, set mainly by light.","g.glyvar.t":"Glycemic variability","g.glyvar.d":"How much blood glucose swings up and down during the day. Large swings may matter beyond the average.","g.apob.t":"ApoB","g.apob.d":"The protein on every atherogenic lipoprotein particle; its concentration approximates the number of particles that can enter artery walls.","g.crp.t":"hs-CRP","g.crp.d":"A blood marker of low-grade inflammation, related to cardiovascular risk. Spikes during infection.","g.epiclock.t":"Epigenetic clock","g.epiclock.d":"A statistical estimate of biological age from DNA methylation patterns. Interesting in research, with limited clinical use today.","g.zone2.t":"Zone 2","g.zone2.d":"Easy aerobic effort where you can still hold a conversation; builds mitochondrial and aerobic base.","g.sarco.t":"Sarcopenia","g.sarco.d":"Age-related loss of muscle mass and strength, which resistance training and protein help prevent.","g.microbiome.t":"Microbiome","g.microbiome.d":"The trillions of microbes in your gut that influence digestion, immunity and metabolism; fibre-rich diverse diets support it.","g.vfat.t":"Visceral fat","g.vfat.d":"Fat stored around internal organs; more metabolically active and strongly linked to insulin resistance than fat under the skin.","g.cgm.t":"CGM","g.cgm.d":"Continuous glucose monitor: a skin sensor that records glucose throughout the day. Useful in diabetes; value for healthy people is still debated.","my.h":"Myths vs evidence","my.p":"Biohacking mixes solid science with marketing. Tap to compare.","my.m":"Myth","my.r":"What the evidence says","my.detox.m":"Detox juices and teas cleanse your body.","my.detox.r":"Liver, kidneys, lungs and gut already do this. No detox product has been shown to remove toxins better than normal physiology.","my.supps.m":"The more supplements, the better.","my.supps.r":"Beyond correcting a deficiency, benefits are small or unproven, and high doses can harm or interact with medication.","my.bioage.m":"A biological-age test tells your exact real age.","my.bioage.r":"Different clocks give different answers, and none is validated to guide individual treatment decisions yet.","my.cold.m":"Cold plunges burn fat and extend life.","my.cold.r":"Cold raises alertness and can improve mood acutely; evidence for fat loss or longer life in humans is lacking.","my.fasting.m":"Fasting is right for everyone.","my.fasting.r":"Results vary, and fasting can be unsuitable or unsafe for some groups. The best eating pattern is one you can sustain safely.","my.onediet.m":"One diet is optimal for all people.","my.onediet.r":"Individual responses differ in glucose, appetite and tolerance. Adherence and food quality matter more than the label.","my.sleepcatch.m":"You can fully catch up on sleep at the weekend.","my.sleepcatch.r":"Extra sleep helps partly, but irregular timing and repeated short sleep still carry metabolic costs.","my.steps.m":"Only 10,000 steps count.","my.steps.r":"Benefits start well below that and flatten at roughly 7,000–10,000 steps a day; any increase helps.","ft.disc":"VITALIS is for general education. It does not diagnose, treat or replace professional medical advice. Consult a qualified clinician before changing diet, exercise, supplements or medication.","ft.license":"MIT licence · © 2026 Alexandru-Ionuț Chiuță (Alexio)","ft.tf":"Trade-free · offline · no tracking: your data stays in this browser.","ft.src":"Inspired by the Biohacking360 conference (biohacking360.com). Unofficial, not affiliated.","ft.bmc":"Buy me a coffee","ft.export":"Export my data","ft.import":"Import data","ft.reset":"Erase all data","ft.resetq":"Erase all data saved in this browser?","ft.imp.ok":"Data imported.","ft.imp.err":"The file could not be read.","theme":"Switch theme","o.range":"Some values look outside the plausible range. Please check them.","ri.max":"Maximum 20 custom habits.","nav.aria":"Sections","lang.aria":"Language","ft.imp.big":"The file is too large or invalid."},"fr":{"title":"VITALIS — santé, longévité et biohacking au sommet","skip":"Aller au contenu","brand.sub":"santé · longévité · biohacking","nav.home":"Accueil","nav.event":"Conférence","nav.pillars":"Piliers","nav.tools":"Outils","nav.score":"Score 360","nav.labs":"Biomarqueurs","nav.ritual":"Rituel quotidien","nav.gloss":"Glossaire","home.eyebrow":"L'expérience ultime de santé, longévité et biohacking","home.h1":"Améliore ta santé, cellule après cellule.","home.lead":"VITALIS est un compagnon privé et hors ligne pour l'optimisation humaine : neuf piliers classés selon les preuves, des calculateurs, un score de mode de vie, un panel de biomarqueurs et un suivi de rituel quotidien. Inspiré de la conférence Biohacking360 à Bucarest.","home.cta1":"Explorer les piliers","home.cta2":"La conférence","home.prob.h":"Lequel de ces cas te parle ?","home.prob.p":"Touche ce qui te concerne. VITALIS t'oriente vers les piliers les plus susceptibles d'aider.","home.prob.none":"Sélectionne un ou plusieurs éléments pour obtenir des suggestions.","home.prob.rec":"Piliers suggérés","home.out.h":"Solutions de biohacking","home.inside.h":"Au programme","cd.d":"jours","cd.h":"heures","cd.m":"min","cd.s":"s","cd.until":"avant Biohacking360 — Nord Events, Bucarest, 14 novembre 2026","cd.live":"Biohacking360 a lieu aujourd'hui à Bucarest.","cd.done":"Biohacking360 (14 novembre 2026) a eu lieu.","prob.fatigue":"Fatigue chronique","prob.energy":"Manque d'énergie","prob.sleep":"Mauvais sommeil","prob.deficiency":"Carences nutritionnelles","prob.chaotic":"Alimentation désordonnée","prob.anxiety":"Anxiété et stress","prob.shape":"Forme physique en baisse","prob.mental":"Troubles de la performance mentale","out.stamina.t":"Retrouve ton endurance","out.stamina.d":"Corrige les bases qui drainent l'énergie : sommeil, variations de glycémie, sédent
